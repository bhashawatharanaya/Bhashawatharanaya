<style>

  --bg:#141824; --surface:#1C2131; --leaf:#2A2A22; --ink:#E7E8EE; --muted:#A3A8B8;
  --line:#2F3547; --accent:#E2B24A; --accent-soft:#3A3220; --ok:#6CC490; --bad:#EE8080; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141824; --surface:#1C2131; --leaf:#2A2A22; --ink:#E7E8EE; --muted:#A3A8B8;

header.leaf{margin-top:16px;background:var(--leaf);border-radius:6px;padding:20px 22px;position:relative;overflow:hidden}
header.leaf::before,header.leaf::after{content:"";position:absolute;top:50%;width:10px;height:10px;border-radius:50%;background:var(--bg);transform:translateY(-50%)}
header.leaf::before{left:22%}header.leaf::after{right:22%}
h1{font-family:var(--display);font-size:1.7rem;margin:0;line-height:1.3;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0;font-size:.92rem}

nav button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

h2{font-family:var(--display);font-size:1.35rem;margin:0 0 2px;text-wrap:balance}
h3{font-family:var(--display);font-size:1.08rem;margin:0}
p{margin:0}

.row[disabled]{cursor:default;opacity:.55}

.pg{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{border-bottom:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
th{font-weight:700;color:var(--muted);font-size:.85rem}
.back,.link{align-self:flex-start;font:inherit;background:none;border:none;color:var(--accent);cursor:pointer;padding:0;text-align:left}
.pali{font-family:var(--display);font-size:1.12rem}

.eq{font-family:var(--display)}
.mean{color:var(--muted);font-size:.92rem}
.ans{border-left:3px solid var(--ok);padding-left:12px}
.q{gap:10px}

.lbl{display:block;font-size:.75rem;font-weight:700;letter-spacing:.02em;color:var(--muted);margin-bottom:2px}
.si{font-size:1.02rem}
.tabs{border-top:1px solid var(--line);padding-top:10px}
.tb{font:inherit;font-size:.9rem;border:1px solid var(--accent);background:transparent;color:var(--accent);padding:5px 14px;border-radius:999px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.tb[aria-expanded="true"]{background:var(--accent);color:var(--bg)}
.tb .cnt{font-size:.72rem;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:0 7px;line-height:1.5}
.pane{display:flex;flex-direction:column;gap:12px}
.der{display:flex;flex-direction:column;gap:6px}
.dh{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline}
.xn ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.btn.sm{padding:4px 12px;font-size:.85rem}
details.panel summary{cursor:pointer}

</style>
</head>

  <div class="panel"><p>ළංව සිටි අකුරු දෙකක් එක් කොට ගැළපීම <b>සන්ධි</b> නම් වේ. එය ලොප් කිරීමෙන්, ආදේශයෙන්, ආගමයෙන්, දීර්ඝ කිරීමෙන් හෝ අන්‍ය විධියකින් කෙරේ. ස්වර දෙකක් එක තැන සිටි විට කියවීම අපහසු බැවින් සුවසේ කිය හැකි වීම (සුඛොච්චාරණය) සඳහා සන්ධිය කරනු ලැබේ.</p>
  <p>පාළියෙහි සන්ධිය කොටස් තුනකි: <b>1. සර සන්ධි · 2. ව්‍යඤ්ජන සන්ධි · 3. නිග්ගහීත සන්ධි</b></p></div>
  <div class="panel"><h3>පූර්ව ස්වරය සහ පර ස්වරය</h3>
  <p>“පුත්තා මෙ අත්ථි” යන තැන ‘මෙ’ හි ස්වරය ව්‍යඤ්ජනය හා බැඳී ඇති බැවින් පළමුව එය වෙන් කළ යුතුයි:</p>
  <p class="pali" style="text-align:center">ම් - එ + අත්ථි</p>
  <p>මෙහි <b>එ</b> මුල් අකුර බැවින් <b>පූර්ව ස්වරය</b> ද, <b>අ</b> පසු අකුර බැවින් <b>පර ස්වරය</b> ද වේ.</p></div>
  <div class="panel"><h3>සාධනයට යෙදෙන මූලික සූත්‍ර</h3>${["J","P","N"].map(k=>`<div class="ex"><span class="sutra">${S[k][0]}</span><span>${S[k][1]}</span></div>`).join("")}</div>`},
 sara:{t:"1. සර සන්ධි",pg:8,body:()=>`
  <div class="panel"><p>ළංව සිටි පද දෙකක ස්වර දෙකෙන් එකක් මැකීමෙන් හෝ ආදේශාදී අන්‍ය ක්‍රමයකින් ගැළපීම <b>සර සන්ධි</b> නමි.</p></div>
  <div class="panel"><span class="tag">නීතිය 1 · සරා සරෙ ලොපං</span><h3>පූර්ව ස්වර ලෝපය</h3>
   <p>ස්වරයක් පරව සිටි කල්හි පූර්ව ස්වරය ලොප් වේ. ‘ම් - එ + අත්ථි’ හි එ මකා ම් අ සමඟ ගැළපූ කල <span class="eq">මත්ථි</span> වේ.</p>
   <p class="note">අ මුලින් සිට අට ස්වරයෙන් එකක් පරව සිටි කල්හි මුල් අ මැකිය හැක. ආ ඉ ඊ උ ඌ එ ඔ යන හතෙන් එකක් මුලින් සිටි කල්හිද මැකිය හැක.</p>
   ${ladder("දුක්ඛස්සන්තං")}${ladder("ගුණාලඞ්කාරායස්මා")}
   <h3>උදාහරණ</h3>${exList(EX1)}</div>
  <div class="panel"><span class="tag">නීතිය 2 · වා පරො අසරූපා</span><h3>පර ස්වර ලෝපය</h3>
   <p>අසමාන ස්වරයට පසුව සිටි ස්වරය ඇතැම් විට ලොප් කරනු ලැබේ. අ–ආ ට ඉ ඊ ආදී අන් සියල්ල අසමාන ය; ඉ–ඊ ට අ ආ උ ඌ ආදිය අසමාන ය.</p>
   ${ladder("චක්ඛුන්ද්‍රියං")}
   <h3>උදාහරණ</h3>${exList(EX2)}
   <p class="note">යස්ස + ඉදානි හි පූර්ව ස්වරය ලොප් කොට ‘යස්සිදානි’ ලෙසද සන්ධි කළ හැක. එහෙත් ‘තෙ + අපි’ හි පූර්ව ස්වරය ලොප් කළොත් ‘තපි’ වී පද හඳුනාගැනීම අපහසු වන බැවින් එවැනි තැන්හි පර ස්වර ලෝපයම කටයුතු.</p></div>
  <div class="panel"><span class="tag">නීතිය 3 · ක්වචාසවණ්ණං ලුත්තෙ</span><h3>පර ස්වරයට ආදේශය</h3>

 else{const w=VOCAB[deck[wi]];
  V().innerHTML=head+`<button type="button" class="card" id="card" aria-label="කාඩ්පත පෙරළන්න">${flip?`<span class="hint">${w[0]}</span><span class="big" style="font-size:1.4rem">${w[1]}</span>${w[2]?`<span class="hint">${GENDER[w[2]]||w[2]}</span>`:""}`:`<span class="big">${w[0]}</span><span class="hint">අර්ථය බැලීමට තට්ටු කරන්න</span>`}</button>
