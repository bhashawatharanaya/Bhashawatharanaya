<style>
/* Layout: ola-leaf header, chip navigation of sections, single reading column; derivations as numbered rule ladders */

  --bg:#141824; --surface:#1C2131; --leaf:#2A2A22; --ink:#E7E8EE; --muted:#A3A8B8;

:root[data-theme="dark"]{

body{margin:0}

.wrap{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header.leaf{margin-top:16px;background:var(--leaf);border-radius:6px;padding:20px 22px;position:relative;overflow:hidden}
header.leaf::before,header.leaf::after{content:"";position:absolute;top:50%;width:10px;height:10px;border-radius:50%;background:var(--bg);transform:translateY(-50%)}
header.leaf::before{left:22%}header.leaf::after{right:22%}
h1{font-family:var(--display);font-size:1.7rem;margin:0;line-height:1.3;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0;font-size:.92rem}
nav{display:flex;flex-wrap:wrap;gap:8px}
nav button{font:inherit;font-size:.95rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 14px;border-radius:999px;cursor:pointer}
nav button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h2{font-family:var(--display);font-size:1.35rem;margin:0 0 2px;text-wrap:balance}
h3{font-family:var(--display);font-size:1.08rem;margin:0}
p{margin:0}

.step .r{font-size:.88rem;color:var(--accent);overflow-wrap:anywhere}

.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}

.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:.88rem;font-variant-numeric:tabular-nums}

.ex{display:flex;flex-direction:column;gap:2px;padding:8px 0;border-top:1px solid var(--line)}
.ex:first-child{border-top:none}
.eq{font-family:var(--display)}
.mean{color:var(--muted);font-size:.92rem}
.ans{border-left:3px solid var(--ok);padding-left:12px}
</style>

  <div class="panel"><p>ළංව සිටි අකුරු දෙකක් එක් කොට ගැළපීම <b>සන්ධි</b> නම් වේ. එය ලොප් කිරීමෙන්, ආදේශයෙන්, ආගමයෙන්, දීර්ඝ කිරීමෙන් හෝ අන්‍ය විධියකින් කෙරේ. ස්වර දෙකක් එක තැන සිටි විට කියවීම අපහසු බැවින් සුවසේ කිය හැකි වීම (සුඛොච්චාරණය) සඳහා සන්ධිය කරනු ලැබේ.</p>
  <p>පාළියෙහි සන්ධිය කොටස් තුනකි: <b>1. සර සන්ධි · 2. ව්‍යඤ්ජන සන්ධි · 3. නිග්ගහීත සන්ධි</b></p></div>
  <div class="panel"><h3>පූර්ව ස්වරය සහ පර ස්වරය</h3>
  <p>“පුත්තා මෙ අත්ථි” යන තැන ‘මෙ’ හි ස්වරය ව්‍යඤ්ජනය හා බැඳී ඇති බැවින් පළමුව එය වෙන් කළ යුතුයි:</p>

 ["සියලු සත්වයෝ ම තමන්ගේ ශරීරයන් හැරදමා පරලොව යති.","සබ්බෙව සත්තා අත්තානං දෙහෙ පහාය පරලොකං ගච්ඡන්ති.",["සබ්බෙව","සත්තාව"]],
 ["කුමරියෝ නිල් වූ ද රතු වූ ද මල් නෙලා ගෙනවුත් මවුට ද පියාට ද දුන්හ.","කුමාරියො නීලානිපි රත්තානිපි පුප්ඵානොචිනිත්වා (ආනෙත්වා) මාතුයාපි පිතුනොපි අදංසු.",["නීලානිපි","රත්තානිපි","පුප්ඵානොචිනිත්වා","මාතුයාපි","පිතුනොපි"]],
 ["පියා ගෙනා ගෙඩි දහයක් මව විසින් පුතුන්ට ද දූන්ට ද බෙදා දෙන ලදහ.","පිතරාහටානි දස ඵලානි මාතුයා පුත්තානම්පි ධීතරානම්පි විභජීයිංසු. / විභජිතානි හොන්ති.",["පිතරාහටානි","පුත්තානම්පි","ධීතරානම්පි"],"ආභත = ආහට"],
 ["සර්වඥයන් වහන්සේට වැඩහිඳීමට ජේතවන විහාරයෙහි බොහෝ ආසනයෝ පණවන ලද්දෝ ම වූහ.","සබ්බඤ්ඤුනො නිසීදිතුං ජෙතවනවිහාරෙ (ජෙතවනෙ) බහූනි පඤ්ඤත්තානෙවාසනානි හොන්ති.",["පඤ්ඤත්තානෙව","පඤ්ඤත්තානෙවාසනානි"]],
 ["පෙර ලක්වැසියන්ට මහත් වූ අමනුෂ්‍යොපද්‍රවයක් ද රෝගයක් ද ඇතිවිය.","පුරා ලඞ්කාවාසීනං / ලඞ්කිකානං මහන්තො අමනුස්සුපද්දවොපි රොගොපි අහෙසුං.",["අමනුස්සුපද්දවො","අමනුස්සොපද්දවො","අමනුස්සුපද්දවොපි","රොගුපද්දවො","රොගුපද්දවොපි"]],
 ["‘ඇවැත්නි, එය (එසේ) නොවේ’ යයි සැරියුත් මහ තෙරුන් වහන්සේ භික්ෂූන්ට කීහ.","නොහෙතං ආවුසොති සාරිපුත්තමහාථෙරො භික්ඛූනමාහ.",["නොහෙතං","ආවුසොති","භික්ඛූනමාහ"]],
 ["‘අපි හෙට සැවැත් නුවරට යන්නෙමු’ යි ස්ථවිරතුමා ගම්වැසියන්ට කීහ.","සුවෙ මයං සාවත්ථිං ගමිස්සාමාති ථෙරො ගාමවාසීනමාහ.",["ගමිස්සාමාති","ගාමවාසීනමාහ"],"ගමිස්සාමි + ඉති = ගමිස්සාමීති · ගමිස්සාම + ඉති = ගමිස්සාමාති"],
 ["භික්ෂුතෙම උදෑසන ම නැඟිට මලු හැමදීමාදිය කරයි.","භික්ඛු පාතොවුට්ඨාය මාලකසම්මජ්ජනාදීනි කරොති.",["පාතොව","පාතොවුට්ඨාය","මාලකසම්මජ්ජනාදීනි"]],
 ["සර්වඥදේශිත ධර්මය වට්ටගාමණීඅභය රජුගේ කාලයේදී පොත්වල ලියන ලදි.","ජිනෙරිතො ධම්මො වට්ටගාමිණීඅභයරඤ්ඤො කාලෙ පොත්ථකෙසු ලිඛිතො හොති. / ලිඛීයි.",["ජිනෙරිතො"]],
 ["රෝගී වූ මම විසි දිනක් වෙදකුගෙන් බෙහෙත් අනුභව කොට නිරෝගී වීමි.","ආබාධිකොහං වීසති දිවසං වෙජ්ජම්හා භෙසජ්ජමුපසෙවිත්වා නිරොගො අහොසිං. / අභවිං.",["ආබාධිකොහං","භෙසජ්ජමුපසෙවිත්වා"],"අච්චන්තසංයොග — කාල: වීසති දිවසං භෙසජ්ජං භුඤ්ජති · අද්ධාන: වීසති යොජනානි ධාවති"],
 ["සර්වඥතෙමේ විහාරට පැමිණි සියලු දෙනට ම ධර්මය දේශනා කෙළේ ය.","සබ්බඤ්ඤූ විහාරමාගතානං සබ්බෙසානමෙව ධම්මං දෙසෙසි.",["සබ්බඤ්ඤූ","විහාරමාගතානං","සබ්බෙසානමෙව"]],
 ["අනේපිඬු සිටුතුමාත් විශාඛා උපාසිකාවත් සැවැත් නුවර විහාර දෙකක් සාදවා තථාගතයන් වහන්සේට දුන්හ.","අනාථපිණ්ඩිකො සෙට්ඨීපි විසාඛා මහොපාසිකාපි සාවත්ථියං ද්වෙ විහාරෙ කාරාපෙත්වා තථාගතස්ස පූජෙසුං.",["සෙට්ඨීපි","මහොපාසිකා","මහොපාසිකාපි"]],
 ["උන්වහන්සේත් ඒ කුල දෙක නිසා අවුරුදු 25 ක් සැවැත් නුවර විසූහ.","සොපි තානි ද්වෙ කුලානි නිස්සාය පඤ්චවීසතිවස්සානි සාවත්ථියං වසි.",["සොපි"]],
 ["මිගාර සිටුතුමා ද තමාගේ ලේලිය වූ විශාඛාව මවු තනතුරෙහි තැබී ය. එබැවින් ඕතොමෝ ‘මිගාරමාතා’ යි ප්‍රකට විය.","මිගාරො සෙට්ඨීපි අත්තනො සුණිසං විසාඛං මාතුට්ඨානෙ ඨපෙසි. තස්මා සා මිගාරමාතාති පඤ්ඤායි.",["සෙට්ඨීපි","මිගාරමාතාති"]]

const SECTIONS=[["lessons","පාඩම්"],["trans","පරිවර්තන"],["sandhi","සන්ධි පද සාධන"],["quiz","ප්‍රශ්න"],["words","වචන"],["notes","අතිරේක විස්තර"]];
let state={sec:"lessons",lesson:null};
try{const s=JSON.parse(localStorage.getItem("pb2")||"{}");if(s.sec&&SECTIONS.some(x=>x[0]===s.sec))state.sec=s.sec}catch(e){}

const fmt=t=>t.replace(/~([^~]+)~/g,"<s>$1</s>");
function ladder(w,limit){
 const d=DER[w];if(!d)return"";
 const rows=[[w,"J"],...d.steps,[w,"J"]];
 const n=limit==null?rows.length:limit;
 return `<div class="ladder">${rows.slice(0,n).map((r,i)=>`<div class="step${i===0||i===rows.length-1?" end":""}"><span class="n">${i+1}</span><span class="f">${fmt(r[0])}</span><span class="r">${S[r[1]][0]}</span></div>`).join("")}</div>`;
}
function exList(arr){return arr.map(e=>`<div class="ex"><span class="eq">${e[0]} = <b>${e[1]}</b></span><span class="mean">${e[2]}</span></div>`).join("")}
function goto(sec){state.sec=sec;state.lesson=null;save();render();scrollTo(0,0)}
function renderNav(){
 $("#nav").innerHTML=SECTIONS.map(([k,l])=>`<button type="button" data-sec="${k}" aria-pressed="${state.sec===k}">${l}</button>`).join("");
 $("#nav").querySelectorAll("button").forEach(b=>b.onclick=()=>goto(b.dataset.sec));
}
function wire(){V().querySelectorAll("[data-goto]").forEach(b=>b.onclick=()=>goto(b.dataset.goto))}

let sFilter="",sQuery="",sOpen=null,sStep=2;

 if(sOpen){const d=DER[sOpen];const total=d.steps.length+2;
  V().innerHTML=`<button type="button" class="back">‹ සියලු පද</button>

   <div class="btns">${sStep<total?`<button type="button" class="btn" id="nx">ඊළඟ පියවර ›</button><button type="button" class="btn ghost" id="all">සියල්ල පෙන්වන්න</button>`:`<button type="button" class="btn ghost" id="rs">නැවත අරඹන්න</button>`}</div></div>
  <div class="panel"><h3>යෙදුණු සූත්‍ර</h3>${[...new Set(d.steps.map(s=>s[1]))].filter(k=>k!=="V").map(k=>`<div class="ex"><span class="sutra">${S[k][0]}</span><span>${S[k][1]}</span></div>`).join("")}</div>`;
  V().querySelector(".back").onclick=()=>{sOpen=null;sandhi()};
  const nx=$("#nx");if(nx)nx.onclick=()=>{sStep++;sandhi()};

  return}
 const used=["L","A","K","D","PC","M","PV","VG"];
 const list=Object.values(DER).filter(d=>(!sFilter||d.steps.some(s=>s[1]===sFilter))&&(!sQuery||d.w.includes(sQuery)||d.steps[0][0].includes(sQuery)));

 <div class="chips"><button type="button" class="chip" data-f="" aria-pressed="${!sFilter}">සියල්ල</button>${used.map(k=>`<button type="button" class="chip" data-f="${k}" aria-pressed="${sFilter===k}">${S[k][0]}</button>`).join("")}</div>
 <div class="meta"><span>පද ${list.length}</span></div>

 const q=$("#sq");q.oninput=()=>{sQuery=q.value.trim();const pos=q.selectionStart;sandhi();const n=$("#sq");n.focus();n.setSelectionRange(pos,pos)};
 V().querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{sFilter=b.dataset.f;sandhi()});
 V().querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>{sOpen=b.dataset.w;sStep=2;sandhi();scrollTo(0,0)});

let qi=0,score=0,ans=null,order=QUIZ.map((_,i)=>i);

 <div class="meta"><span>ප්‍රශ්නය ${qi+1} / ${order.length}</span><span>ලකුණු ${score}</span></div>

  V().innerHTML=head+`<div class="grid2">${VOCAB.map(v=>`<div class="wcell"><div class="pali">${v[0]}</div><div>${v[1]}</div>${v[2]?`<small>${GENDER[v[2]]||v[2]}</small>`:""}</div>`).join("")}</div>`;
 }else{const w=VOCAB[ci];
  V().innerHTML=head+`<button type="button" class="card" id="card" aria-label="කාඩ්පත පෙරළන්න">${flip?`<span class="hint">${w[0]}</span><span class="big" style="font-size:1.4rem">${w[1]}</span>${w[2]?`<span class="hint">${GENDER[w[2]]||w[2]}</span>`:""}`:`<span class="big">${w[0]}</span><span class="hint">අර්ථය බැලීමට තට්ටු කරන්න</span>`}</button>
  <div class="meta"><span>${ci+1} / ${VOCAB.length}</span></div>
  <div class="btns"><button type="button" class="btn ghost" id="prev">‹ පෙර</button><button type="button" class="btn" id="next">ඊළඟ ›</button><button type="button" class="btn ghost" id="shuf">මිශ්‍ර කරන්න</button></div>`;
  $("#card").onclick=()=>{flip=!flip;words()};
  $("#prev").onclick=()=>{ci=(ci-1+VOCAB.length)%VOCAB.length;flip=false;words()};
  $("#next").onclick=()=>{ci=(ci+1)%VOCAB.length;flip=false;words()};
  $("#shuf").onclick=()=>{VOCAB.sort(()=>Math.random()-.5);ci=0;flip=false;words()};
 }
 V().querySelectorAll("[data-wm]").forEach(b=>b.onclick=()=>{wMode=b.dataset.wm;words()});
}

 V().innerHTML=`<div><h2>අතිරේක විස්තර</h2></div>
 <div class="panel"><h3>සූත්‍ර සංග්‍රහය</h3>${Object.keys(S).map(k=>`<div class="ex"><span class="sutra">${S[k][0]}</span><span>${S[k][1]}</span></div>`).join("")}</div>
 <div class="list">${NOTES.map(n=>`<div class="panel"><h3>${n[0]}</h3><p>${n[1]}</p></div>`).join("")}</div>
 <div class="panel"><h3>පොත ගැන</h3><p>පාලිභාෂාවතරණය දෙවැනි පොත, අග්ගමහා පණ්ඩිත පොල්වත්තේ ශ්‍රී බුද්ධදත්ත මහානායක ස්ථවිරයන් වහන්සේ විසින් සම්පාදිතයි. විඥාපනය 1959 මැයි 20 දින අම්බලම්ගොඩ අග්ගාරාමයේදී ලියා ඇත. 1–2 පොත්වල අභ්‍යාස පරිවර්තනය කර දෙන “පාලිභාෂාවතරණ යතුර” ගුරුවරුන්ට සහ තනිව ඉගෙනගන්නන්ට ප්‍රයෝජනවත් වේ.</p></div>`;
}
