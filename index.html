<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>පාලි භාෂාවතරණය II – අභ්‍යාස</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+Sinhala:wght@400;700&display=swap">
<style>
:root{--bg:#efe5cc;--card:#f8f0da;--ink:#2b1c10;--mut:#7a6342;--acc:#a8741b;--acc2:#8a3a1d;--b1:#8a3a1d;--b2:#5a2212;--gold:#b08a2e;--teal:#1f6f6b;--ok:#2f6b3f;--bad:#a8281f;--line:#c9ab6e;--glow:rgba(110,70,20,.07);--halo:rgba(190,130,35,.16);--jin:#8a6a14;--vis:#1f6f6b;--rule:#8a2a1a;--join:#2f6b3f;--sh:rgba(60,35,10,.14);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0c0b;--card:#1a1612;--ink:#efe3c8;--mut:#a8956f;--acc:#e0b04f;--acc2:#e6bd5c;--b1:#b4552a;--b2:#6e2a14;--gold:#d4a843;--teal:#3fb3ac;--ok:#7fcf94;--bad:#ff8f84;--line:#4d3b22;--glow:rgba(224,176,79,.035);--halo:rgba(224,176,79,.14);--jin:#e3c36a;--vis:#5fd0c8;--rule:#ff9a7a;--join:#8fdba3;--sh:rgba(0,0,0,.45)}}
:root[data-theme="dark"]{--bg:#0d0c0b;--card:#1a1612;--ink:#efe3c8;--mut:#a8956f;--acc:#e0b04f;--acc2:#e6bd5c;--b1:#b4552a;--b2:#6e2a14;--gold:#d4a843;--teal:#3fb3ac;--ok:#7fcf94;--bad:#ff8f84;--line:#4d3b22;--glow:rgba(224,176,79,.035);--halo:rgba(224,176,79,.14);--jin:#e3c36a;--vis:#5fd0c8;--rule:#ff9a7a;--join:#8fdba3;--sh:rgba(0,0,0,.45)}
*{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 52px)}
html,body{margin:0}
body{background-color:var(--bg);background-image:radial-gradient(ellipse 90% 45% at 50% 0,var(--halo),transparent 70%),repeating-linear-gradient(0deg,var(--glow) 0 1px,transparent 1px 6px);background-attachment:fixed,scroll;color:var(--ink);font-family:"Noto Serif Sinhala","Iskoola Pota","Nirmala UI",serif;line-height:1.75}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
main{max-width:640px;margin:0 auto;padding:6px 16px 44px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:var(--bg);border-bottom:1px solid var(--line)}
.bar-in{max-width:640px;margin:0 auto;padding:6px 14px;display:flex;align-items:center;gap:8px}
.bar-in .t{flex:1;text-align:center;font-size:.82rem;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:32px;height:32px;padding:0;border-radius:50%;display:grid;place-items:center;font-size:.9rem;background:var(--card);border:1.5px solid var(--line);color:var(--ink);cursor:pointer;flex:none}
.ib:hover{border-color:var(--gold)}
#toc{max-width:640px;margin:0 auto;padding:4px 14px 12px;animation:in .25s}
#toc .in{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:10px 14px;max-height:60vh;overflow:auto}
h1{font-size:1.5rem;margin:.2em 0;color:var(--acc2);letter-spacing:.2px}
.sub{color:var(--mut);margin:0 0 14px}
.hero{text-align:center;padding:14px 0 4px}
.flag{height:8px;width:140px;margin:0 auto 10px;border:1px solid var(--line);border-radius:4px;background:linear-gradient(90deg,#0072bc 20%,#ffd400 20% 40%,#e4002b 40% 60%,#fff 60% 80%,#f7931e 80%)}
.nama{font-size:.92rem;color:var(--acc);margin:0 0 4px}
.hero-img{display:block;margin:8px auto 12px;width:min(210px,56vw);aspect-ratio:428/626;object-fit:cover;border-radius:105px 105px 14px 14px;border:2px solid var(--gold);box-shadow:0 0 0 4px var(--bg),0 0 0 6px var(--teal),0 10px 30px var(--sh)}
.pen{width:1.05em;height:1.05em;vertical-align:-.17em;fill:currentColor}
.dharma{font-size:2.5rem;color:var(--gold);display:inline-block;animation:spin 24s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.orn{display:flex;align-items:center;gap:10px;color:var(--gold);margin:6px 0 4px}
.orn::before,.orn::after{content:"";flex:1;border-top:1.5px solid var(--gold);opacity:.6}
.sec{font-weight:700;color:var(--acc2);margin:18px 0 8px}
.grid{display:grid;gap:12px}
.card,.exc{position:relative;background:var(--card);border:1.5px solid var(--line);border-radius:10px;box-shadow:0 1px 0 rgba(255,255,255,.3) inset,0 3px 10px var(--sh)}
.card::before,.exc::before{content:"";position:absolute;left:8px;top:50%;width:9px;height:9px;margin-top:-5px;border-radius:50%;background:var(--bg);box-shadow:inset 0 1px 2px rgba(0,0,0,.4)}
.card{padding:16px 16px 16px 30px;margin-top:14px;animation:in .3s}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.exc{padding:12px 14px 12px 30px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.exc .ic{font-size:1.15rem;font-weight:700;color:var(--acc2);width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--bg);border:1.5px solid var(--gold);flex:none}
.exc .tx{flex:1;min-width:150px}.exc .tx small{display:block;color:var(--mut)}
.exc .bt,.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg{margin:10px 0}
.btn{font:inherit;cursor:pointer;border-radius:8px;border:1.5px solid var(--gold);background:linear-gradient(var(--b1),var(--b2));color:#fff3d6;padding:9px 16px;font-weight:700}
.btn.g{background:transparent;color:var(--acc2)}
.sm{padding:5px 11px;font-size:.85rem}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--mut);margin:12px 0 4px;font-size:.92rem}
.q{font-size:1.1rem;margin:8px 0 10px}
.tag{font-size:.78rem;background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:1px 10px;color:var(--mut)}
.rev{border-top:1px dashed var(--line);padding-top:8px;margin-top:8px;font-size:.95rem}
.fc{min-height:170px;display:grid;place-items:center;text-align:center;font-size:1.5rem;cursor:pointer}
.fc small{color:var(--mut);font-size:.8rem}
textarea{width:100%;font:inherit;color:inherit;background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:8px;margin-top:8px}
details summary{cursor:pointer;color:var(--acc2)}
.lh{color:var(--acc2);font-size:1.1rem;margin:18px 0 4px;padding-bottom:3px;border-bottom:1.5px solid var(--line)}
.lr{display:flex;flex-wrap:wrap;gap:2px 18px;padding:4px 0;border-bottom:1px dashed var(--line)}
.les p{margin:6px 0}.ll{margin-left:6px}
.hl{color:var(--mut);font-size:.88rem;margin:0}
.wb{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
.wc{display:flex;flex-direction:column;gap:4px;padding:4px;border-radius:8px;border:1px dashed transparent}
.wc.un{border-color:var(--acc)}
.wo{font:inherit;cursor:pointer;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:3px 10px;font-size:.95rem;text-align:left}
.wo:hover:not(:disabled){border-color:var(--gold)}
.wo.sel{border-color:var(--acc2);background:color-mix(in srgb,var(--acc2) 16%,var(--card))}
.wo.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 22%,var(--card))}
.wo.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 24%,var(--card));text-decoration:line-through}
.wo.miss{border:1.5px dashed var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--card))}
.wo:disabled{cursor:default;color:var(--ink)}
.rs{margin:8px 0;font-size:.92rem;color:var(--mut)}
.okb{border:1.5px solid var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent);border-radius:8px;padding:8px 12px;margin-top:6px}
.dv{margin-top:12px;padding:10px;border:1.5px dashed var(--line);border-radius:8px;background:color-mix(in srgb,var(--acc) 5%,var(--card))}
.dh{color:var(--acc2)}
.blk{border:1.5px solid var(--line);border-left:5px solid var(--acc2);border-radius:8px;padding:8px 12px;margin:14px 0;background:var(--bg)}
.blk h4{margin:0 0 6px;color:var(--acc2);font-size:1.02rem}.blk h4 small{color:var(--mut);font-weight:400}
.st{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap;padding:4px 0;border-bottom:1px dotted var(--line)}
.st:last-child{border-bottom:0}
.st .ex{font-size:1.04rem}.st .v{color:var(--acc);border-bottom:2px solid var(--acc)}.st .pl{color:var(--mut)}
.st s{color:var(--bad);text-decoration-thickness:2px}
.ch{font-size:.76rem;border-radius:12px;padding:1px 10px;border:1px solid;white-space:nowrap;background:color-mix(in srgb,currentColor 12%,transparent)}
.c-jin{color:var(--jin)}.c-vis{color:var(--vis)}.c-rule{color:var(--rule)}.c-join{color:var(--join)}.c-note{color:var(--mut)}
.nt{border-left:4px solid var(--gold);background:color-mix(in srgb,var(--gold) 14%,transparent);padding:4px 10px;margin:8px 0;font-size:.93rem;border-radius:0 6px 6px 0}
.nt.eq{border-left-color:var(--vis);background:color-mix(in srgb,var(--vis) 12%,transparent)}
.les p{margin:12px 0;line-height:1.95}
.les b{color:var(--acc)}
.pt{display:flex;gap:14px;margin:22px 0;padding-bottom:22px;border-bottom:1px dashed var(--line)}
.pt .lb{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff3d6;background:linear-gradient(var(--b1),var(--b2));border:1.5px solid var(--gold)}
.pt .pb{flex:1;min-width:0}.pt .pb h3{margin:2px 0 6px;color:var(--acc2);font-size:1.06rem}.pt .pb p{margin:0;line-height:2}
.su{margin:24px 0;border:1.5px solid var(--gold);border-radius:12px;overflow:hidden;background:var(--bg)}
.su-h{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:9px 14px;background:linear-gradient(var(--b1),var(--b2));color:#fff3d6}
.su-tag{font-size:.74rem;border:1px solid #f3d58b;border-radius:10px;padding:0 9px}
.su-t{font-weight:700;font-size:1.06rem}
.su-p,.su-s{margin:12px;padding:9px 14px;border-radius:0 8px 8px 0;line-height:1.95}
.su-p{border-left:5px solid var(--teal);background:color-mix(in srgb,var(--teal) 11%,transparent)}
.su-s{border-left:5px solid var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent)}
.su small{display:block;font-size:.76rem;margin-bottom:2px;font-weight:700}
.su-p small{color:var(--teal)}.su-s small{color:var(--ok)}
.rule{margin:28px 0 8px;padding:10px 14px;border-radius:10px;border:1.5px solid var(--line);border-left:6px solid var(--acc);background:color-mix(in srgb,var(--acc) 10%,var(--card));line-height:1.85}
.rule .rn{display:inline-block;font-size:.76rem;background:var(--acc);color:var(--bg);border-radius:10px;padding:0 10px;margin-right:8px;font-weight:700}
.sh{margin:20px 0 4px;font-weight:700;color:var(--teal);font-size:1.02rem}
.sl{margin:18px 0 4px;font-size:.86rem;color:var(--mut);font-weight:700;letter-spacing:.3px}
.tb{margin:12px 0;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.tbr{display:flex}.tbr:nth-child(even){background:color-mix(in srgb,var(--gold) 8%,transparent)}
.tbr.hd{background:linear-gradient(var(--b1),var(--b2));color:#fff3d6;font-weight:700}
.tbd{flex:1;padding:6px 10px;border-right:1px dashed var(--line);min-width:0;overflow-wrap:anywhere}.tbd:last-child{border-right:0}
.pr{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:7px 2px;border-bottom:1px dotted var(--line)}
.pr .pa{color:var(--teal);font-weight:700}
.pr .si{color:var(--ok);flex:1;min-width:150px;text-align:right}
.bl{color:var(--gold);margin-right:6px}
.tree,.tree ul{list-style:none;margin:0;padding:0}
.tree ul{margin-left:9px;padding-left:12px;border-left:2px solid var(--line)}
.tree li{position:relative;padding:3px 0}
.tree ul li{padding-left:14px}
.tree ul li::before{content:"";position:absolute;left:0;top:17px;width:11px;border-top:2px solid var(--line)}
.tree summary{cursor:pointer;font-weight:700;list-style:none}
.tree summary::-webkit-details-marker{display:none}
.tree summary::before{content:"▸ ";color:var(--acc)}
.tree details[open]>summary::before{content:"▾ "}
.tree a{cursor:pointer;color:var(--acc2)}
.tree a:hover{text-decoration:underline}
</style>
</head>
<body>
<header class="bar"><div class="bar-in"><button class="ib" title="මුල් පිටුව" aria-label="මුල් පිටුව" onclick="home()">🏠</button><button class="ib" title="පටුන" aria-label="පටුන" onclick="tt()">🌳</button><span class="t" id="ttl"></span><button class="ib" id="th" onclick="tg()" aria-label="තේමාව මාරු කරන්න"></button></div><div id="toc" hidden></div></header>

<script>
var TR=[{"p":["තෙසං ද්වින්නං නිවෙසනෙසු බහුන්නං භික්ඛූනං පඤ්ඤත්තානෙ‘වා’සනානි හොන්ති.","‘පුත්තා ම’ත්‍ථි ධනම්ම’ත්‍ථි ඉති බාලො විහඤ්ඤති. (ධම්මපද)","පුරා වෙසාලිවාසීනං මහන්තො රොගුපද්දවො අහොසි.","සබ්බෙ’ව මයං ධම්මං සුත්‍වා තං සාධුකං මනසිකරිස්සාම.","සබ්බම්පිදං අම්හාකං දෙහනිස්සිතං විනස්සති.","‘නොහෙතං භන්තෙති භික්ඛූ භගවතො වදිංසු.","දාසෙනාහටානි දාරූනි ගහෙත්‍වා දාසී යාගුං පචි.","යදාහං නගරමගමාසිං තදෙකො පුරිසො මම ඡත්තං ගණ්හි.","දාරකා පුප්ඵානො‘චිනිතුං වනං ගන්ත්‍වා සෙතානි’පි නීලානි’පි පුප්ඵානාහරිංසු.","තෙන හාවුසො ගණ්හථ මෙ පත්තචීවරන්ති ථෙරො ආහ.","ථෙරො නාසාය තෙලං අසිඤ්චන්තො නිසින්නකො’ව ආසිඤ්චිත්‍වා අන්තොගාමං පාවිසි. (ධ. අ.)","අනාථපිණ්ඩිකොපි විසාඛාපි මහාඋපාසිකා නිබද්‍ධං දිවසස්ස ද්වෙ වාරෙ තථාගතස්සුපට්ඨානං ගච්ඡන්ති.","උග්ගණ්හිතුකාමා දාරකා පාතො’වුට්ඨාය කිඤ්චි භුඤ්ජිත්‍වා සත්‍ථසාලං ගච්ඡන්ති.","කුම්භඝොසකො කාලස්සෙව වුට්ඨාය රාජගහනගරෙ කම්මකාරෙ පබොධෙසි.","මහාමහින්‍දථෙරො අඤ්ඤෙහි චතූහි පබ්බජිතෙහි සද්‍ධිං ලඞ්කාදීපමාගන්ත්‍වා ජිනෙරිතං ධම්මං ලඞ්කිකානං දෙසෙසි."],"s":["මා ගමට ගිය කල්හි මගේ එක් මිත්‍රයෙක් මට පොතක් දුන්නේ ය.","සියලු සත්වයෝ ම තමන්ගේ ශරීරයන් හැරදමා පරලොව යති.","කුමරියෝ නිල් වූ ද රතු වූ ද මල් නෙලා ගෙනවුත් මවුට ද පියාට ද දුන්හ.","පියා ගෙනා ගෙඩි දහයක් මව විසින් පුතුන්ට ද දූන්ට ද බෙදා දෙන ලදහ.","සර්‍වඥයන් වහන්සේට වැඩහිඳීමට ජේතවන විහාරයෙහි බොහෝ ආසනයෝ පණවන ලද්දෝ ම වූහ.","පෙර ලක්වැසියන්ට මහත් වූ අමනුෂ්‍යොපද්‍ර‍වයක් ද රෝගයක් ද ඇතිවිය.","‘ඇවැත්නි, එය (එසේ) නොවේ’ යයි සැරියුත් මහ තෙරුන් වහන්සේ භික්‍ෂූන්ට කීහ.","‘අපි හෙට සැවැත් නුවරට යන්නෙමු’ යි ස්ථවිරතුමා ගම්වැසියන්ට කීහ.","භික්‍ෂුතෙම උදෑසන ම නැඟිට මලු හැමදීමාදිය කරයි.","සර්‍වඥදේශිත ධර්‍මය වට්ටගාමණීඅභය රජුගේ කාලයේදී පොත්වල ලියන ලදි.","රෝගී වූ මම විසි දිනක් වෙදකුගෙන් බෙහෙත් අනුභව කොට නිරෝගී වීමි.","සර්‍වඥතෙමේ විහාරට පැමිණි සියලු දෙනට ම ධර්‍මය දේශනා කෙළේ ය.","අනේපිඬු සිටුතුමාත් විශාඛා උපාසිකාවත් සැවැත් නුවර විහාර දෙකක් සාදවා තථාගතයන් වහන්සේට දුන්හ.","උන්වහන්සේත් ඒ කුල දෙක නිසා අවුරුදු 25 ක් සැවැත් නුවර විසූහ.","මිගාර සිටුතුමා ද තමාගේ ලේලිය වූ විශාඛාව මවු තනතුරෙහි තැබී ය. එබැවින් ඕතොමෝ ‘මිගාරමාතා’ යි ප්‍ර‍කට විය."],"gp":[["අන්තොගාම","ඇතුල්ගම, ගම ඇතුළ. න ස්ස් - අ + අන්තං - සරා සරෙ ලොපං"],["p","දුක්ඛස්ස් + අන්තං - නයෙ පරං යුත්තෙ."],["p","දුක්ඛස්සන්තං - ජිනවචනයුත්තඤ්හි"],["p","ගුණාලඞ්කාරායස්මා - ජිනවචනයුත්තඤ්හි"],["p","ගුණාලඞ්කාර + ආයස්මා - විසන්ධි"],["p","ගුණාලඞ්කාර් - අ + ආයස්මා - පුබ්බමධොඨිතමස්සරං සරෙන වියොජයෙ."],["p","ගුණාලඞ්කාර් - අ + ආයස්මා - සරා සරෙ ලොපං"],["p","ගුණාලඞ්කාර් + ආයස්මා - නයෙ පරං යුත්තෙ."],["p","ගුණාලඞ්කාරායස්මා - ජිනවචනයුත්තඤ්හි"],["p","උදාහරණ ස්වල්පයක් මෙසේයි:-"],["r","**මුලදී තිබුණ සැටි**\t**ස්වර වෙන් කළ විට**"],["r","1. අභිවන්‍දිය + අග්ගං\t- අභිවන්‍දිය් - අ = අග්ගං"],["r","2. පඤ්ඤත්තානෙව+ආසනානි\t- පඤ්ඤත්තානෙව් -"],["p","අ + ආසනානි"],["r","3. පඤ්ඤා + ඉන්‍ද්‍රියං\t- පඤ්ඤ් - ආ + ඉන්‍ද්‍රියං"],["r","4. තීණි + ඉමානි\t- තීණ් - ඉ + ඉමානි"],["r","5. නොහි + එතං\t- නොහ් - ඉ + එතං"],["r","6. භික්ඛුනී + ඔවාදො\t- භික්ඛුන් - ඊ + ඔවාදො"],["r","7. මාතු + උපට්ඨානං\t- මාත් - උ + උපට්ඨානං"],["r","8. සමෙතු + ආයස්මා සංඝෙන\t- සමෙත්-උ+ආයස්මා සංඝෙන"],["r","9. ධනම්මෙ + අත්‍ථි\t- ධනම් - ම් - එ + අත්‍ථි"],["r","10. සබ්බෙ + එව\t- සබ්බ් - එ + එව"],["r","11. අමනුස්ස + උපද්දවො\t- අමනුස්ස් - අ + උපද්දවො"],["r","12. අසන්තො + එත්‍ථ\t- අසන්ත් - ඔ + එත්‍ථ"],["r","13. තයො + අස්සු ධම්මා\t- තය් - ඕ + අස්සු ධම්මා"],["r","14. සබ්බම්පි + ඉදං\t- සබ්බම්ප් - ඉ + ඉදං"],["p","**පූර්‍වස්වර මකා ගැළපූ විට**"],["p","1. අභිවන්‍දිය’ග්ගං (=අග්‍ර‍යන් වහන්සේ වැඳ)"],["p","2. පඤ්ඤත්තානෙවාසනානි (=පණවන ලද්දා වූ ම ආසනයෝ.)"],["p","3. පඤ්ඤි’න්‍ද්‍රියං (=ප්‍ර‍ඥා නමැති ඉන්‍ද්‍රිය)"],["p","4. තීණිමානි - (=මේවා තුනකි.)"],["p","5. නො හෙ’තං (=මෙය නො වේ.)"],["p","6. භික්ඛුනො’වාදො (=භික්‍ෂුණීන්ට අවවාදය)"],["p","7. මාතු’පට්ඨානං (=මවට උපස්ථානය)"],["p","8. සමෙතායස්මා සංඝෙන = ආයුෂ්මත් තෙමේ සංඝයා හා එකඟ වේවා.)"],["p","9. ධනම්ම’ත්‍ථි (=මට ධනය තිබේ.)"],["p","10. සබ්බෙ’ව (=සියල්ලෝ ම)"],["p","11. අමනුස්සු’පද්දවො (අමනුෂ්‍යොපද්‍ර‍වය.)"],["p","12. අසන්තෙ’ත්‍ථ (=මෙහි අසත්පුරුෂයෝ)"],["p","13. තය’ස්සු ධම්මා (=ධර්‍මයෝ තිදෙනෙක් වන්නාහ.)"],["p","14. සබ්බම්පි’දං (=මේ සියල්ලම)"],["p","**5. අසමානස්වරයා කෙරෙන් පරවූ ස්වරය ඇතැම් විට ලොප් කරනු ලැබේ.**"],["p","අ- ආ දෙදෙනාට ඉ-ඊ ආදී අන්‍ය ස්වරයෝ සියලු දෙන අසමානයහ. ඉ-ඊ දෙදෙනට අ-ආ-උ-ඌ ආදී අන්‍ය ස්වරයෝ අසමානයහ. මේ ක්‍ර‍මයෙන් ඉතිරි ස්වරයන්ගේ ද අසමානත්‍වය සලකාගත යුතුයි."],["p","**වා පරො අසරූපා.**"],["p","**අසමානරූපම්හා සරම්හා පරො සරො ලොපං පප්පොති වා.**"],["p","**(අසවර්ණ වූ ස්වරයට පසුව ඇති ස්වරය ඇතැම් විට ලොප් වේ)**"],["p","චක්ඛුන්ද්‍රියං - ජිනවචනයුත්තඤ්හි"],["p","චක්ඛු + ඉන්‍ද්‍රියං - විසන්ධි"],["p","චක්ඛ් - උ + ඉන්ද්‍රියං - පුබ්බමධොඨිතමස්සරං සරෙන වියොජයෙ."],["p","චක්ඛ් - උ + ඉන්ද්‍රියං - වා පරො අසරූපා."],["p","චක්ඛ් - උ + න්ද්‍රියං - නයෙ පරං යුත්තෙ."],["p","චක්ඛුන්ද්‍රියං - ජිනවචනයුත්තඤ්හි"],["r","**මුලදී සිටි ආකාරය**\t**පරස්වරය මකා සන්‍ධි කළ පසු**"],["r","යස්ස + ඉදානි\t= යස්සදානි (= යමකට දැන්)"],["r","සඤ්ඤා + ඉති\t= සඤ්ඤාති (=සංඥාවයැයි)"],["r","ඡායා + ඉව\t= ඡායාව (=සෙවණැල්ල මෙන්)"],["r","ඉති + අපි\t= ඉතිපි (=මෙසේ ද)"],["r","චක්ඛු + ඉන්‍ද්‍රියං\t= චක්ඛුන්‍ද්‍රියං (=ඇස නමැති ඉන්‍ද්‍රිය)"],["r","අකතඤ්ඤු + අසි\t= අකතඤ්ඤු’සි (=අකෘතඥ වෙහි.)"],["r","තෙ + අපි\t= තෙ’පි (=ඔවුහු ද)"],["r","වන්‍දෙ + අහං\t= වන්‍දො’හං (= මම වඳිම්.)"],["r","සො + අහං\t= සො’හං (= ඒ මම)"],["r","අනාථපිණ්ඩිකො+අපි\t= අනාථපිණ්ඩිකො’පි (= අනේපිඬු"],["p","සිටුතෙමේ ද)"],["r","මොග්ගල්ලානො+ආසි\t= මොග්ගල්ලානො’සි"],["p","(= මෞද්ගල්‍යාන ස්ථවිර තෙම විය.)"],["r","කථා + එව කා\t= කථාවකා (= කුමන කතාවක් ද?)"],["r","පාතො + එව\t= පාතො’ව (= උදෑසන ම)"],["r","ආබාධිකො + අහං\t= ආබාධිකො’හං (= රෝගී වූ මම)"],["r","දෙවතා නු + අසි\t= දෙවතා නු’සි?(=දේවතාවක් හෝ වෙහි ද?)"],["p","**සංලක්‍ෂ්‍යය :-**"],["p","යස්ස්- අ + ඉදානි"],["p","**යස්සදානි** යන තැන පූර්‍ව ස්වරය ලොප් කොට **යස්සිදානි** කියා ද සන්‍ධි කළ හැක."],["p","ත් - එ + අපි"],["p","එහෙත් ‘තෙ අපි’ යන තැන පූර්‍ව ස්වරය ලොප් කොට ‘තපි’ කියා සන්‍ධි කළහොත් සන්‍ධි කොට තිබෙන්නේ අසවල් පද දෙකයයි තේරුම් ගැනීම අපහසු වේ. එබැවින් එවැනි තැන්වලදී පූර්‍ව ස්වර ලෝප සන්‍ධිය නොකොට පරස්වර ලෝප සන්‍ධිය කටයුතු."],["li","**අසමාන වූ පූර්‍වස්වරයා ලොප් කළ කල්හි පසුව සිටි ඉ-ඊ දෙදෙන එ-කාර බවට ද උ-ඌ දෙදෙන ඔ - කාර බවට ද පැමිණෙත්.**"],["p","**ක්වචාසවණ්ණං ලුත්තෙ.**"],["p","**ඉවණ්ණභූතො, උකාරභූතො ච පරො සරො අසරූපෙ පුබ්බස්සරෙ ලුත්තෙ ක්වචි අසවණ්ණං පප්පොති.**"] ාහටානි - ජිනවචනයුත්තඤ්හි","ආභත = ආහට / ආභත+ක =ආභතක","පුත්තානම්පි - ජිනවචනයුත්තඤ්හි","පුත්තානං + අපි - විසන්ධි","පුත්තානං + අපි - පරො වා සරො (නිග්ගහීතයක් මුලින් ඇති විට පර ස්වර ලෝපය)","පුත්තාන ං➔ම් + පි - වග්ගන්තං වා වග්ගෙ (දෙවැනි පදයේ ඉතිරිව ඇති පදයේ මුල් ව්‍යඤ්ජනයේ වර්ගාන්ත ආදේශය)","පුත්තානම්පි - ජිනවචනයුත්තඤ්හි","ධීතරානම්පි - ජිනවචනයුත්තඤ්හි","ධීතරානං + අපි - විසන්ධි","ධීතරානං + අපි - පරො වා සරො","ධීතරාන ං➔ම් + පි - වග්ගන්තං වා වග්ගෙ","ධීතරානම්පි - ජිනවචනයුත්තඤ්හි"]},{"f":"සබ්බඤ්ඤුනො නිසීදිතුං ජෙතවනවිහාරෙ (ජෙතවනෙ) බහූනි පඤ්ඤත්තානෙවාසනානි හොන්ති.( පඤ්ඤත්තානි +එව +ආසනානි)","t":[["සබ්බඤ්ඤුනො",["පොත්ථකමදදි","සබ්බඤ්ඤුනො","සබ්බේසානමෙව"],1],["නිසීදිතුං",["ආබාධිකොහං","නිසීදිතුං","පූ‍ජෙසුං"],1],["ජෙතවනවිහාරෙ",["ගාමවාසීනමාහ","ජෙතවනවිහාරෙ","මාතුට්ඨානෙ"],1],["බහූනි",["බහූනි","ඵලානි","කරොති"],0],["පඤ්ඤත්තානෙවාසනානි",["පඤ්චවීසතිවස්සානි","මාලකසම්මජ්ජනාදීනි","පඤ්ඤත්තානෙවාසනානි"],2],["හොන්ති",["දෙසෙසි","පඤ්ඤායි","හොන්ති"],2]],"d":["පඤ්ඤත්තානෙව - ජිනවචනයුත්තඤ්හි","පඤ්ඤත්තානි + එව - විසන්ධි","පඤ්ඤත්තාන් - ඉ + එව - පුබ්බමධොඨිතමස්සරං සරෙන වියොජයෙ.","පඤ්ඤත්තාන් - ඉ + එව - සරා සරෙ ලොපං","පඤ්ඤත්තාන් ➔ + එව - නයෙ පරං යුත්තෙ.","පඤ්ඤත්තානෙව - ජිනවචනයුත්තඤ්හි","පඤ්ඤත්තානෙවාසනානි - ජිනවචනයුත්තඤ්හි","පඤ්ඤත්තානෙව + ආසනානි - විසන්ධි","පඤ්ඤත්තානෙව් - අ + ආසනානි - පුබ්බමධොඨිතමස්සරං සරෙන වියොජයෙ.","පඤ්ඤත්තානෙව් - අ + ආසනානි - සරා සරෙ ලොපං","පඤ්ඤත්තානෙව් ➔ + ආසනානි - නයෙ පරං යුත්තෙ.","පඤ්ඤත්තානෙවාසනානි - ජිනවචනයුත්තඤ්හි"]},{"f":"පුරා ලඞ්කාවාසීනං / ලඞ්කිකානං මහන්තො අමනුස්සුපද්දවොපි ‍රොගොපි අහෙසුං.","t":[["පුරා",["සත්තා","පුරා","පහාය"],1],["ලඞ්කාවාසීනං",["ආබාධිකොහං","ලඞ්කාවාසීනං","විහාරමාගතානං"],1],["මහන්තො",["මිත්තො","මිගාරො","මහන්තො"],2],["අමනුස්සුපද්දවොපි",["පඤ්ඤත්තානෙවාසනානි","අමනුස්සුපද්දවොපි","පඤ්චවීසතිවස්සානි"],1],["‍රොගොපි",["පඤ්ඤායි","ආවුසොති","‍රොගොපි"],2],["අහෙසුං",["අත්තානං","පරලොකං","අහෙසුං"],2]],"d":["මහන්තාමනුස්සුපද්දවො","අමනුස්සුපද්දවො - ජිනවචනයුත්තඤ්හි","අමනුස්ස + උපද්දවො - විසන්ධි","අමනුස්ස් - අ + උපද්දවො - පුබ්බමධොඨිතමස්සරං සරෙන වියොජයෙ","අමනුස්ස් - අ + උපද්දවො - සරා සරෙ ලොපං","අමනු  සුබමාවහාති.” (සංයුත්ත)","“තස්මාතිහ භික්ඛවෙ එවං සික්ඛිතබ්බං පඤ්ඤාවුද්‍ධියා වඩ්ඪිස්සාමාති.” (අඞ්ගුත්තර එකක නිපාත)","“තයො, මෙ භික්ඛවෙ ගිලානා සංවිජ්ජමානා ලොකස්මිං.... තයො’ මෙ ගිලානූපමා පුග්ගලා.” (අඞ්ගුත්තර)","අණ්ඩං රක්ඛන්ති කිකී’ව, වාලධිං රක්ඛන්ති චමරී’ව තුම්හෙ’පි සාධුකං අත්තනොසීලං රක්ඛථ.","‘තතො නං සුඛ’මන්‍වෙති ඡායා’ව අනපායිනී.’ (ධම්මපද)","යාවතක්‍වස්ස කායො, තාවතක්‍වස්ස ව්‍යාමො (හොති).","‘නයි’ධ නච්චං වා ගීතං වා තාළං වා සුසමාහිතං.” (ජාතක)"],"s":["මෙහි රැස්වූ යම් අමනුෂ්‍ය කෙනෙක් වෙත් නම් ඒ සියලු දෙන ම සතුටු සිතැත්තෝ වෙත්වා.","මහණෙනි, මේ අකුශල මූලයෝ තුන්දෙනෙක් වෙති.","යම් සේ කැපූ ගස බිම වැටේ ද, එමෙන් මාරයා විසින් මනුෂ්‍යයෝ මරණයට හෙළනු ලැබෙත්.","ඒ මම තාගේ කීම නොකරමි. මාගේ මෑණියන් කී සේ කරමි.","ඉදින් මේ කුමරා පැවිදි වන්නේ නම් බුද්ධත්‍වය ලබන්නේ ය.","මම දැන් මාගේ දරුවන් සමග විහාරයට ගොස් බණ අසා ආවෙමි.","මාණවකය, නොපැතිය යුත්තක් පතන තෝ අඥානයෙක් වෙහි.","‘මේ ගම අසල කිසියම් කැලෑබද විහාරයක් ඇත්තේ දැ’යි ඇසූ විට උපාසකයා ‘ස්වාමීනි ඇතැ’යි කීය.","ඇමතියා ‘යහපති, දේවයන් වහන්සැ’යි කියා රජගෙයින් නික්ම ගියේ ය.","ආනන්‍ද සිටුතෙමේ අඩමසක් පාසා තමාගේ නෑයන් රැස් කරවා ඔවුන් ඉදිරියෙහි පුත්‍ර‍යාට අවවාද කෙළේ ය.","යම් සේ එක් ඇසක් ඇති මිනිසෙක් ඒ ඇස රක්නේ ද, එමෙන් ශීලය මනාව රැක්ක යුතු.","දේවතාවා භාග්‍යවතුන් වහන්සේ යම් තැනක ද එතැනට එළඹ උන්වහන්සේට වැඳ ප්‍ර‍ශ්නයක් විචාළේ ය."],"gp":[["ආගාර","ගෙය, න."],["අජ්ඣාවසති","වාසය කෙරේ"],["අනපායිනී","අත්හැර නොයන්නී. ඉ."],["අසි","වෙහි"],["අනුපද්දව","උපද්‍ර‍ව නැති. 3"],["අනූහත","නොඉදුරු. 3."],["අබ්බුළ්හසල්ල","ඉදුරූහුල් ඇති. 3."],["අම්හි","වෙමි"],["අස්මි","වෙමි"],["ආවහාති","එළවයි, ගෙන දෙයි"],["කිකී","කිරල්දෙන. ඉ."],["කිංසු","ප්‍ර‍ශ්න විචාරීමෙහි නිපාත යක්. නි."],["ගිලාන","රෝගියා. පු. රෝගීවූ"],["ගිලානූපම","රෝගියාට සමාන වූ. 3."],["ගීත","ගී කීම. න."],["චක්කවත්ති","සක්විති. පු."],["චමරී","සෙමරා. පු."],["තණ්හානුසය","මුල්බැසගත් තෘෂ්ණාව. පු."],["තස්මා","එහෙයින්. නි."],["තාදිස","එවැනි. 3."],["තාවතක","එපමණ. 3."],["තාළ","තූර්‍ය්‍යවාදනය. න."],["නච්ච","නැටීම. න."],["දළ්හ","දැඩි, ස්ථිර. 3."],["නිබ්බුත","නිවුණු, සංසිඳුණු. 3."],["පණ්ණසාලා","පන්සල. ඉ."],["පුග්ගල","පුද්ගලයා. පු."],["පුනප්පුන  අන්තරං = නිරන්තරං (නිරතුරුව)"],["p","**නිරන්තරං - ජිනවචනයුත්තඤ්හි**"],["p","**නි + අන්තරං - විසන්ධි**"],["p","**නි + ර් + අන්තරං - යවමදනතරලා චාගමා**"],["p","**නි + ර් ➔ අන්තරං - නයෙ පරං යුත්තෙ‍**"],["p","**නිරන්තරං - ජිනවචනයුත්තඤ්හි**"],["p","නි + උත්තරො = නිරුත්තරො (වඩා ශ්‍රෙෂ්ඨයකු නැති)"],["p","**නිරුත්තරො - ජිනවචනයුත්තඤ්හි**"],["p","**නි + උත්තරො - විසන්ධි**"],["p","**නි + ර් + උත්තරො - යවමදනතරලා චාගමා**"],["p","**ඡ + ළ් නි + ර් + උත්තරො - නයෙ පරං යුත්තෙ**"],["p","**නිරුත්තරො - ජිනවචනයුත්තඤ්හි**"],["p","ඡ + අභිඤ්ඤා = ඡළභිඤ්ඤා (අභිඥාවෝ සදෙන)"],["p","(ලළානමවිසෙසො- ළ&ල යෙදීම අවිශේෂයි)"],["p","**ඡළභිඤ්ඤා - ජිනවචනයුත්තඤ්හි**"],["p","**ඡ + අභිඤ්ඤා - විසන්ධි**"],["p","**ඡ + ළ් + අභිඤ්ඤා - යවමදනතරලා චාගමා**"],["p","**ඡ + ළ් ➔ අභිඤ්ඤා- නයෙ පරං යුත්තෙ**"],["p","**ඡළභිඤ්ඤා - ජිනවචනයුත්තඤ්හි**"],["p","**පුථගෙව - ජිනවචනයුත්තඤ්හි**"],["p","**පුථ + එව - විසන්ධි**"],["p","**පුථ + ග් + එව - යවමදනතරලා චාගමා**"],["p","**පුථ + ග් ➔ එව - නයෙ පරං යුත්තෙ**"],["p","**ඡළභිඤ්ඤා - ජිනවචනයුත්තඤ්හි**"]]},{"p":["මනුස්සා ආයුක්ඛයෙන කම්මක්ඛයෙන පුඤ්ඤක්ඛයෙන මරන්ති.","සුමෙධතාපසො පඨමජ්ඣානං දුතියජ්ඣානං ච නිබ්බත්තෙසි.","නිම්මලස්ස සීලස්ස පාලනං මහප්ඵලං මහානිසංසං හොති.","‘පෙමතො ජායතී සොකො - පෙමතො ජායතී භයං පෙමතො විප්පමුත්තස්ස - නත්‍ථි සොකො, කුතො භයං?","භගවතා තණ්හක්ඛයාය ධම්මො දෙසිතො හොති.","‘උපක්කිලිට්ඨස්ස විසාඛෙ කායස්ස උපක්කමෙන පරියොදපනා හොති.’","‘යො ච තුලං ච පග්ගය්හ වර’මාදාය පණ්ඩිතො පපානි පරිවජ්ජෙති ස’මුනි තෙන සො මුනී.’ (ධම්මපද)","‘නහි වෙරෙන වෙරානී - සම්මන්තී’ධ කුදාචනං, අවෙරෙන ච සම්මන්ති - එස ධම්මො සනන්තනො’ (ධම්ම පදය)","ධම්මාසොකො දෙවානම්පියතිස්සස්ස බහූ පණ්ණාකාරෙ පෙසෙත්‍වා පුනපි රජ්ජාභිසෙකං කාරෙසි.","‘යම්හි ඣානං ච පඤ්ඤා ච - ස’වෙ නිබ්බානසන්තිකෙ.’ (ධම්ම පද)","‘සබ්බෙ සංඛාරා අනිච්චාතී යදා පඤ්ඤාය පස්සතී අථ නිබ්බින්‍දතී දුක්ඛෙ එසමග්ගො විසුද්‍ධියා. (එම)"],"s":["දෙවිවරු පින් ගෙවීමෙන් ද ආයුෂ ගෙවීමෙන් ද දෙව් ලොවින් ච්‍යුත වෙති.","තාපසවරු ප්‍ර‍ථමධ්‍යානය ලබා සිත් නිර්‍මල කෙරෙත්.","ධනය නැත්තන් විසින් දන්දීම අපහසු ය.","යමෙක් අල්පශ්‍රැත වේ නම් හෙතෙම නිවන නොලබයි.","රූපස්කන්‍ධය පෙණපිඬක් වැනි යයි තථාගතයන් වහන්සේ වදාළහ.",  (ස්වල්ප ඉගනීම් ඇත්තා.)"],["p","පරි + චජති = පරිච්චජති (පරිත්‍යාග කරයි)"],["p","උප + දවො = උපද්දවො (උපද්‍ර‍වය)"],["p","උප + කිලිට්ඨ = උපක්කිලිට්ඨ (කිලිටි වූ)"],["p","නි + මල = නිම්මල (මල රහිත වූ)"],["p","පරා + කමො = පරක්කමො (පරාක්‍ර‍මය) (මෙතැන පූර්‍ව ස්වරය හ්‍ර‍ස්ව වේ.)"],["p","**12. ස්වරයකින් පර වූ වර්‍ගයන්ගේ දෙවෙනි සතරවැනි (මහා ප්‍රාණ අක්‍ෂරයන්ට ද්විත්ව වෙන විට ඒ ඒ වර්ගයන්ගේ පළමු තෙවැනි (අල්පප්‍රාණ) අක්‍ෂරයෝ වෙති. **"],["p","(ක වර්‍ගයේ දෙවෙනි අකුර ඛ - යන්නයි. එයට ද්විත්ව වෙන විට තවත් ඛ - යන්නක් නොවී ඒ වර්ගයේ මුලකුරවූ ක් - යන්නක් වේ. එවිට ‘ක්ඛ’ යි සිටී, වර්ගයන්ගේ දෙවැනි අක්‍ෂරයන්ට ප්‍ර‍ථම අක්‍ෂරයෝත් සිවුවෙනි අක්‍ෂරයන්ට තෙවැනි අක්‍ෂරයෝත් ද්විත්ව වශයෙන් පැමිණෙතියි දතයුතු.)"],["p","දු + භික්ඛං = දුබ්භික්ඛං (දුර්භික්‍ෂය)"],["p","නි + ධනො = නිද්ධනො (ධනය නැත්තා)"],["p","නි + භය = නිබ්භය (භය නැති)"],["p","පඨම + ඣානං = පඨමජ්ඣාන (ප්‍ර‍ථමධ්‍යානය)"],["p","රූප + ඛන්‍ධො = රූපක්ඛන්‍ධො (රූපස්කන්‍ධය)"],["p","ආයු + ඛයො = ආයුක්ඛයො (ආයුෂ ගෙවීම)"],["p","සෙත + ඡත්තං = සෙතච්ඡත්තං (සුදු කුඩය)"],["p","තත්‍ර‍ + ඨිතො = තත්‍ර‍ට්ඨිතො (එහි සිටියේ)"],["p","නි + ඵලං = නිප්ඵලං (ඵල රහිත දෙය)"],["p","උ + ඝොසනං = උග්ඝොඝනං (=උද්ඝෝෂණය කිරීම)"],["p","**13. ව්‍යඤ්ජනයක් පරකල්හි ඇතැම් විට ස්වරයෝ දීර්ඝ බවට පැමිණෙත්. (මෙය වනාහි බොහෝ සේ ගාථාවල ඡන්‍දස් නොබිඳීම පිණිස කරනු ලැබේ.)**"],["p","ඛන්ති + පරමං + ඛන්තී පරමං"],["p","ජායති + සොකො = ජායතී සොකො"],["p","මඤ්ඤති + බාලො = මඤ්ඤතී බාලො"],["p","නිබ්බත්තති + දුක්ඛං = නිබ්බත්තතී දුක්ඛං"],["p","(9 වැනි අඞ්කයෙහි දැක්වූ ‘ස්වාහං, ස්වායං’ යන දෙතැන ඔකාරයට වකාර කළ පසු පරස්වරය දීර්ඝ වන්නේ මේ 13 වැනි රීතියෙනැයි දත යුතු.)"],["p","**14. සංයුක්ත ව්‍යඤ්ජනයක් (බැඳි අකුරක්) පරවූ කල්හි බොහෝ සේම ස්වරයෝ හ්‍ර‍ස්ව බවට පැමිණෙත්.**"],["p","පාලියෙහි බැඳි අකුරකට මුලින් දීර්ඝ ස්වරයක් දක්නා ලැබෙන්නේ ස්වල්ප වශයෙනි."],["p","“මහා + ඵලං” යන තැන 12 වැනි රීතියෙන් ද්විත්වය වූ පසු මේ (14 වැනි) රීතියෙන් පූර්ව ස්වරයට හ්‍ර‍ස්ව වේ. එවිට “මහප්ඵලං” යි සිටී."],["p","ආ + ඛාතො = අක්ඛාතො (කියන ලද්දේ)"],["p","තණ්හා + ඛයො = තණ්හක්ඛයො (තෘෂ්ණාව ක්‍ෂය කිරීම)"],["p","ආණා + ඛෙත්තං = ආණක්ඛෙත්තං (අණ පවත්නා තැන)"],["p","යන මේ තැන් ද ‘මහප්ඵල’ යන්න මෙන් සිද්‍ධවෙත්."],["p","පරා + කමො = පරක්කමො (පරාක්‍ර‍මය) ආ + සාදො = අස්සාදො (ආස්වාදය : රස විඳීම) යන තන්හි 11 වැනි රීතියෙන් ද්විත්වය වූ පසු පූර්ව ස්වරයට හ්‍ර‍ස්ව වේ."],["p","යිට්ඨං වා + හුතං වා + ලොකෙ = යිට්ඨංව හුතංව ලොකෙ"],["p","යදි වා + සාවකෙ = යදි ව සාවකෙ"],["p","භොවාදී + නාම සො = භොවාදි නාම සො යන තන්හි ඡන්‍දස් නොබිඳීම සඳහා හ්‍ර‍ස්ව වේ."],["p","**15. ව්‍යඤ්ජනයක් හෝ ස්වරයක් පර වූ කල්හි එත - ත - යන ශබ්දයන්ගේ පඨමා එකවචනයෙහි වූ ඔකාරයට අකාරයක් වේ.**"],["p","එසො + ධම්මො = එසධම්මො = (මේ ධර්‍මතෙම)"],["p","සො + මුනි = සමුනි (හෙතෙම මුනි වේ.)"],["p","සො + සීලවා = සසීලවා (හෙතෙම සිල් ඇත්තේ ය.)"],["p","එසො + පත්තො = එසපත්තො (හෙතෙම පැමිණියේ.)"],["p","එසො + ඉදානි = එසදානි (මේ තෙම දැන්)"]]},{"p":["තස්ස අත්තනො ච තාසඤ්ච දෙවතානං සද්‍ධඤ්ච සීලඤ්ච සුතඤ්ච චාගඤ්ච පඤ්ඤඤ්ච අනුස්සරතො චිත්තං පසීදති. (අඞ්ගුත්තර)","“තස්මා සඤ්ඤමයත්තානං අස්සං භද්‍රං’ච වාණිජො.” (ධම්මපද)","“කරොමි තෙ තං වචනං ත්‍වං’සි ආචරියො මම” (ධ.අ)","අනුස්සරෙථ සම්බුද්‍ධං භයං තුම්හාකං නො සියා. (සංයු)","එවා’හං වින්තයිත්‍වාන නෙකකොටිසතං ධනං නාථානාථානං දත්‍වාන හිමවන්තමුපාගමිං” (බුද්‍ධවංස)","“දායකො දානපති යඤ්ඤදෙ’ව පරිසං උපසඞ්කමති....... විසාරදො’ව උපසඞ්කමති.” (අඞ්ගුත්තර)","“අඤ්ඤාය ච පනා’හං සමණානං සක්‍යපුත්තියානං ධම්මං එවා’හං තස්මා ධම්මවිනයා අපක්කන්තො.” (තිකඞ්ගුත්තර)","තෙන’හි ගහපති තඤ්ඤෙ’වෙ’ත්‍ථ පටිපුච්ඡිස්සාමි.","තඤ්හි තස්ස සකං හොති තඤ්ච ආදාය ගච්ඡති. (සං.නි.)","ඉමානි චත්තාරි අරියසච්චානීති භික්ඛවෙ........ යන්තං වුත්තං ඉදමෙතං පටිච්ච වුත්තං.” (තිකඞ්ගුත්තර)","තණ්හඞ්කරො මෙධඞ්කරො සරණඞ්කරො දීපඞ්කරොති චත්තාරො බුද්‍ධා එකස්මිඤ්ඤෙව කප්පෙ උප්පජ්ජිංසු,","‘ඉදමවොච භගවා, අන්තමනා තෙ භික්ඛූ භගවතො භාසිතං අභිනන්‍දුන්ති.’ (බොහෝ සූත්‍ර‍වල.)","‘කාමං පතාමි නිරයං උද්‍ධපාදො අවංසිරො.’ (ඛදිරඞ්ගාර ජාතක)"],"s":["සිල්වතා යම් යම් පිරිසක් කරා පැමිණේ නම් නිර්භයව ම පැමිණෙයි. මෙය ද ශීලයාගේ එක් ඵලයකි.","මම මෙසේ සිතා දෙසියයක් යාචකයන්ට දන් දුනිමි.","ඒ කාරණය ම මම ඔහුගෙන් නැවත විචාළෙමි.","ධර්‍මදේශනාවන්ගේ අවසානයේ දී භික්‍ෂූහු සැරියුත් මහ තෙරුන් වහන්සේගේ කීමට සතුටු වූහ.","ඉදින් තෙපි නිතර බුදුන් සිහිකරව් නම් තොපට භයක් නූපදින්නේ ය.","මනුෂ්‍යයා යම් පිනක "ධම්මං + චරෙ = ධම්මඤ්චරෙ (ධර්‍මයෙහි හැසිරෙන්නේ ය)"],["p","තං + ඨානං = තණ්ඨානං (ඒ ස්ථානය)"],["p","ජුතිං + ධරො = ජුතින්‍ධරො (ආලෝකය දරන්නා)"],["p","තං + ඵලං = තම්ඵලං (ඒ ගෙඩිය)"],["p","දීපං + කරො = දීපඞ්කරො (එනම් සර්‍වඥතෙමේ)"],["p","සං + ඨිතො = සණ්ඨිතො (මනාව පිහිටියේ)"],["p","සං + චරති = සඤ්චරති (හැසිරේ)"],["p","සං + මතො = සම්මතො (සම්මත වූයේ)"],["p","එවං + මෙ සුතං = එවම්මෙ සුතං (මෙසේ මා විසින් අසන ලදි.)"],["p","**සංලක්‍ෂ්‍යය :-**"],["p","වර්ගයේ පස්වැනි අකුර පරව සිටි විට බින්දුවට එයම ආදේශ වන බව සම්මතො, එවම්මෙ යන උදාහරණ දෙකේ පැහැදිලි වේ."],["p","පුං + ලිඞ්ගං = පුල්ලිඞ්ගං ආදි තන්හි ලකාරය පර වූ විට බින්දුවට ලකාර වේ යයි දතයුතු."],["p","**17. එකාරය ද හකාරය ද පර කල්හි බින්දුවට ඤකාරාදේශ වේ. එකාරය පර කල්හි ඤකාරයට ද්විත්‍ව ද වේ.**"],["p","තං + එව = තඤ්ඤෙව (එයම)"],["p","පච්චත්තං+එව = පච්චත්තඤ්ඤෙව (තම තමා කෙරෙහි ම)"],["p","තං + හි = තඤ්හි (එය වනාහි)"],["p","එවං + හි = එවඤ්හි (මෙසේ වනාහි)"],["p","**18. යකාරය පර කල්හි පූර්‍වව සිටි බින්දුව ඒ යකාරය සමග ඤකාර බවට පැමිණේ. ඤකාරය ද්විත්ව වේ.**"],["p","සං + යොගො = සඤ්ඤොගො (යෙදීම)"],["p","සං + යතො = සඤ්ඤතො (හික්මුණේ)"],["p","යං + යදෙව = යඤ්ඤදෙව (යමක් යමක් ම)"],["p","ආනන්තරිකං + යමාහු = ආනන්තරිකඤ්ඤමාහු (යමක් ආනන්තරිකයයි කීවාහු ද)"],["p","**19. ස්වරයක් පර කල්හි බින්දුවට ඇතැම් තැනකදී දකාරය ද ඇතැම් තැනකදී මකාරය ද ආදේශ වෙති.**"],["p","(දකාරාදේශය ය-ත එත ශබ්දයන් කෙරෙන් පර වූ බින්දුවට පමණෙකි.)"],["p","එතං + එව = එතදෙව (මෙය ම)"],["p","තං + අනත්තා = තදනත්තා (එය අනාත්මයයි.)"],["p","තං + අහං = තමහං (මම ඔහු)"],["p","තං + එව = තමෙව හෝ තදෙව (එයම)"],["p","එවං + එව = එවමෙව (මෙසේ ම)"],["p","කිං + එතං = කිමෙතං (මෙය කුමක් ද?)"],["p","එතං + ආවොච = එතදවොච (මෙය කීය)"],["p","**20. ස්වරයක් හෝ ව්‍යඤ්ජනයක් පර කල්හි ඇතැම් තැනක බින්දුවට ලොප් වේ. ඉන්පසු ඇතැම් විට පූර්‍වස්වරයට ලෝපය ද පරස්වරයට දීර්‍ඝ ද වේ.**"],["p","තාසං + අහං = තාසාහං (මම ඈලාට)"],["p","අදාසිං + ආහං = අදාසාහං (මම දුනිමි)"],["p","එවං + අහං = එවාහං (මෙසේ මම)"],["p","සච්චානං + දස්සනං = සච්චානදස්සනං (සත්‍යයන් දැකීම)"],["p","බුද්‍ධානං + සාසනං = බුද්‍ධානසාසනං (බුදුවරුන්ගේ අනුශාසනය)"],["p","ගන්තුං + කාමො = ගන්තුකාමො (යනු කැමැත්තේ.)"],["p","**21. ඇතැම් තැනක බින්දුවෙන් පරවූ ස්වරයට ලොප් වේ. ඉන්පසු බින්දුවට මුල කී වර්ගාන්තාදේශය ද වේ. **"],["p","කතං + ඉති = කතන්නි (කරන ලදැයි)"],["p","චක්කං + ඉව = චක්කංව (චක්‍ර‍ය මෙන්)"],["p","ත්‍වං + අසි = ත්‍වංසි (තෝ වෙහි)"],["p","අභිනන්‍දුං + ඉති = අභිනන්‍දුන්ති (සතුටු වූහයි.)"],["p","ඉදං + අපි = ඉදම්පි (මෙයද)"],["p","උත්තරිං + අපි = උත්තරිම්පි (මත්තෙහිත්)"],["p","කිං + ඉදානි = කින්‍දානි (දැන් කුමක්)"],["p","හලං + ඉදානි = හලන්‍දානි (දැන් පමණය)"],["p","**22. ඇතැම් තැනක ස්වරයක් හෝ ව්‍යඤ්ජනයක් පර කල්හි බින්දුවක් ආගම වේ.**"],["p","චක්ඛු + උදපාදි = චක්ඛුං උදපාදි (ඇස හටගත්තේය.)"],["p","අණු + ථූලානි = අණුං ථූලානි (කුඩා මහත් දේවල්)"],["p","අව + සිරො = අවංසිරො (යටිකුරු හිස් ඇත්තේ)"],["p","යාව + ච + ඉධ = යාචිඤ්චිධ (මෙහි යම් පමණ)"]]},{"p":["රාජා නගරෙ චරන්තො ධම්මං දෙසෙන්තමෙකං තාපසං පස්සි.","ධම්මං සුණන්තා බහූ මනුස්සා රාජිනි ආගච්ඡන්තෙ තමෙව ඔලොකෙසුං.","රාජුසු අන්තනො අත්තනො රට්ඨෙසු චරන්තෙසු බහූ සෙවකා සෙතච්ඡත්තානි ගහෙත්‍වා තෙ අනුගච්ඡන්ති.","රාජානො අත්තානං කුමාරෙ සකෙ සකෙ රජ්ජෙ පතිද‍්ධාපෙතුමිච්ඡන්තා තෙසං නානාසිප්පානි සික්ඛාපෙන්ති. 5 දුට්ඨගාමිණීරඤ්ඤො සාලිකුමාරො නාම එකොව පුත්තො අහොසි. සො අත්තනො පිතුසන්තකං රජ්ජං ලභිතුං න ඉච්ඡි.","සො රාජා එළාරං දමිළරාජානං මාරෙත්‍වා බුද්‍ධසාසනං සංගණ්හන්තො මහන්තානි චෙතියානි බහූ විහාරෙ ච කාරෙසි.","“ඉච්චෙව’ මච්චන්තනමස්සනීයං නමස්සමානො රතනත්තයං යං පුඤ්ඤාභිසන්‍දං විපුලං අලත්‍ථං තස්සානුභාවෙන හතන්තරායො” (විනය අටුවා)","“අථ’ස්ස උපපරික්ඛතො එතද’හොසි පච්චන්තිමෙසු ඛො ජනපදෙසු සාසනං සුප්පතිට්ඨිතං භවිස්සතීති” (විනය අටුවා)","“සෙට්ඨි කම්පමානො ධනසොකෙන සතිං පච්චුපට්ඨාපෙතුං අසක්කොන්තො තත්‍ථෙ’ව පති.’ (ඉල්ලීස ජාතක)","එකච්චො පුග්ගලො නීචෙ කුලෙ පච්චාජාතො හොති..... සොච හොති...... බව්හාබාධො කාණො වා කුණී වා. (අඞ්ගුත්තර)"],"s":["දුටුගැමුණු මහ රජු විසින් අනුරාධපුරයෙහි රුවන්මැලි මහසෑය කරවන ලදි.","පස්වැනි ජෝර්ජ් මහරජ තෙමේ තමාගේ පුත්‍ර‍ වූ ඇඩ්වඩ් කුමරා ලක්දිවට එවීය.","දේවානම්පියතිස්ස රජු ලක්දිව රාජ්‍යය කරන කල්හි අශෝකාධිරාජයාගේ පුත්‍ර‍ වූ මහින්‍ද ස්ථවිරතුමා ලක්දිවට අවුත් බුද්‍ධ ශාසනය පිහිටුවිය.","රජුන්ගේ අණින් කරවූ බොහෝ විහාරයෝ ද චෛත්‍යයෝ ද මෙහි ඇත්තාහ.","බුදුරද කපිලවස් ෙම)\tරාජානො (=රජවරු)"],["r","දු. රාජානං; රාජං (=රජ)\tරාජානො (=රජවරු)"],["r","ත. රඤ්ඤා; රාජෙන\tරාජූභි; රාජූහි; රාජෙභි"],["r","(= රජු විසින්)\tරාජෙභි (= රජුන් විසින්)"],["r","ච. ඡ. රඤ්ඤො; රාජිනො\tරඤ්ඤං; රාජූනං; රාජානං"],["r","ප. රඤ්ඤා; රාජම්හා; රාජස්මා\tරාජූභි; රාජූහි; රාජෙභි, රාජෙහි"],["r","ස. රඤ්ඤෙ; රාජිනි\tරාජුසු; රාජෙසු"],["p","රාජම්හි; රාජස්මිං"],["r","ක. රඤ්ඤා; රාජෙන\tරාජූභි; රාජූහි; රාජෙභි; රාජෙහි"],["r","ආ. (හෙ) රාජ, රාජා\t(හෙ) රාජානො"]]},{"p":["ද්වීහි වාණිජෙහි යාචිතො භගවා අත්තනො සීසතො මුට්ඨිමත්තෙ සිරොරුහෙ තෙසං අදාසි.","තෙ භගවන්තං සිරසා නමස්සිත්‍වා තානි අත්තනො නගරං නෙත්‍වා සරොරුහාදීහි පූජයිංසු.","“එකුනතිංසො වයසා බොධිසත්තො’හි නික්ඛමි. පඤ්චතිංසො’ථ වයසා බිම්බිසාරමුපාගමි.” (මහා වංස)","තමොනුදො භගවා මනොමයෙන කායෙන කම්මට්ඨානානි මනසිකරොන්තානං භික්ඛූනං අභිමුඛෙ පාතුභවති.","ඉද්‍ධිමා තපොධනො පයොනිධිම්පි සොසෙතුං. සමත්‍ථො හොති.","මහානිරයො පන අයොපාකාරෙන පරික්ඛිත්තො, අයොපිධානෙන පිහිතො, තස්ස අයොමයා භූමි තෙජසා ජලිතා හොති.","සාකටිකා ගුන්නං තිණං දත්‍වා තෙ සකටෙසු යොජෙත්‍වා පාජෙන්තා බාරාණසිං අගමංසු.","“මනොපුබ්බඞ්ගමා ධම්මා, මනොසෙට්ඨා මනොමයා” (ධම්මපද)","මනුස්සා ගවා පයං, පයසා දධිං, දධිතො සප්පිඤ්ච ලභන්ති.","සො මෙත්තාසහගතෙන චෙතසා එකදිසං එරිත්‍වා විහරති. තථා දුතියං. තථා තතියං.","භගවති චෙතො පසාදෙන බහවො ජනා මහන්තං දිබ්බසම්පත්තිං ලභිංසු.","භගවා නභසා ලඞ්කාදීපමාගම්ම යක්ඛසමාගමස්ස උපරි නහසි නිසීදිත්‍වා ධම්මදෙසනාය තෙ දමෙසි.","අයසා’ච මලං සමුට්ඨිතං තදුට්ඨාය තමෙව ඛාදති” (ධම්මපද)","වචසා කතං කම්මං වාචසිකං, මනසා කතං කම්මං මානසිකං නාම හොති."],"s":["භික්‍ෂුතෙම කරුණාසහගත සිතින් මුළුලොව පතුරුවමින් වාසය කරයි.","පක්‍ෂීහු අහසින් ගමන්කොට තමන් කැමැති තැන්වලට යත්. (“අහසින්” යන්නට නභ ශබ්දය යොදනු)","අපේ කුඹුරු සීසෑමෙහි සහායවූ අපට කිරි හා ගිතෙල් දෙන ගවයෝ අප විසින් නොමැරිය යුත්තාහ.","කයින් ද වචනයෙන් ද සිතින් ද පින් කරත්. ඒ තුන්දොරින් පව් ද කළ හැක.","වෙළඳුන් දෙදෙනෙකුන් විසින් තථාගතයන් වහන්සේගේ කේශ ධාතුන් (සිරොරුහ යොදනු) පිහිටුවා මහාචෛත්‍යයක් කරවන ලදි.","ඒ චෛත්‍යය වෙතට පයින් ගොස් හිසෙන් නැමද දිව්‍ය සම්පත් ලබන්නෝ බොහෝ වෙති.","මෙකල ධනවත්තු පෙර සෘද්‍ධිමතුන් මෙන් අහසින් ගමන්කොට අභිමත තැනට වහා පැමිණෙත්.","යකඩින් කළ පාලම් ලක = මුහුද)"],["p","තප + ධන = තපොධන (= පැවිද්දා)"],["p","තෙජ + ධාතු = තෙජොධාතු (උෂ්ණ ගුණය)"],["p","**28. ඔකාරාන්ත පුල්ලිඞ්ගික ගො - ශබ්දය**"],["r","**එක වචන**\t**බහු වචන**"],["r","ප. ගො (= ගවතෙම)\tගාවො (ගවයෝ)"],["r","දු. ගාවුං; ගාවං; ගවං (= ගවයා)\tගාවො; (= ගවයන්)"],["r","ත. ගාවෙන; ගවෙන\tගොභි; ගොහි"],["r","(= ගවයා විසින්)\t(= ගවයන් විසින්)"],["r","ච. ඡ. ගාවස්ස; ගවස්ස\tගවං, ගුන්නං; ගොනං"],["r","ප.\tගාවා; ගවා"],["r","ගාවම්හා; ගවම්හා;\tගොභි; ගොහි"],["p","ගාවස්මා, ගවස්මා"],["r","ස.\tගාවෙ; ගවෙ;\tගාවෙසු, ගවෙසු, ගොසු"],["p","ගාවම්හි, ගවම්හි;"],["p","ගාවස්මිං, ගවස්මිං"],["r","ක.\tගාවෙන; ගවෙන\tගොහි, ගොහි"],["r","ආ.\t(හෙ) ගො\t(හෙ) ගාවො"]]},{"p":["බුද්‍ධාදිච්චෙ අනුදිතෙ චන්‍දරිසුරිය - සහස්සානිපි මොක්ඛ මග්ගං පාකටං කාතුං න සක්කොන්ති.","මහාපුරිසෙ මහාබොධි මුපසඞ්කමන්තෙ මහාපඨවී මහාරවා රවමානා කම්පි.","ධම්මාසොකමහාරාජා සට්ඨිසහස්සමත්තෙ සමණපතිරූපකෙ නීහරිත්‍වා බුද්‍ධසාසනං නිම්මලමකාසි.","සක්‍යසීහො අනාථපිණ්ඩිකම්හා සෙට්ඨිනා කාරිතෙ ජෙතවනමහාවිහාරෙ එකූනවීසතිවස්සානි වසි.","සාරිපුත්තත්‍ථෙරො පිප්ඵලිගුහායං සමාපත්තිසුඛෙන සත්තාහං වීතිනාමෙසි.","බුද්‍ධඝොසාචරියො ජම්බුදීපතො සීහලදීපමාගන්ත්‍වා අනුරාධපුරෙ මාගධභාසාය පරිවත්තෙසි.","වට්ටගාමණීඅභයමහාරඤ්ඤො කාලෙ බහවො මහාථෙරා මාතුලජනපදෙ ආලොකගුහායං සන්නිපතිත්‍වා පරියත්තිධම්මං තාලපණ්ණෙසු ලිඛිංසු.","තිත්‍ථියා රත්තචන්‍දනමණ්ඩපං කාරාපෙත්‍වා තං නීලුප්පලපත්තෙහි ඡාදාපෙත්‍වා මහාජනස්ස පාටිහාරියං දස්සෙස්සාමාති තත්‍ථ අට්ඨංසු.","මහාමොග්ගල්ලානථෙරො අත්තනො ඉද්‍ධිබලෙන සක්කස්ස. දෙවරඤ්ඤො වෙජයන්තපාසාදං කම්පෙසි.","දෙවදත්තථෙරො රාජගහනගරෙ අජාසත්තුකුමාරං පසාදෙත්‍වා මහාලාභං උප්පාදෙසි.","සිද්ධත්‍ථකුමාරො උරුවෙලායං ගයාපදෙසෙ නෙරඤ්ජරානදීතිරෙ අස්සත්‍ථරුක්ඛමූලෙ නිසීදිත්‍වා වෙසාඛ පුණ්ණමියා පච්ඡිමයාමෙ අභිසම්බොධිං පාපුණි.","කිසා ගොතමී නාම ඛත්තියකඤ්ඤා නගරං පදක්ඛිණං කරොන්තස්ස බොධිසත්තස්ස රූපසිරිං දිස්වා එකං ගාථමාහ."],"s":["ක්‍ෂත්‍රිය - බ්‍රාහ්මණ කන්‍යාවෝ රතුවස්ත්‍ර‍ ඇඳ රතුපුල් ගෙන ජේතවන විහාරයට ගොස් ශාක්‍යමුනීද්‍ර‍න් වැන්දාහ.","පන්සියයක් මහරහත්හු රජගහනුවර සත්තපණ්ණිගුහාද්වාරයෙහි අජාසත් මහරජු කරවූ මණ්ඩපයෙහි ධර්‍මසංගීතිය කළහ.","සිද්‍ධාර්‍ථ කුමාර තෙමේ ඇසළ පුර පසළොස්වක්දා මධ්‍යම යාමයේදී යශෝධරාදේවිය ද රාහුල කුමරු ද සියලු සම්පත් ද හැර දමා පැවිදිවීමට ගියේ ය.","මේඝවණ්ණාභය මහ රජතුමා රත්සඳුන් කරඬුවක රන්කරඬුවක් තබා එය තුළ දන්තධාතුව තැන්පත් කොට මහා පූජවක් කරවීය.","‘මෙන්ඩුන්’ නමැති බුරුම අධිරාජතුමා බුද්ධගයාවේ මහාබෝධිය අසල මහා විහාරය මහත් ධනව්‍යයකින් ප්‍ර‍තිසංස්කරණය කරවීය.","බුද්ධඝෝෂාචාර්‍ය්‍ය තෙමේ මහා විහාරවාසී සංඝපාල මහ තෙරුන්ගෙන් සිංහල අටුවා ඉගෙන ඒවා පාලි භාෂාවට නැඟී ය.","පළමුවැනි පරාක්‍ර‍මබාහු මහ රජ තෙම මුළු ලක්දිව එකච්ඡත්‍ර‍ නංවා නිකායත්‍ර‍ය එකක් කොට ශාසනය ශුද්ධ කෙළේ ය.","ශාක්‍යසිංහතෙම තුන්ලොව සියලු දෙවි මිනිසුන්ට දහම් දෙසීය.","මහා කාශ්‍යප ස්ථවිරතුමා පන්සියයක් භික්‍ෂූන් සමග කුසිනාරානුවරට ගොස් පිරිනිවි භාග්‍යවතුන් වහන්සේගේ පාදයන් සිරසින් වැන්දේ ය.","මල්ලරජවරු බුද්ධදේහය රන්දෙනක බහා සුවඳතෙල් වත්කොට සඳුන් දරසෑයක තබා දැවූහ.","රජගහසිටුතුමා රත්සඳුන් පාත්‍ර‍යක් සාදවා සෘද්‍ධිමත්හු ඇත්නම් අහසින් අවුත් ගනිත්වායි කියා එය සැටරියන් උස් උණලීයක් මත්තෙහි තැබී ය.","පිණ්ඩොලභාරද්වාජ ස්ථවිරතුමා අහසින් ගොස් එය ගත්තේ ය. නමුත් සර්‍වඥයන් වහන්සේ ඒ පාත්‍ර‍ය බින්දෙව් සේක.","රතුරෙදි නිල්රෙදි සුදුරෙදි ආදියෙන් සැරසූ මහා මණ්ඩප සුධර්‍මා දේවසභාව මෙන් බබළයි.","උපාසක උපාසිකාවෝ සුදුවස්ත්‍ර‍ ඇඳ සුදුනෙළුම් රතුපුල් එළසඳුන් ආදිය ගෙන ගොස් රුවන්වැලි මහසෑය ද මහා බෝධිය ද මිරිසවැටි සෑය ද පුදත්."],"gp":[["අජාතසත්තු","අජාසත්. පු."],["අට්ඨකථා","අටුවාව. ඉ."],["අනුදිත","උදානොවූ. 3."],["අනෙක","නොයෙක්. 3."],["අභිසම්බොධි","බුද්‍ධත්‍වය. ඉ."],["අස්සත්‍ථරුක්ඛ","ඇසටු ගස. පු."],["ආලොකගුහා","අලුවිහාර යෙහි ගුහාව. ඉ."],["ඉද්‍ධිබල","සෘද්‍ධියේ බලය. න."],["උපසඞ්කමන්ත","එළඹෙන. 3."],["උරුවෙලා","එනම් පෙදෙස"],["කම්පි","කම්පාවිය."],["ඡාදාපෙත්‍වා","වස්වා, සෙවිලි කරවා. පූ. ක්‍රි."],["ජම්බුදීප","දඹදිව. පු."],["තාලපණ්ණ","පුස්කොළ, තල්කොළ. න."],["පසාදෙත්‍වා","පහදවා. පූ. ක්‍රි."],["පාටිහාරිය","ප්‍රාතිහාර්‍ය්‍යය. න."],["පිප්ඵලිගුහා","එනම් ඇති ගුහාව. ඉ."],["බුද්‍ධවචන","බුද්‍ධධර්‍මය. න."],["මණ්ඩප","මණ්ඩපය, මඩුව. පු."],["මහාජන","මහජනයා. පු. පසළොස්වක. ඉ."],["මහාරහ","ඉතා වටිනා. 3."],["මහාලාභ","මහත් ලාභය. පු."],["මාගධභාසා","මගධ (පාලි භාෂාව. ඉ."],["මාතලජනපද","මාතලේ පෙදෙස. පු."],["මොක්ඛමග්ග","නිවණට මග. පු."],["රව","ශබ්දය, නාදය. පු."],["තිපිටකපාළි","තුන්පිටක පෙළ.ඉ." ලං කියා සිටී. මුල්පදයේ විභක්තිය ලොප් නොවී සමාසවෙන ශබ්ද ස්වල්පයක් ද විද්‍යමාන වේ."],["p","**පාලි භාෂාවෙහි සමාසය**"],["r","1. කම්මධාරය\t4. ද්වන්‍ද"],["r","2. දිගු\t5. බහුබ්බීහි"],["r","3. තප්පුරිස\t6. අව්‍යයීභාව"],["p","යන සකොටසකට බෙදනු ලැබේ."],["h","1. කම්මධාරය සමාසය"],["p","**30. විශේෂණ විශේෂ්‍ය වශයෙන් එක් අර්‍ථයෙක්හි පවත්නා වූ සමාන විභක්ති ඇති පද දෙකක් එක් කිරීම කම්මධාරය සමාස නම් වේ.**"],["p","“සෙතං + වත්‍ථං” යන තැන ‘සෙත’ යන්න ‘වත්‍ථං’ යන්නට විශේෂණයි. ‘වත්‍ථං’ යන්න විශේෂ්‍ය (වෙහෙසිය යුතු) පදයයි. සමාසයේදී විභක්ති ලොප්කටයුතු බැවින් පද දෙකේ විභක්ති ලොප් කළ විට “සෙතවත්‍ථ” කියා සමාසනාමය සිද්‍ධ වේ. ඉන්පසු පඨමා එක වචනය යෙදූ විට “සෙතවත්‍ථං” යි සිටී."],["p","විශේෂණ පදය මුලින් සිටීම මේ කම්මධාරය සමාසයේ බහුල වූ පැවැත්මයි. නමුත් ඇතැම් විට විශේෂණපදය පසුවී ද සිටී."],["p","පඨමො + පුරිසො = පඨමපුරිසො = (ප්‍ර‍ථමපුරුෂයා). පු."],["p","සෙතො + හත්‍ථි = සෙතහත්‍ථි = (සුදු ඇතා). පු."],["p","රත්තං + උප්පලං = රත්තුප්පලං (= රතු උපුල). න."],["p","වීරො + පුරිසො = වීරපුරිසො (= වීරපුරුෂයා). පු."],["p","කණ්හො + සප්පො = කණ්හසප්පො (කළු සර්‍පයා). පු."],["p","ලොහිතං + චන්‍දනං = ලොහිතචන්‍දනං (රත් සඳුන්). න."],["p","ඛත්තියා + කඤ්ඤා = ඛත්තියකඤ්ඤා (= රාජකන්‍යාව). ඉ."],["p","සාරිපුත්තො + ථෙරො = සාරිපුත්තත්‍ථෙරො"],["p","(= ශාරීපුත්‍ර‍ස්ථවිරතෙම). පු."],["p","සුමෙධො + පණ්ඩිතො = සුමෙධපණ්ඩිතො"],["p","(සුමේධ පණ්ඩිත තෙම). පු."],["p","බුද්‍ධඝොසො + ආචරියො = බුද්‍ධඝොසාචරියො"],["p","(බුද්‍ධඝෝෂාචාර්‍ය්‍යතෙම) පු."],["p","**31. මේ සමාසයේදී මහන්ත ශබ්දය අන්‍ය ශබ්දයකට විශේෂණ වී මුලින් සිටි කල එයට ‘මහා’ ආදේශය වේ.**"],["p","මහන්තො + පුරිසො = මහාපුරිසො (= මහා පුරුෂයා). පු."],["p","මහන්තො + විහාරො = මහාවිහාරො (= මහාවිහාරය). පු."],["p","මහන්තො + මුනි = මහාමුනි (= සර්‍වඥයන් වහන්සේ). පු."],["p","මහන්තී + පඨවී = මහාපඨවී (= මහපොළොව). ඉ."],["p","මහන්තං + බලං = මහාබලං (= මහත් වූ බලය හෝ සේනාව) න."],["p","මහන්තං + භයං = මහාභයං හෝ මහබ්භයං (= මහත් වූ භය). න."],["p","‘මහබ්භය’ යන තැන මහ ආදේශයයි දක්වා තිබේ. සන්‍ධි විධියෙන් ආකාරයට හ්‍ර‍ස්ව කරන්නට ද හැකි ය."],["p","**32. සමාසයේ දී විභක්තිය ලොප් කළ විට ප්‍ර‍කෘති ශබ්දය ඉතිරි වේ. ආකාරාන්ත ස්ත්‍රීලිංගික ශබ්දයන්ගේ විභක්තිය ලොප් කළ විට ද එය ආකාරාන්තව සිටී. නමුත් යට දැක්වූ ‘කත්තියකඤ්ඤා’ යන පදයෙහි ‘ඛත්තියා’ ශබ්දයේ ආකාරය හ්‍ර‍ස්ව වී තිබේ. ඊට හේතු මෙසේයි:- කම්මධාර සමාසයේදී ස්ත්‍රීලිංගික ශබ්දයක් විශේෂණ වී මුලින් සිටි විට (ඒ ශබ්දය පුල්ලිඟුවෙහි ද වැටෙන ශබ්දයක් වී නම්) එය පුල්ලිඞ්ගික ශබ්දයට සමාන වේ.**"],["p","ඛත්තියා - ශබ්දය පුල්ලිඞ්ගයෙහි ඛත්තිය කියා සිටී. එබැවින් මෙහි ඛත්තියකඤ්ඤා යයි සමාසය සිද්‍ධ විය. අන්‍ය වූ ආකාරන්ත-ඊකාරාන්ත ස්ත්‍රී ලිංගික ශබ්දයන්ට ද (පුල්ලිඟුවෙහිත් වැටෙන ශබ්ද වී නම්) මෙසේ පුල්ලිඞ්ගික භාවය පැමිණෙන බව සැලකිය යුතු."],["p","**උදාහරණ :-**"],["p","රත්තා + ලතා = රත්තලතා (= රතු වැල). ඉ."],["p","බ්‍රාහ්මණී + දාරිකා = බ්‍රාහ්මණදාරිකා (බැමිණි දැරිය). ඉ."],["p","ඛත්තියා + කුමාරී = ඛත්තියකුමාරී (රාජකුමරිය). ඉ."],["p","නාගී + මාණවිකා = නාගමානවිකා (නාමෙනෙවිය). ඉ."],["p","තරුණී + බ්‍රාහ්මණී = තරුණබ්‍රාහ්මණී (= තරුණ බැමිණිය). ඉ."],["p","දුතියා + භික්ඛා = දුතියභික්ඛා (= දෙවෙනි භික්‍ෂාව). ඉ."],["p","**සංලක්‍ෂ්‍යය :-**"],["p","පූර්‍ව පදය සංඥා නාමයක් වූ විට පුල්ලිඞ්ගභාගය නොවේ. “නන්‍දාපොක්ඛරණී” “නන්‍දාදෙවී” යනු උදාහරණයි."],["p","33. උපමාවක් වූ විශේෂණ පදය සමාස පදයේ අගින් සිටී. සීහො විය සීහො (= සිංහයා වැනිනුයි ‘සීහ නම් වේ.) මුනි ච සො සීහො චාති මුනිසීහො (= මුනි වූයේත් හෙතෙමේය. සිංහ වූයේත් හෙතෙමේනුයි මුනිසීහ නම් වේ.) යන තන්හි සීහ යන විශේෂණය උපමාවකි. තාපසයෙක් හෝ භික්‍ෂු නමක් සිංහයකු විය හැකි නොවේ. එහෙයින් ‘මුනිසීහ’ යන්නේ අර්‍ථය ‘සිංහයාට සමාන වූ මුනිතෙම’ යයි දත යුතු. මෙසේ විශේෂණ පදය උපමාවක් වූ විට එය අගින් යෙදිය යුතුයි. තවත් උදාහරණ :-"],["p","නාගො විය බුද්‍ධො = බුද්‍ධනාගො (= බුද්‍ධනාගතෙම, ශ්‍රෙෂ්ඨ වූ සර්‍වඥයන් වහන්සේයි.) මෙහි ‘නාග’ නම් හස්තියායි. මේ සීහ, නාග, උසභ, ආදී ශබ්ද ශ්‍රෙෂ්ඨාර්‍ථයෙහි යයි දතයුතු."],["p","ආදිච්චො විය බුද්‍ධො = බුද්‍ධාදිච්චො = (බුද්‍ධ නමැති සූර්‍ය්‍යතෙම). පු."],["p","චන්‍දො විය මුඛං = මුඛචන්‍දො = චන්‍ද්‍ර‍ා වැනි මුහුණ හෝ මුහුණ නමැති චන්‍ද්‍ර‍යා). පු."],["p","පදුමං විය මුඛං = මුඛපදුමං (= මුවපියුම, පියුම වැනි මුහුණ). න."],["p","පුණ්ඩරීකං විය සමණො = සමණපුණ්ඩරීකො (= හෙළ පියුමකට බඳු ශ්‍ර‍මණතෙම). පු."],["p","34. මේ සමාසයේදී න නිපාතය මුලින් සිටි විට එයට ව්‍යඤ්ජ ා = චතුද්දිසං (= සිව්දිග: දිශාහතර). න."],["p","පඤ්ච + සීලානි = පඤ්චසීලං (= පන්සිල්). න."],["p","සත්ත + අහානි = සත්තාහං (= සතියක්: සත්දිනක්). න."],["p","සතං + යොජනානි = සතයොජනං (= සියක් යොදුනක්). න."],["p","“එකපුග්ගලො, චතුද්දිසා, තිභවා” යනාදිය දිගුසමාස වුවත් නපුංසක ඒකවචන බවට නො පැමිණේ."]]},{"p":["“උත්තමඞ්ගරුහා මය්හං ඉමෙ ජාතා වයොහරා, පාතුභූතා දෙවදූතා, පබ්බජ්ජාසමයො මම.” (මඛාදෙව ජාතකය.)","“මහාසත්තො පන ආගච්ඡන්තො කහාපණසහස්සෙන සද්ධිං එකං සාටකං තාම්බූලපසිබ්බකෙ ඨපෙත්‍වා ආගතො.” (මහොසධ ජාතක)","පණ්ඩිතො උප්පාදිතධනං ච ආහටධනං ච සබ්බං තස්සා මාතාපිතුන්නං දත්‍වා තෙ සමස්සාසෙත්‍වා තමාදාය නගරමෙව අගමාසි.","“ජරසක්කො අම්හෙ මත්තෙ කත්‍වා මහාසමුද්දපිට්ඨෙ ඛිපිත්‍වා අම්හාකං දෙවනගරං ගණ්හි. මයං තෙන සද්ධිං යුජ්ඣිත්‍වා අම්හාකං දෙවනගරමෙව ගණ්හිස්සාම.” (කුලාවක ජාතක)","තස්ස ගමනමග්ගෙ සිම්බලිවනං තාලවනං විය ඡිජ්ජිත්‍වා සමුද්දපිට්ඨෙ පතති. සුපණ්ණපොතකා සමුද්දපිට්ඨෙ පරිවත්තන්තා මහාරවං රවිංසු” (ජාතක නිදාන)","“මහාමයාදෙවී ....................ගන්‍ධොදකෙන නහායිත්‍වා චත්තාරි සතසහස්සානි විස්සජ්ජෙත්‍වා මහාදානං දත්‍වා...... අලංකතපටියත්තං සිරිගබ්භං පවිසිත්‍වා සිරිසයනෙ නිපන්නා....... ඉමං සුපිනං අද්දස” (ජාතක නිදාන.)","“රාජා........කපිලවත්‍ථුතො යාව දෙවදහනගරමග්ගං සමං කාරාපෙත්‍වා....... දෙවිං සොවණ්ණසිවිකාය නිසීදාපෙත්‍වා මහන්තෙන පරිවාරෙන පෙසෙසි.” (එම)","“ද්වින්නං පන නගරානං අන්තරෙ උභයනගරවාසීනම්පි ලුම්බිනීවනං නාම මඞ්ගලසාලවනං අත්‍ථි.” (එම)","සකලං ලුම්බිනීවනං චිත්තලතාවනසදිසං මහානුභාවස්ස රඤ්ඤො සුසජ්ජිත - ආපානමණ්ඩලං විය අහොසි.”","බොධිසත්තො පන ධම්මාසනතො ඔතරන්තො ධම්මකථිකො විය..... ද්වෙ හත්‍ථෙ ද්වෙ පාදෙ ච පසාරෙත්‍වා කාසිකවත්‍ථෙ නික්ඛිත්ත - මණිරතනං විය ජොතන්තො මාතුකුච්ඡිතො නික්ඛමි.” (එම)","“අථෙකදිවසං බොධිසත්තො උය්‍යානභූමිං ගන්තුකාමො සාරථිං අමන්තෙත්‍වා ‘රථං යොජෙහී’ති ආහ.","“සො’ ‘සාධූ’ති පටිසුණිත්‍වා මහාරහං උත්තමරථං සබ්බා ලංකාරෙන අලඞ්කරිත්‍වා........ චත්තාරො මඞ්ගලසින්‍ධවෙ යොජෙත්‍වා බොධිසත්තස්ස පටිවෙදෙසි.” (එම)"],"s":["සුමේධ පණ්ඩිත තෙමේ අමෘතදායක වූ දීපඞ්කර මහ මුනිහු ඉදිරියෙහි බුදුබව සඳහා ප්‍රාර්‍ථනා කළේ ය.","බුදුන් සරණ ගිය දෙව් - මිනිස් - අසුර - නාගයෝ ප්‍ර‍මාණාතික්‍රාන්ත සැපයට පැමිණියහ.","සර්‍වාලඞ්කාරයෙන් සැරසුණු මහරජතුමා සැරසූ මඟුලැතු පිට නැගී දෙව්පුරයක් මෙන් අලඞ්කෘත වූ නගරයෙහි හැසුරුණේ ය.","කූපමණ්ඩුකයා තමා වසන ළිඳ මහා සාගරය මෙන් සලකයි. එමෙන් අල්පශ්‍රැතයා ද තෙමේ මහා පණ්ඩිතයෙකැයි සිතයි.","ධර්‍මාශෝක පුත්‍ර‍ වූ මිහිඳු කුමාර තෙමේ මොග්ගලිපුත්තතිස්ස මහාස්ථවිරයන් වහන්සේ වෙත පැවිදිව පිටකත්‍ර‍ය ඉගෙන ගත්තේ ය.","ගමට ගිය පුරුෂයා ධාන්‍ය රාශියක් ගෙනවුත් නුවරවැසි වෙළඳුන් දශ දෙනකුන්ට වික්කේ ය.","ගින්නෙන් දෑ වනයෙහි සිංහ - ව්‍යාඝ්‍ර‍- කොටි ද, ඌරු - මුව පක්‍ෂීහු ද නොවසත්.","බැමිවලින් මිදුණු ගව මහිෂයෝ ද එළු බැටළුවෝ ද වෘක්‍ෂපත්‍ර‍ - තණ ආදිය කමින් ක්‍රීඩා කරමින් ඇවිද්දාහ.","බුදුන් දෙසූ නිවන් දෙන දහම් ඇසූ ස්ත්‍රී පුරුෂයෝ සිවුරුපිළි ගෙනවුත් භික්‍ෂු-භික්‍ෂුණී - සාමණෙර - සාමණෙරින්ට දුන්හ.","ලක්දිව ගම්-නියම්ගම් - නුවරවල - තල් - පොල් - කිතුල් - අඹ - කොස් - දෙල් ගස් ඇත්තාහ.","ගසෙන් වැටුණු වඳුරා ගම්වැසි බල්ලන් විසින් අල්වන ලදි.","චන්ද්‍ර‍- සූර්‍ය්‍ය- තාරකාවෝ අහසෙහි හැසිරෙමින් මුළුලොව අලඞ්කාර කරත්.","සර්පයන් විසින් ඩසින ලද බාල - මහලු - දුගී - ධනවත් සියල්ලෝ මහත් දුකට පැමිණෙත්.","ක්‍ෂත්‍රිය - බ්‍රාහ්මණ - වෛශ්‍ය - ශුද්‍රයෝ බුද්ධශාසනයෙහි පැවිදිව මහ මුහුදට පැමිණි නොයෙක් ගංගාවන්ගේ ජලය මෙන් සමාන බවට පැමිණෙත්."],"gp":[["ආගච්ඡන්ත","එන. 3."],["ආපානමණ්ඩල","මත්පැන් බීමේ උත්සවයට සැදූ මණ්ඩපය. න."],["ආමන්තෙත්‍වා","කථාකොට. පූ.ක්‍රි"],["උත්තමඞ්ගරුහ","හිසකෙස්. පු."],["උප්පාදිත","ඉපදවූ, සැපයූ. 3."],["උය්‍යානභූමි","උයන්බිම. ඉ."],["ඔතරන්ත","බසින. 3."],["කහාපණ","කහවණුව (කාසිය).පු."],["කාසිකවත්‍ථ","කසීරට වස්ත්‍ර‍. න."],["ඛිපිත්‍වා","දමා, විසිකොට. පූ. ක්‍රි."],["ගන්‍ධොදක","සුවඳ කළ පැන්. න."],["ගමනමග්ග","යනමාර්‍ගය. පු."],["චිත්තලතාවන","දෙව්ලොව උයනක නමක්. න."],["ජරසක්ක","මහලු ශක්‍ර‍යා. පු."],["ජාත","උපන්. 3."],["ජොතන්ත","බබළන. න."],["තාම්බූල","බුලත්. න."],["තාලවන","තල්වනය. න."],["දෙවදූත","දෙවියන්ගේ දූතයා. පු."],["ධම්මාසන","ධර්‍මාසනය. න."],["ධම්මකථික","බණ කියන්නා. පු."],["නගරවාසී","නුවර වැසියා. පු."],["නික්ඛිත්ත","තැබූ; දැමූ. 3."],["නිපන්න","හොත්. 3."],["පටියත්ත","පිළියෙළ කළ. 3."],["සුසජ්ජිත","මනාසේ සැරසූ."],["පටිවෙදෙති","දැනුම් දෙයි."],["පබ්බජ්ජාසමය","පැවිදිවීමට කාලය.පු."],["පරිවන්තත්ත","පෙරළෙමින්. 3."],["පසාරෙත්‍වා","දිගුකොට. පූ.ක්‍රි."],["පසිබ්බක","පසු සරණ ගියේ). පු."],["p","ගාමං + ගතො = ගාමගතො (= ගමට ගියේ). පු."],["p","සුඛං + පත්තො = සුඛප්පත්තො (= සැපයට පැමිණියේ). පු."],["p","රථං + ආරූළ්හො = රථාරූළ්හො (= රථයට නැංගේ). පු."],["p","සොතං + ආපන්නො = සොතාපන්නො (= සෝවාන් වූයේ). පු."],["p","(නිවන කරා පැමිණෙන හෙයට පැමිණියේ යන අර්ථයි."],["p","පමාණං + අතික්කන්තො = පමාණාතික්කන්තො. (= ප්‍ර‍මාණය ඉකුත් කළේ). පු."],["p","**2. තතියාතප්පුරිසය**"],["p","බුද්ධෙන + දෙසිතො = බුද්‍ධදෙසිතො (= සර්වඥයන් වහන්සේ විසින් දෙසන ලද්ද ධර්මයයි). පු."],["p","අග්ගිනා + දඩ්ඪො = අග්ගිදඩ්ඪො (= ගින්නෙන් දවන ලද්දේ). පු."],["p","සප්පෙන + දට්ඨො = සප්පදට්ඨො (= සර්‍පයා විසින් ඩසින ලද්දේ). පු."],["p","රඤ්ඤා + හතො = රාජහතො (= රජු විසින් නසන ලද්දේ). පු."],["p","**කරණාර්‍ථයෙහි තතියා තප්පුරිසය :**"],["p","අසිනා + කලහො = අසිකලහො (= කඩුවෙන් කරන කලහය). පු."],["p","වාචාය + නිපුණො = වාචානිපුණො (= වචනයෙන් දක්‍ෂ වූයේ). පු."],["p","**3. චතුත්‍ථිතප්පුරිසය**"],["p","චීවරස්ස+දුස්සං = චීවරදුස්සං (= සිවුරට වස්ත්‍ර‍ය හෝ සිවුරුපිළි). න."],["p","යාගුයා + තණ්ඩුලා = යාගුතණ්ඩුලා (= කැඳට සහල්). පු."],["p","සංඝස්ස + භත්තං = සංඝභත්තං (= සංඝයාට බත්, සඟබත්). න."],["p","බුද්ධස්ස + දෙය්‍යං = බුද්‍ධදෙය්‍යං (= බුදුන්ට දිය යුතු දේ). න."],["p","පාසාදාය + දබ්බං = පාසාදදබ්බං (= ප්‍රාසාදයට දැව). න."],["p","**4. පඤ්චමීතප්පුරිසය**"],["p","රුක්ඛා + පතිතො = රුක්ඛපතිතො (= ගසෙන් වැටුණේ). පු."],["p","රාජතො + භයං = රාජභයං (= රජුගෙන් වූ භය. රාජභය). න."],["p","බන්‍ධනා + මුත්තො = බන්‍ධනමුත්තො (= බැම්මෙන් මිදුණේ). පු."],["p","අග්ගිතො + භයං = අග්ගිභයං (= ගිනිභය). න."],["p","පාපතො + භීතො = පාපභීතො (= පවෙන් භයවූයේ). පු."],["p","දුච්චරිතො + විරති = දුච්චරිතවිරති (දුෂ්චරිතයෙන් වෙන්වීම). ඉ."],["p","**5. ඡට්ඨිතප්පුරිසය**"],["p","ජිනස්ස + වචනං = ජිනවචනං (= බුද්‍ධවචනය). න."],["p","රඤ්ඤො + පුත්තො = රාජපුත්තො (= රජුගේ පුත්‍ර‍යා, රාජපුත්‍ර‍යා)."],["p","ධඤ්ඤානං + රාසි = ධඤ්ඤාරාසි (= ධාන්‍යරාශිය). පු."],["p","හත්‍ථිනො + පදං = හත්‍ථිපදං (= හස්තිපාදය). න."],["p","පුප්ඵස්ස + ගන්‍ධො = පුප්ඵගන්‍ධො (= මලේ සුවඳ). පු."],["p","බුද්‍ධස්ස + සාවකො = බුද්ධසාවකො (= බුද්ධශ්‍රාවකතෙම). පු."],["p","**6. සත්තමීතප්පුරිසය**"],["p","අරඤ්ඤෙ + වාසො = අරඤ්ඤවාසො (= වනයෙහි විසීම, වනවාසය) පු."],["p","ගාමෙ + සූකරො = ගාමසූකරො (ගම්ඌරා). පු."],["p","කූපෙ + මණ්ඩුකො = කූපමණ්ඩුකො (= ළිඳේ මැඩියා). පු."],["p","වනෙ + පුප්ඵං = වනපුප්ඵං (= වනයෙහි මල්, වල් මල්). න."],["p","සමුද්දෙ + කච්ඡපො = සමුද්දකච්ඡපො (= මූදුකැස්බෑවා). පු."],["p","ධම්මෙ + රතො = ධම්මරතො (= ධර්‍මයෙහි ඇලුණේ). පු."],["p","අන්තෙ + වාසිකො = අන්තෙවාසිකො (= අතවැසියා). පු."],["p","මනසි + කාරො = මනසිකාරො (= මෙනෙහි කිරීම, මනස්කාරය). පු."],["p","පඞ්කෙ + රුහං = පඞ්කෙරුහං (= නෙළුම්මල). න."],["p","පුබ්බෙ + නිවාසො = පුබ්බෙනිවාසො (= පෙර විසීම, පූර්‍වෙනිවාසය). පු."],["p","මේ ආදිය තප්පුරිස සමාසය වුවත් මුල් පදවල විභක්ති ලොප් නොවී එසේ ම සිටිත්. ඇතැම් සමාස පදයන්ගේ විභක්ති ලොප් නොවන බව මුලදී දක්වන ලදි."],["p","මේ තප්පුරිස සමාසයෙහි වූ බොහෝ පද තුන්ලිඟුවෙහි වැටෙති. “සරණගතො පුරිසො, සරණගතා ඉත්‍ථි, සරණගතං කුලං” ආදි වශයෙන් තුන් ලිඟුවෙහි සියලු විභක්තිවල වරනැගිය යුතු."],["h","4. ද්වන්‍ද සමාසය"],["p","**39. කම්මධාරය සමාසයෙහි මෙන් විශේෂණ විශේෂ්‍ය භාවයක් නැත්තා වූ ද තප්පුරිසයෙහි මෙන් ද්විතීයාදි පූර්‍වපද නැත්තා වූ ද වෙන් වෙන් අර්ථයන් ප්‍ර‍කාශ කරන ශබ්දයන් සමාස කිරීම ද්වන්‍ද සමාස නම් වේ. **"],["p","“දෙවා ච මනුස්සා ච = දෙවමනුස්සා” යනාදි වශයෙන් ච - ශබ්දයෙන් සම්බන්‍ධකරන ශබ්දයන් ද්වන්‍ද සමාසයට පැමිණෙන බව සැලකිය යුතු. ච - ශබ්දය සිංහලයෙහි ද - ශබ්දයට සමාන වේ. එහෙයින් සිංහල ව්‍යාකරණයෙහි මේ සමාසය ‘ද - අරුත් සමස්’ යි නම් කරන ලදි."],["p","ච - ශබ්දයෙන් සම්බන්‍ධවෙන ශබ්ද දෙකක් හෝ ඊට වැඩි ගණනක්"],["p","හෝ ද්වන්‍ද සමාසයේ දී එක් පදයක් කොට ගැළපිය හැක. පද දෙකකට වැඩි ගණනක් සමාස කිරීමේ බලය අන්‍ය සමාසයන්ට ඇති බවක් නො පෙනේ."],["p","**40. ද්වන්‍ද සමාසය සමාහාර ද්වන්දය, ඉතරෙතරද්වන්‍ද යයි දෙකොටසකට බෙදනු ලැබේ. සමාහාර ද්වන්‍දයේදී සමාස පදය නපුංසක ඒක වදනයෙන් සිටී. (පද දසයක් සමාස කළත් ඒක වචන බවට පැමිණේ යයි දත යුතු) ඉතරෙතරද්වන්‍දයේදී ඒ සමාස වූ පදවලට අයත් ලිඟුවල බහුවචන වී සිටිත්.**"],["p","**41. කම්මධාරයෙහි ‘සෙතහත්‍ථි’ යන පදයෙන් ‘හත්‍ථි’ යන පසු පදය ප්‍ර‍ධාන වේ. ‘සෙත = සුදු’ යන්න ප්‍ර‍ධාන විය නොහේ. තප්පුරිසයෙහි ‘ගාමගතො’ යන පදයෙහි ‘ගතො = ගියේ’ යන්න ප්‍ර‍ධාන වේ. මෙසේ ඒ සමාස දෙක්හි පසු පදය ප්‍ර‍ධාන ‘වෙන නමුත් ද්වන්‍දයෙහි එක් පදයක් ප්‍ර‍ධාන නොවන බව සැලකිය යුතු. එසේ පද දෙක සමාන බල ඇති කල්හි මුලින් යෙදිය යුතු කිනම් පදයක් දැයි නිශ්චය කොට ගැන්ම අපහසු වන බැවින් අඩු අකුරු ඇති පදය මුලින් යෙදිය යුතු ය. තත්‍වයෙන් උසස් පදය මුලින් යෙදිය යුතුය. ආදී නියමයෝ පූර්‍වාචාර්‍ය්‍යයන් විසින් දක්වන ලදහ. **"],["p","**A සමාහාරද්වන්දය**"],["p","**නාමඤ්ච රූපඤ්ච = නාමරූපං (= නාමය ද රූපය ද ‘නාමරූප’ නමි). න.**"],["p","**චක්ඛුඤ්ච සොතඤ්ච = චක්ඛුසොතං (= ඇස හා කන). න.**"],["p","**ගීතඤ්ච වාදිතඤ්ච = ගීතවාදිතං (= ගීකීම් හා වැයීම්). න.**"],["p","**ඡවි ච මංසඤ්ච ලොහිතඤ්ච = ඡවිමංසලොහිතං**"],["p","**හත්‍ථිනො ච අස්සා ච රථා ච පත්තිකා ච = හත්‍ථස්සරථ**"],["p","**පත්තිකං (= ඇත් = අස් - රිය - පාබලසෙනග). න.**"],["p","**හත්‍ථි ච ගාවො ච අස්සා ච වළවා ච = හත්‍ථිගවාස්සවළවං (= ඇත් - ගව - අස් - වෙළඹ). න.**"],["p","B. ඉතරෙතරද්වන්දය"],["p","**චන්‍දො ච සුරියො ච = චන්‍දසුරියා (= චන්‍ද්‍ර‍ සූර්‍ය්‍යයෝ). පු.**"],["p","**සාරිපුත්තො ච මොග්ගල්ලානො ච = සාරිපුත්තමොග්ගල්ලානා**"],["p","**(= සැරියුත් - මුගලන් මහතෙරහු). පු.**"],["p","**සමණා ච බ්‍රාහ්මණා ච = සමණබ්‍රාහ්මණා (= මහණ බමුණෝ). පු.**"],["p","**දෙවා ච මනුස්සා ච = දෙවමනුස්සා (= දෙව්මිනිස්සු). පු.**"],["p","**මාතා ච පිතා ච = මාතාපිතරො (= මවුපියවරු). පු.**"],["p","**සුරා ච අසුරා ච නරා ච උරගා ච නාගා ච යක්ඛා ච = සුරා’සුරනරොරගනාගයක්ඛා (= දෙවි - අසුර - මනුෂ්‍ය - උරග - නාග - යක්‍ෂයෝ). පු.**"]]},{"p":["තස්මිං සමයෙ සත්‍ථා අනුපුබ්බෙනාගන්ත්‍වා අනාථපිණ්ඩිකෙන මහාසෙට්ඨිනා කාරිතෙ ජෙතවනමහාවිහාරෙ විහරති මහාජනං සග්ගමග්ගෙ ච මොක්ඛමග්ගෙ ච පතිට්ඨාපයමානො. (ධම්මපදට්ඨ කථා.)","“තදා සාවත්‍ථියං සත්තමනුස්සකොටියො වසන්ති, තෙසු අරියසාවකානං ද්වෙ යෙව කිච්චානි අහෙසුං පුරෙභත්තං දානං දෙන්ති, පච්ඡාභත්තං ගන්‍ධමාලාදිහත්‍ථා වත්‍ථභෙසජ්ජපානකාදිං ගාහාපෙත්‍වා ධම්මසවණත්‍ථාය ගච්ඡන්ති.” (එම)","සුරනරමහිතො සත්‍ථා සහස්සභික්ඛුපරිවාරො ආකිණ්ණ මනුස්සං රාජගහං පාවිසි.","ආරූළ්හවාණිජා මහානාවා නිරුපද්ද වෙන මහාසමුද්දං තරිත්‍වා සත්තාහෙන ලඞ්කාදීපං සම්පාපුණී. 4. සපිරිවාරො රාජා අන්‍වද්ධමාසමන්තොපුරා නික්ඛමිත්‍වා නානා තරුසණ්ඩමණ්ඩිතං දිජගණකූජිතං උය්‍යානං ගච්ඡති.","“සීලගන්‍ධසමො ගන්‍ධො කුතො නාම භවිස්සති, යො සමං අනුවාතෙ ච පටිවාතෙ ච වායති?” (විසුද්ධිමග්ග.)","බහවො බ්‍රාහ්මණ ."]],"gs":[["චීනරට","චීනරට්ඨ. න."],["දෙව්ලොව","දෙවලොව. පු."],["මල් සුවඳ","පුප්ඵගන්‍ධ. පු."],["සෝවාන්","සොතාපන්න. 3."]],"lt":"බහුබ්බීහි සමාසය","l":[["h","5. බහුබ්බීහි සමාසය"],["p","**42. සමාස වූ පසු ඒ පදයන්ගේ අර්ථයන් හැර අන්‍යාර්ථයක් ප්‍ර‍කාශ කරන්නා වූ සමාසය බහුබ්බීහි නම් වේ. **"],["p","“ඡින්නහත්‍ථ” යන තැන ‘ඡින්න’ ය ‘හත්‍ථ’ යයි පද දෙකකි. ‘කැපූ, අත’ යන අර්ථ දෙකක් ඒ දෙපදයෙන් කියවේ. නමුත් බහුබ්බීහි විධියෙන් සමාස වූ මේ දෙපදයෙන් ඒ පදයන්ට අයත් එක් අර්ථයක් වත් ප්‍ර‍මුඛ වශයෙන් ප්‍ර‍කාශ කරනු නොලැබේ. කැපූ අත් ඇති මිනිසෙක් මෙයින් කියවේ. එබැවින් බහුබ්බීහියෙහි සමාස වීමට පැමිණෙන එක් පදයක් වත් ප්‍ර‍ධානත්‍වය නොපවත්වන්නේ යයි ද අන්‍යාර්ථයක් ප්‍ර‍ධාන වන්නේ යයි ද දත යුතු."],["p","ආගතා සමණා යං, සො - ආගතසමණො (විහාරො)"],["p","(= ආවා වූ ශ්‍ර‍මණයෝ යම් තැනකට ද, ඒ තැන ආගතසමණ නම් වේ; විහාරයයි.)"],["p","ආරූළ්හා වාණිජා යං, සා = ආරූළ්හවාණිජා. (නාවා)"],["p","(=නැංගාවූ වෙළෙන්දෝ යමකට ද, එය ආරූළ්හවාණිජා නම් වේ. නැවයි)."],["p","ආරූළ්හො වානරො යං, සො = ආරූළ්හවානරො, (රුක්ඛො) (= වඳුරා යමකට නැංගේ ද, එය ආරූළ්හවානර නම් වේ; ගසයි.)"],["p","මේ පද තුන ම කර්‍මාර්‍ථයෙහි සිද්ධ වේ. ඒමට කර්‍මය වූ විහාරය ද නැඟීමට කර්‍ම වූ නැව හා ගස ද මේ පදවලින් ප්‍ර‍කාශ කරනු ලබන බැවින් කර්‍මාර්‍ථයෙහි වෙතියි දත යුතු. නැංගා වූ - වෙළෙන්දෝ, වඳුරා යන අර්ථවලින් එකක් වත් සමාස වූ පසු ප්‍ර‍ධාන නොවී අන්‍යාර්ථයක් ප්‍ර‍කාශ වෙන ආකාරය සැලකිය යුතු."],["p","විජිතා මාරා යෙන, සො = විජිතමාරො. (භගවා)"],["p","(=මාරයෝ යමකු විසින් පරදවන ලදහු ද, හෙතෙම විජිත මාර නම් වේ. භාග්‍යවතුන් වහන්සේයි.)"],["p","දිට්ඨො ධම්මො යෙන, සො = දිට්ඨධම්මො (අරියසාවකො)"],["p","(= ධර්‍මය යමකු විසින් දක්නා ලද්දේ ද හෙතෙම දිට්ඨම්ම නම් වේ ආර්‍ය්‍යශ්‍රාවකයායි.)"],["p","(= දිනන ලද ඉඳුරෝ යමකු විසින් ද, හෙතෙම ජිතින්‍ද්‍රිය නම් වේ. ශ්‍ර‍මණයායි.)"],["p","මේ පද තතියා විභක්ති අර්ථයෙහි වෙති."],["p","දින්නො සුඞ්කො යස්ස, සො = දින්නසුඞ්කො (රාජා)"],["p","(= දෙන ලද සුංගම් හෝ අයබදු යමකු ද, හෙතෙම දින්න සුඞ්ක නම් වේ. (රජ තෙමේයි.)"],["p","උපනීතං භොජනං යස්ස, සො = උපනීතභොජනො"],["p","(= ගෙනෙන ලද ආහාරය යමකුට ද, හෙතෙම උපනීතභොජන නම් වේ.)"],["p","මොවුහු චතුර්ථි අර්ථයෙහි වෙති."],["p","අපෙතං විඤ්ඤාණං යස්මා, සො = අපෙතවිඤ්ඤාණො. (මතකායො.)"],["p","(= පහ වූ විඥානය යමක් කෙරෙන් ද, එය අපෙතවිඤ්ඤාණ නම් වේ. මෘතශරීරයයි.)"],["p","නිග්ගතා ජනා යස්මා සො = නිග්ගතජනො. (ගාමො)"],["p","(= මනුෂ්‍යයෝ යමකින් නික්මුණාහු ද, එය නිග්ගතජන නම් වේ. ගමයි.)"],["p","නිග්ගතො අයො යස්මා සො = නිරයො, (=සැපය නික්ම ගියේ යමක් කෙරෙන් ද, එය නිරය නම් වේ. නරකයයි.) මොවුහු පඤ්චමී අර්ථයෙහි වෙති."],["p","ඡින්නා පාදා යස්ස, සො = ඡින්නපාදො. (පුරිසො)"],["p","(= යමකුගේ පාදයෝ සිඳින ලදහු ද හෙතෙම ඡින්නපාද නම් වේ. දඬුවම් ලැබූ පුරුෂයෙකි.)"],["p","ඛීණා ආසවා යස්ස, සො = ඛීණාසවො. (අරහා)"],["p","(= ක්‍ෂීණ වූ ආශ්‍ර‍වයෝ යමකුගේ ද, හෙතෙම ඛීණාසව නම් වේ. රහතන් වහන්සේයි.)"],["p","දුට්ඨං සීලං යස්ස, සො = දුස්සීලො (දුස්සීල පුග්ගලො)"],["p","(= දූෂිත වූ සිල් යමකුගේ ද, හෙතෙම දුස්සීල නම් වේ. සිල් නැති පුද්ගලයෙකි.)"],["p","සුන්‍දරො ගන්‍ධො යස්ස, තං = සුගන්‍ධං, (චන්‍දනාදි)"],["p","(= යහපත් වූ ගන්‍ධය යමකගේ ද, එය සුගන්‍ධ නම් වේ. සඳුන් ආදි දෙයකි.)"],["p","මොවුහු ඡට්ඨි අර්ථයෙහි වෙති."],["p","ආකිණ්ණා මනුස්සා යස්සා, සා = ආකිණ්ණමනුස්සා (රාජධානි)"],["p","(= ගැවසීගත් මනුෂ්‍යයෝ යම් තැනක ද, එය ආකිණ්ණ මනුස්ස නම් වේ. රාජධානියයි.)"],["p","බහවො තාපසා යස්මිං, සො = බහුතාපසො. (අස්සමො)"],["p","(= බොහෝ තාපසයෝ යම් තැනක ද, එය බහුතාපය නම් වේ. ආශ්‍ර‍මයයි.)"],["p","සම්පන්නානි සස්සානි යස්මිං, සො = සම්පන්නසස්සො (ජනපදො)"],["p","(= සමෘද්ධ වූ සස්‍යයෝ යම් තැනක ද, එය සම්පන්නසස්ස නම් වේ. ජනපදයයි.)"],["p","**මොවුහු සත්තමී අර්ථයෙහි වෙති.**"],["p","**43. මේ සමාසයේදී ඇතැම් තැනක මුලින් සිටින සහ ශබ්දයට සකාරාදේශ වේ. සමාසපදයාගේ අන්තයෙහි කකාරයක් ආගම වේ. සහ හෙතුනා යො වත්තතෙ, සො = සහෙතුකො, සහෙතු.**"],["p","(= හේතුව සමග යමක් පවත්නේ ද, එය සහේතුක හෝ සහේතු නම් වේ. හේතු සහිත සිත් ආදියයි.)"],["p","සහ පරිවාරෙන යො වත්තතෙ, සො = සපරිවාරො (= පිරිවර සමග යමෙක් පවත්නේ ද, හෙතෙම සපරිවාර නම් වේ. පිරිවර ඇති රජදරු ආදීහුයි.)"],["p","මොවුහු ප්‍ර‍ථමාර්ථයෙහි වෙති."],["h","6. අව්‍යයීභාව සමාසය"],["p","**44. අව්‍යයන් හෙවත් උපසර්ග - නිපාතපදයන් මුලින් සිට පරවූ පදයන් හා සමාසවෙන විට අව්‍යයීභාව සමාස නම් වේ. මේ සමාසයෙහි පූර්‍ව වූ උපසර්‍ග නිපාතයන්ගේ අර්ථය ප්‍ර‍ධාන වේ. අව්‍යයීභාව සමාස පදයෝ නපුංසක ලිංගයෙහි වෙති. අකාරාන්ත වූ අව්‍යයීභාව සමාසය ශබ්දයන් කෙරෙන් පර වූ හැම විභක්තීන්ට ම ඇතැම් විට අං ආදේශ වේ; ඉකාරාන්තාදී ශබ්දයන් කෙරෙන් සියලු විභක්තීන්ට ලොප් වේ.**"],["p","නගරස්ස + උප = උපනගරං (= නගරයාගේ සමීපය හෙවත් උපනගරය.)"],["p","දරථානං + නි = නිද්දරථං (= දාහයන් නැති බව). න."],["p","රථස්ස + අනු = අනුරථං (= රථයට පසුව, රථය අනුව). න."],["p","අද්ධමාසං + අනු = අන්‍වද්ධමාසං (= අඩමසක් පාසා). න."],["p","පබ්බතස්ස + තිරො = තිරොපබ්බතං (= පර්වතයට එහා). න."],["p","නගරස්ස + අන්තො = අන්තොනගරං (= නුවර ඇතුළ). න."],["p","පාසාදස්ස + උපරි = උපරිපාසාදං (= ප්‍ර‍සාදයාගේ මස්තකය). න."],["p","මඤ්චස්ස = හෙට්ඨා = හෙට්ඨාමඤ්චං (= ඇඳයට). න."],["p","භත්තස්ස + පච්ඡා = පච්ඡාභත්තං (= පසුබත් කාලය, සවස් වරුව).න."],["p","ගඞ්ගාය + උප = උපගඞ්ගං (= ගඟට සමීප පෙදෙස). න."],["p","වුද්ධානං + (පටිපාටි) යථා = යථාවුද්ධං (=වෘද්ධ පිළිවෙළින්). න."],["p","කමො + යථා = යථාක්කමං (= පිළිවෙළින් හෙවත් ක්‍ර‍මය නොයික්මවා). න."],["p","ජීවස්ස + (පරිච්ඡෙදො) යාව = යාවජීවං (ජීවිතයාගේ පරිච්ඡේදය යම් පමණ ද එය යාවජීව නම් වේ. ‘ජීවිතාන්තය දක්වා’ යන අර්‍ථයි)."],["p","නගරතො + බහි = බහිනගරං (= නුවරින් පිට හෙවත් පිටිනුවර). න."],["p","සත්ති + යථා = යථාසත්ති (= ශක්ති පරිද්දෙන්, ශක්තිය නොයික්මවා). න."],["p","වාතස්ස + පටි = පටිවාතං (= විරුද්ධ වාතය, උඩුසුළඟ). න."],["p","අත්‍ථො + යාව = යාවදත්‍ථං (= ඕනෑ පමණ). න."],["p","කුඩ්ඩස්ස + තිරො = තිරොකුඩ්ඩං (= බිත්තියෙන් එහා). න."],["p","වාතස්ස + අනු = අනුවාතං (= අනුවාතය, යටිසුළඟ). න."],["p","භත්තස්ස + පුරෙ = පුරෙභත්තං (= පෙරබත, උදය කාලය). න."],["p","පුබ්බස්ස + අනු = අනුපුබ්බං (= පිළිවෙළ). න."],["p","වස්සස්ස + අන්තො = අන්තොවස්සං (= ඇතුළු වස, වර්ෂා කාලය තුළ). න."],["p","(මෙහි ‘යථාසත්ති’ යන්න ඉකාරාන්ත බැවින් විභක්තියට ආදේශ නොවී ලෝපය වූ බව සැලකිය යුතු."]]},{"p":["සාඛන්තරෙහි චෙව පුප්ඵන්තරෙහි ච පඤ්චවණ්ණභමරගණා නානාප්පකාරා ච සකුණසංඝා මධුරස්සරෙන විකූජන්තා විචරන්ති.” (ජාතකනිදාන).","“රාහුලමාතා සුමනමල්ලිකාදීනං පුප්ඵානං අම්මණමත්තෙන අභිප්පකිණ්ණසයනෙ පුත්තස්ස මත්‍ථකෙ හත්‍ථං ඨපෙත්‍වා නිද්දායති.” (එම)","“සො ‘සාධු දෙවා’ති අස්සභණ්ඩකං ගහෙත්‍වා අස්සසාලං ගන්ත්‍වා ගන්‍ධතෙලප්පදීපෙසු ජලන්තෙසු සුමනපට්ටවිතානස්ස හෙට්ඨා රමනීයෙ භූමිභාගෙ ඨිතං කන්‍ථකං අස්සරාජානං...... කප්පෙසි.” (එම)","“තතො පට්ඨාය මාලා - ගන්‍ධ - විලෙපන - කප්පූර - කටු කප්ඵලාදීනි ගහෙත්‍වා මහාජනස්ස සත්‍ථුධම්මදෙසනං සුත්‍වා නගරං පවිසනකාලෙ ජෙතවනාභිමුඛී ගච්ඡති” (සුන්‍දරීවත්‍ථු ධ.අ.)","භගවතො කිර භික්ඛුසඞ්ඝස්ස ච පඤ්චන්නං මහානදීනං මහොඝසදිසෙ ලාභසක්කාරෙ උප්පන්නෙ හතලාභසක්කාරා අඤ්ඤතිත්‍ථියා සුරියුග්ගමනකාලෙ ඛජ්ජොපනකසදිසා හුත්‍වා................. මන්තයිංසු.” (එම)","“අහං හි තෙන සද්ධිං එකගන්‍ධකුටියං වසාමීති වත්‍වා අඤ්ඤතරස්මිං තිත්‍ථියාරාමෙ වසිත්‍වා පාතොව ජෙතවනමග්ගං ඔතරිත්‍වා නගරාභිමුඛී ගච්ඡති.” (එම)","“රාජා යොජනන්තරෙ ජණ්ණුමත්තෙන ඔධිනා පඤ්චවණ්ණානි පුප්ඵානි ඔකිරාපෙත්‍වා ධජපතාකකදලිආදීනි උස්සාපෙත්‍වා.................පූජං කරොන්තො.............ගංගාතීරං පාපෙත්‍වා.............. වෙසාලිකානං සාසනං පහිණි.” (ගඞ්ගාරොහණ වත්‍ථු ධ.අ.)","“මහාජනො නගරමජ්ඣෙ සත්‍ථාගාරං සබ්බගන්‍ධෙහි උපලිම්පෙත්‍වා උපරි සුවණ්ණතාරකාදිවිචිත්තං විතානං බන්‍ධිත්‍වා බුද්‍ධාසනං පඤ්ඤාපෙත්‍වා සත්‍ථාරං ආරොචෙසි.” (එම)","“තෙ සුවණ්ණ-රජත-මණිමයා නාවායො මාපෙත්‍වා සුවණ්ණ-රජත-මණිමයෙ පල්ලඞ්කෙ පඤ්ඤාපෙත්‍වා පඤ්චවණ්ණ - පදුමසඤ්ඡන්නං උදකං කරිත්‍වා........ අත්තනො අත්තනො නාවාභිරූහනත්‍ථාය සත්‍ථාරං යාචිංසු.” (එම)","“අථාස්ස පරිවාරකපුරිසා නානාවණ්ණානි දුස්සානි නානාප්පකාරා ආභරණවිකතියො මාලාගන්‍ධවිලෙපනානි ච ආදාය සමන්තා පරිවාරෙත්‍වා අට්ඨංසු” (ජාතක නිදාන)"],"s":["බෝසත්තෙම අතට පත් සක්විතිරජ සැප කෙළ පිඬක් ‍නේ ඉවතලා සිය නුවරින් නික්ම ගියේ ය.","මහා බලැති හෙතෙමේ අටළොස්රියන් උසැති නගරප්‍රාකාරයට උඩින් පැන යන්ට සිතුවේ ය.","හෙතෙම සුදු වූ අධික ජවසම්පන්නවූ කන්ථක අසුපිට නැගී එක් රැයකින් තිස්යොදුන් මග ගෙවා අනෝමා ගංතෙරට පැමිණියේ ය.","කාශ්‍යප බුද්‍ධ කාලයේදී ජෝතිපාලමාණවක නමින් සිටි බෝසතුගේ මිත්‍ර‍යා වූ ඝටීකාර බමුණා බඹලොව ඉපද සිටියේ එතුමාට තුන් සිවුරු ගෙනවුත් දුන්නේ ය.","සත් දිනක් අනුපිය අඹ වනයෙහි විසූ එතුමා පයින් තිස්යොදුනක් ගොස් රජගහනුවරට ඇතුළු විය.","එහි හැසිරෙන ඒ පැවිද්දා දැක නගරවැසියෝ කලබලව තමන්ගේ රජුට ඒ පුවත දැන්වූහ.","මගධාධිපති බිම්බිසාර මහරජතුමා එතුමන් වෙත පැමිණ තමා හා රාජ්‍ය සම්පත් අනුභව කෙරේවායි ඉල්විය.","එතුමා නේරඤ්ජරා නදී තීරයෙහි රිදීතහඩුවක් වැනි වැලිතලාවක් ඇති උරුවේලා පෙදෙසෙහි සිත්කලු වනරොදක සය වසක් විසී ය.","පෙර කල අනුරාධපුරය ධ්වජ - පතාකවලින් ද නානාවර්‍ණ වස්ත්‍රයෙන් ද ්‍ධමාලා ආදි යෙසං, තෙ = ගන්‍ධමාලාදයො (සුවඳ මල් ආදිය වූයේ යම් ද්‍ර‍ව්‍යයන්ට ද ඒ ද්‍ර‍ව්‍යයෝ ‘ගන්‍ධමාලාදි නම් වෙති) යි බහුබ්බීහි සමාසය වේ. නැවත “ගන්‍ධමාලාදයො හත්‍ථෙසු යෙසං, තෙ = ගන්‍ධමාලාදිහත්‍ථා” (සුවඳ මල් ආදීහු යම් කෙනකුන්ගේ අත්වල තිබෙත් ද) ඔවුහු ‘ගන්‍ධමාලාදිහත්‍ථ’ නම් වෙති’යි බහුබ්බීහි සමාසය වේ."],["p","(5) ඒ වාක්‍යයෙහි ම සත්තමනුස්සකොටියො යන්නෙහි “මනුස්සානං කොටි = මනුස්සකොටි” යි ඡට්ඨිතප්පුරිස වේ. ඉන්පසු “සත්ත මනුස්සකොටියො = සත්තමනුස්සකොටියො” යි දිගු සමාසය වේ. මෙහි සමාස බලයෙන් සත්ත-ශබ්දය මුලට වැටුණ නමුත් ‘සත්කෙළක් මනුෂ්‍යයෝ’ යි කෝටි - ශබ්දය හා සම්බන්ධ කොට ම අර්‍ථ ගතයුතුයි. තවත් මෙවැනි පද ඇත්තාහ."],["p","(6) ඒ වාක්‍යයෙහි ම වත්‍ථභෙසජ්ජපානකාදිං යන්නෙහි ‘වත්‍ථානි ච භෙසජ්ජානි ච පානකානි ච = වත්‍ථභෙසජ්ජපානකානි’ යි ද්වන්‍දය වේ. ඉන්පසු ‘වත්‍ථභෙසජ්ජපානකානි ආදීනි යස්ස, සො = වත්‍ථභෙසජ්ජපානකාදි” යි බහුබ්බීහිය වේ. වස්ත්‍ර‍ බෙහෙත් - පානයන් ආදි කොට ඇති ද්‍ර‍ව්‍ය සමූහය කියවේ."],["p","(7) 9 වැනි අභ්‍යාසයේ 3 වැනි වාක්‍යයෙහි සුරනරමහිතො “යන්නෙහි සුරා ච නරා ච = සුරනරා” යි ද්වන්දය ද ඉන්පසු ‘සුරනරෙහි මහිතො = සුරනරමහිතො” යි තප්පුරිසය ද වේ."],["p","(8) ඒ වාක්‍යයෙහි ම සහස්සභික්ඛුපරිවාරො යන්නෙහි ‘සහස්සං භික්ඛු = සහස්සභික්ඛු’ යි දිගු සමාසය ද ඉන්පසු ‘සහස්ස භික්ඛු පරිවාරො යස්ස, සො = සහස්සභික්ඛුපරිවාරො’යි බහුබ්බීහිය ද වේ. දහසක් භික්ෂූන් පිරිවර ඇත්තා කියවේ."],["p","(9) 9 වැනි අභ්‍යාසයේ 5 වැනි වාක්‍යයෙහි ‘නානා තරු සණ්ඩමණ්ඩිතං යන්නෙහි ‘නානා ච තෙ තරවො චාති = නානාතරවො’ යි කම්මධාරය ද, නානාතරූනං සණ්ඩො = නානා තරුසණ්ඩො’ යි තප්පුරිසය ද, නැවත නානාතරූනං සණ්ඩෙහි මණ්ඩිතං = නානාතරුසණ්ඩමණ්ඩිතං’ යි තප්පුරිසය ද වෙති."],["p","**සංලක්‍ෂ්‍යය :**"],["p","මෙසේ නානා සමාසයන් මිශ්‍ර‍ වී සෑදී තිබෙන සමාස පදයන් ඇඳින ඒවා ඒ ඒ සමාසයනට ගැළපෙන සේ සාදාගත යුතුයි. එවැනි පදවලදී අවසානයෙහි කෙරෙන සමාසය ප්‍ර‍ධාන කොට සැලකිය යුතු, ඇතුළතෙහි ඇති සමාසයන් අවසාන සමාසයෙහි ගර්භවෙති. මෙහි (9) වැනි අඞ්කයෙහි දැක්වූ සමාස පදයට කම්මධාරය ගර්භකොට ඇති තප්පුරිස සමාසයයි කියනු ලැබේ."]]},{"p":["“අයං මාණවො මයි මනං පසාදෙත්‍වා කාලඞ්කත්‍වා තාවතිංසදෙවලොකෙ තිංසයොජනිකෙ කනකවිමානෙ නිබ්බත්තිස්සති” (මට්ටකුණ්ඩලී වත්‍ථු ධ. අ.)","සූකරිකා සාකුණිකා ජාලිකා ච සංඝිකං බලක්කාරෙන ගහෙත්‍වා ඛාදන්තා ච ඉතො චුතා ආපායිකා භවිස්සන්ති.","එකූනතිංසවස්සො බොධිසත්තො අත්තනො එකමෙව පුත්තං සබ්බසමපත්තිං ච පහාය ගන්ත්‍වා කාසාවනිවත්‍ථො මත්ති - කාපත්තමාදාය අඤ්ඤෙහි දින්නා’හාරෙන ජීවිකං කප්පෙසි.","භාණ්ඩාගාරිකො රඤ්ඤා ධනං ලභිත්‍වා මහන්තං පාසාදං කාරෙත්‍වා ද්වාරෙ දොවාරිකං ඨපෙත්‍වා උපරිපාසාදගතො කායික මානසිකං සුඛං වින්‍දති.","මහාකච්චායනත්‍ථෙරෙ කුරරඝරනගරං උපනිස්සාය විහරන්තෙ සොණො නාම සෙට්ඨිපුත්තො තස්ස සන්තිකෙ පබ්බජිත්‍වා “සොණො කුටිකණ්ණො”ති පාකටො අහොසි.","“අථ ඛො ආයස්මා ආනන්‍දො කොසිනාරකානං මල්ලානං ආරොචෙසි:- අජ්ජ ඛො, වාසෙට්ඨා, රත්තියා පච්ඡිමෙ යාමෙ තථාගතස්ස පරිනිබ්බාණං භවිස්සතීති.”","සුත්තන්තිකා වෙනයිකා ආරඤ්ඤිකා ච බහවො භික්ඛූ ලංකායං මහාදුබ්භික්ඛභයෙ වත්තමානෙ සමුද්දපාරං ගන්ත්‍වා අත්තනො ජීවිතං ධම්මවිනයං ච රක්ඛිංසු.","ඉද්‍ධිමන්තානමග්ගො මහාමොග්ගල්ලානත්‍ථෙරො භගවතො පරිනිබ්බානතො පුරෙතරමෙව පරිනිබ්බායි.","“අථ ඛො තෙසං ද්වාදසනහුතානං මාගධිකානං බ්‍රාහ්මණ - ගහපතිකානං එතදහොසි :- උරුවෙලකස්සපො මහාසමණෙ බ්‍ර‍හ්මචරියං චරතීති.” (විනයමහාවග්ග)","“අස්සොසි ඛො රාජා මාගධො සෙණියො බිම්බිසාරො සමණො ඛලු භො ගොතමො සක්‍යපුත්තො, සක්‍යකුලා පබ්බජිතො, රාජගහං අනුප්පත්තොති.” (එම)"],"s":["පාටලිගමෙහි උපාසකවරු එතුමාගේ එහි පැමිණීම අසා එතුමන් වසන තැනට ගොස් තමන්ගේ සන්ථාගාරයට පැමිණෙන්ට ආරාධනා කළහ.","එහි පැමිණි ඔවුහු ශාලාවෙහි වැලි විසුරුවා ආසන පණවා දොරටුව සමීපයෙහි දිය හැළියක් තබා පහන් දැල්වූහ.","බුදුරද සිවුරු පොරවා පාත්‍ර‍ය ගෙන භික්‍ෂූන් සමග සන්ථාගාරයට ගොස් පා සෝදා ඇතුළු වී මධ්‍යයෙහි පිහිටි කුලුන මුල නැගෙන හිරට මූණලා වැඩහුන්නේ ය.","ආනන්‍දය, තෝ දැන් කුසිනාරාවට ගොස් එහි වැසි මල්ලයන්ට මෙසේ දැනුම් දෙව. ‘වාසෙට්ඨයිනි, අද රෑ පශ්චිමයාමයෙහි බුදුන්ගේ පිරිනිවීම වන්නේය’ යි.","එකල්හි ආයුෂ්මත් මහාකාශ්‍යප ස්ථවිරතෙම මහත් භික්ෂු පිරිසක් සමග පාවානුවරින් කුසිනාරාවට එන්නේ මාර්ගයෙන් ඉවත්ව එක්තරා ගසක් මුල වැඩහුන්නේ ය.","මහා පජාපතී ගෝතමිය හිසකෙස් කපා කසාවත් හැඳ ශාක්‍යවංශික ස්ත්‍රීන් බොහෝ දෙනකුන් සමග වෛශාලියට ගොස් බුදුරදුන්ගෙන් පැවිද්ද ඉල්වී ය.","මගධරජ වූ බිම්බිසාර තෙමේ දියෙන් පිරූ රන්කෙණ්ඩියක් ගෙන බුදුරදුන්ගේ අතෙහි පැන් වත්කොට වෙළුවන උයන බුදුන් ප්‍ර‍මුඛ සංඝයාට පිදී.","ආනන්‍දය, යම් ශාසනයක (= ආගමක) ස්ත්‍රීන්ට පැවිද්ද දෙනු ලැබේ නම්, බොහෝ ස්ත්‍රීන් ඇති ගෙය h","තද්‍ධිත පද"],["p","48. නාමයකින් පරව යම්කිසි අර්ථ විශේෂයක් ප්‍ර‍කාශ කිරීම පිණිස ප්‍ර‍ත්‍යයක් යොදා සාදන පදය තද්‍ධිත නම් වේ."],["p","ප්‍ර‍ත්‍යය නම් යම්කිසි විශේෂාර්‍ථයක් ප්‍ර‍කාශ කිරීම සඳහා නාමයකින් හෝ ධාතුවකින් පසුව යොදනු ලබන කොටසකි."],["p","1. සාමඤ්ඤ තද්‍ධිත"],["p","2. භාව තද්‍ධිත"],["p","3. අව්‍ය තද්‍ධිත"],["p","යයි තද්‍ධිතය තුන් කොටසකට බෙදන ලදි. එයින්"],["h","1. සාමඤ්ඤ තද්‍ධිතය"],["p","1. අපච්චත්‍ථ"],["p","2. අනෙකත්‍ථ"],["p","3. අත්‍ථ්‍යත්‍ථ"],["p","4. සංඛ්‍යා - යන සිවු කොටසකට බෙදන ලදි."],["p","**49. ණ - ණි - ණෙය්‍ය ආදී ණ් - කාරයක් සහිත ප්‍ර‍ත්‍යයක් කළ කල්හි මුලින් සිටි නාම පදයාගේ මුල් ස්වරයට වාද්‍ධි වේ. වෘද්‍ධිය නම් අ-කාරයට ආ- කාරයත්, ඉ-ඊ-දෙදෙනට එ-කාරයත්, උ ඌ- දෙදෙනට ඔ - කාරයත් වීමයි. මුල් ස්වරයට වෘද්‍ධි වූ පසු ප්‍ර‍ත්‍යයෙහි වූ ණ්-කාරය ද ලොප් කරනු ලැබේ. බැඳි අකුරු පරව සිටි කල්හි මුල් වෘද්ධි නොවේ.**"],["p","1. සාමඤ්ඤ තද්‍ධිතයෙහි"],["p","(1) අපච්චත්‍ථ හෙවත් පරමපරාර්‍ථය"],["p","**50. ඔහුගේ පරම්පරාවෙහි වූ යන අර්ථයෙහි ඇතැම් තැනක නාමයෙන් පරව ණ - ප්‍ර‍ත්‍යය වේ.**"],["p","වසිට්ඨ (සෘෂි) ගේ පරම්පරාවෙහි වූ පුරුෂයකු කියනු කැමති කල්හි වසිට්ඨ - ශබ්දයෙන් පරව ණ - ප්‍ර‍ත්‍යය වේ. “වසිට්ඨ + ණ” යි සිටි විට ණ - සහිත ප්‍ර‍ත්‍යයක් පර බැවින් වසිට්ඨ - ශබ්දයේ මුල් ස්වරය වූ අ- කාරයට වෘද්ධිය වූ ආකාරය වේ. ණ් - කාරය ලොප් කළ විට “වාසිට්ඨ + අ” යි සිටී. පූර්‍ව ස්වරලෝපසන්‍ධිය කළ විට වාසිට්ඨ යි සිටී. පුල්ලිඞ්ගයෙහි පාඨමා එක වචනය යෙදූ විට වාසිට්ඨො වේ. “වශිෂ්ටගේ පරම්පරාවෙහි උපන් (පුරුෂයා)” යන අර්ථ ඇත්තේයි."],["p","ඒ පරම්පරාවෙහි ස්ත්‍රියක් කිය යුතු වී නම් ස්ත්‍රීලිඞ්ගික ඊ - ප්‍ර‍ත්‍යය යොදා වාසිට්ඨාවී යැයි සෑදිය යුතු. ඒ පරම්පරාවෙහි වූ නපුංසකයකු හෝ"],["p","පවුලක් කිය යුතු වී නම් “වාසිට්ඨ” ශබ්දයට නපුංසක ලිඞ්ගික විභක්ති රූප යෙදිය යුතු. වාසෙට්ඨ යි එකාරයෙන් යුක්තව ද මෙය දක්නා ලැබේ."],["p","භාරද්වාජ + ණ = භාරද්වාජ (= භාරද්වාජගේ පරම්පරාවෙහි වූ.)"],["p","ගොතම + ණ = ගොතම (ගෝතමගේ පරම්පරාවෙහි වූ.)"],["p","වාසුදෙව + ණ = වාසුදෙව (= වාසුදේවගේ පරම්පරාවෙහි වූ.)"],["p","බලදෙව + ණ = බාලදෙව (බලදේවගේ පරම්පරාවෙහි වූ.)"],["p","මේ ශබ්දයෝ වාසිට්ඨ - ශබ්දය හා සමාන වෙති. මුල් පද දෙකෙහි ස්වරයන් දීර්‍ඝ බැවින් වෘද්‍ධියක් ඕනෑ නොවේ."],["p","**51. වච්ඡ - කච්ච - ආදි ශබ්දයන් කෙරෙන් පුත්‍රාර්ථයෙහි ණායන - ණාන - යන ප්‍ර‍ත්‍යයෝ වෙත්. (ණ්-කාරය මුල් ස්වරයට වෘද්‍ධිකිරීම සඳහා යයි ද, වච්ඡ - කච්ච යන දෙතැන්හි ම බැඳි අකුරු පරව තිබෙන බැවින් වෘද්‍ධි නොවේ යයි ද දතයුතු.)**"],["p","වච්ඡ + ණායන = වච්ඡායන (වච්ඡගේ පුත්‍ර‍යා)"],["r","වච්ඡ + ණාන = වච්ඡාන ”\t”"],["p","කච්ච + ණායන = කච්චායන (කච්චගේ පුත්‍ර‍යා)"],["p","කච්ච + ණාන = කච්චාන (කච්චගේ පුත්‍ර‍යා)"],["p","මොග්ගල්ල + ණායන = මොග්ගල්ලායන (=මොග්ගල්ලගේ පුත්‍ර‍යා.)"],["p","මොග්ගල්ල + ණාන = මොග්ගල්ලාන (= මොග්ගල්ලගේ පුත්‍ර‍යා.)"],["p","**52. කත්තික - විනතා - ආදි ස්ත්‍රී ලිඞ්ගික ශබ්දයන් කෙරෙන් පුත්‍රාර්ථයෙහි ණෙය්‍ය ප්‍ර‍ත්‍යය වේ.**"],["p","කත්තිකා + ණෙය්‍ය = කත්තිකෙය්‍ය (= කත්තිකාවගේ පුත්‍ර‍යා)"],["p","විනතා + ණෙය්‍ය = වෙනතෙය්‍ය (=විනතාවගේ පුත්‍ර‍යා, ගුරුළා.)"],["p","භගිනී + ණෙය්‍ය = භාගිනෙය්‍ය (= සොහොයුරියගේ පුත්‍ර‍යා, බෑනා.)"],["p","රොහිනී + ණෙය්‍ය = රොහිණෙය්‍ය (= රොහිණියගේ පුත්‍ර‍යා)"],["p","අන්තිම දෙපදයෙහි ඉතිරි වී තිබෙන න - ණ දෙදෙන ණෙය්‍ය ප්‍ර‍ත්‍යයේ ණ කාරය නොවන බව සැලකිය යුතු."],["p","**53. උපගු - මනු ආදි උකාරාන්ත ශබ්දයන් කෙරෙන් පුත්‍රාර්ථයෙහි ණව-ප්‍ර‍ත්‍යය වේ.**"],["p","උපගු + ණව = ඔපගව (= උපගුගේ පුත්‍ර‍යා)"],["p","මනු + ණව = මාණව (= මනුගේ පුත්‍ර‍යා = මනුෂ්‍යයායි.)"],["p","පණ්ඩු + ණව = පණ්ඩව (= පණ්ඩු රජුගේ පුත්‍ර‍යා.)"],["p","**54. විධවා ආදි ශබ්දයන් කෙරෙන් පුත්‍රාර්‍ථයෙහි ණෙර ප්‍ර‍ත්‍යය වේ.**"],["p","විධවා + ණෙර = වෙධවෙර (= වැන්දඹුවගේ පුත්‍ර‍යා)"],["p","සමණ + ණෙර = සාමණෙර (= ශ්‍ර‍මණයාගේ පුත්‍ර‍ස්ථානයෙහි සිටි"],["p","සාමණෙර තෙමේ.)"],["r","(1) සාමඤ්ඤ\t(2) අනෙකත්‍ථ තද්ධිතය."],["p","**55. එයින් මිශ්‍ර‍ වූයේ ය, එහි යෙදුනේ ය, එයින් ජීවත් වන්නේ ය, එයින් යන්නේ ය, එයින් උසුළන්නේ ය, එය ඔහුගේ ශිල්ප ය, එය හා සම්බන්ධ ය. එයින් ගනුදෙනු කරන්නේ ය, එය උගනී, එහි උපනේ ය, එතැනට අයිතිය යනාදි අර්‍ථයන්හි ණික - ප්‍ර‍ත්‍යය වේ. **"],["p","**A. එයින් මිශ්‍ර‍ වූයේ :-**"],["p","ඝත + ණික = ඝාතික (= ගිතෙලින් මිශ්‍ර‍ වූ හෙවත් ගිතෙලින් හැනූ බත් ආදිය.)"],["p","ලොණ + ණික = ලොණික = (ලුණින් මිශ්‍ර‍ වූ)"],["p","ණ් - කාරලෝපය හා වෘද්‍ධිය පෙර මෙනි."],["p","**B. එහි යෙදුණේ :-**"],["p","ද්වාර+ණික=දොවාරික (=දොරටුවෙහි යෙදුණේ; දොරටුපාලයායි.)"],["p","මෙහි ද්වා - යන්නේ වකාරයට මුලින් ඔකාරයක් ආගම වේ. එවිට දො - කියා සිටී."],["p","භාණ්ඩාගාර+ණික=භාණ්ඩාගාරික(=භාණ්ඩාගාරයෙහි නියුක්ත වූ.)"],["p","සකට + ණික = සාකටික (= ගැලෙහි නියුක්ත වූයේ.)"],["p","නාවා + ණික = නාවික (= නැවෙහි නියුක්ත වූයේ.)"],["p","**C. එයින් ජීවත් වෙයි.**"],["p","බලිස + ණික = බාලිසික (= බිලිබාන්නා)"],["p","වෙතන + ණික = වෙතනික (= වැටුප් ලබා ජීවත් වන්නා.)"],["p","ජාල + ණික = ජාලික (= දැලින් සතුන් මරන්නා)"],["p","**D. එයින් යයි :-**"],["p","පද + ණික = පදික (= පයින් යන්නා)"],["p","රථ + ණික = රථික (= රථයෙන් හැසිරෙන්නා.)"],["p","**E. එයින් උසුලයි :-**"],["p","සීස + ණික = සීසික (= හිසින් බරගෙන යන)"],["p","හත්‍ථ + ණික = හත්‍ථික (= අතින් උසුලන)"],["p","**F. එය ඔහුගේ ශිල්පය :-**"],["p","වීණා + ණික = වෙණික (= වීණා වාදනය කරන්නා.)"],["p","වංස + ණික = වංසික (= නළා පිඹින්නා.)"],["p","**G. එය හා සම්බන්ධය :-**"],["p","සංඝ + ණික = සංඝික (= සංඝයාට අයත්)"],["p","ලොක + ණික = ලොකික (= ලෝකයට අයත්)"],["p","අපාය + ණික = ආපායික (= නිරයට අයත්)"],["p","සමුද්ද + ණික = සාමුද්දික (= මුහුදට අයත්)"],["p","**H. එයින් ගනුදෙනු කරයි.**"],["p","තණ්ඩුල + ණික = තණ්ඩුලික (= සහල් වෙළෙන්දා)"],["p","තෙල + ණික = තෙලික (= තෙල් වෙළෙන්දා)"],["p","සූකර + ණික = සූකරික (= ඌරන් විකුණන්නා)"],["p","**I. එය උගනී**"],["p","විනය + ණික = වෙනයික (= විනය ඉගෙන ගන්නා හෙවත් හදාරන්නා)"],["p","අභිධම්ම + ණික = ආභිධම්මික (= අභිධර්‍මය හදාරන්නා.)"],["p","**J. එහි උපන්නේ හෝ එතනට අයත් වූයේ :-**"],["p","මගධ + ණික = මාගධික (= මගධරට උපන් හෝ එරටට අයත්.)"],["p","සරීර + ණික = සාරීරික (= ශරීරයෙහි උපන් හෝ එයට අයත්.)"],["p","වන + ණික = මානසික (= සිතෙහි උපන් හෝ එයට අයත්)"],["p","අරඤ්ඤ + ණික = ආරඤ්ඤික (= වනයෙහි උපන් හෝ එයට අයත්.)"],["p","**K. ආදි ශබ්දයන්**"],["p","සන්‍දිට්ඨ + නික = සන්‍දිට්ඨික (= තමා විසින් දැක්ක යුතු:"],["p","මෙලොව පිළිබඳ)"],["p","මාතු + ණික = මාතික (= මවගෙන් ආ.)"]]},{"p":["“යථා පන දාරුආදීහි නිප්ඵන්නාති තානි තානි භණ්ඩානි දාරුමයාදීනි නාම හොන්ති. තථා එතෙ’පි මනතො නිප්ඵන්නත්තා මනොමයා නාම” (ධ. අ.)","“මාණව, අහං තෙ සුවණ්ණමයං වා මණිමයං වා රජතමයං වා ලොහමයං වා චක්කයුගං දස්සාමී” ති බ්‍රාහ්මණො වදි.","මාගධො බිම්බිසාරො රාජා අන්තනො පාසාදස්ස උපරිමතලෙ ඨිතො පිණ්ඩාය චරන්තං බොධිසත්තමනුගච්ඡන්තෙ නාගරෙ දිස්වා “කිමෙත”න්ති පුච්ඡි.","දයාලු භගවා මහාජනතං අනුකම්පන්තො සබ්බදා එකත්‍ථ අවසිත්‍වා තත්‍ථ තත්‍ථ විචරන්තො සන්‍දිට්ඨිකං ධම්මං දෙසෙසි.","පාටලීගාමිකාපි ඛො උපාසකා පාදෙ පක්ඛාලෙත්‍වා ආවසථාගාරං පවිසිත්‍වා පුරත්‍ථිමං භිත්තිං නිස්සාය පච්ඡිමාභිමුඛා නිසීදිංසු.” (විනය මහාවග්ග)","“අස්සොසුං ඛො වෙසාලිකා ලිච්ඡවී භගවා කිර කොටිගාමං අනුප්පත්තොති. අථ ඛො වෙසාලිකා ලිච්ඡවී භද්‍රානි යානානි යොජාපෙත්‍වා...... වෙසාලියා නීයිංසු භගවන්තං දස්සනාය.” (විනය මහාවග්ග)","“තෙන ඛො පන සමයෙන රාජගහිකස්ස සෙට්ඨිස්ස සත්ත වස්සිකො සීසාබාධො අහොසි. බහූ මහන්තා මහන්තා දිසාපාමොක්ඛා වෙජ්ජා ආගන්ත්‍වා නා’සක්ඛිංසු ආරොගං කාතුං” (එම)","“අථ ඛො ජීවකො කොමාරභච්චො සෙට්ඨිං ගහපතිං මඤ්චකෙ නිපජ්ජාපෙත්‍වා මඤ්චකෙන සම්බන්‍ධිත්‍වා සීසච්ඡවිං ඵාලෙත්‍වා........ ද්වෙ පාණකෙ නීහරිත්‍වා ජනස්ස දස්සෙසි.” (එම)","“සෙට්ඨිපුත්තො ‘නිය්‍යානිකං වත බුද්‍ධසාසනං’ති පසීදිත්‍වා යොජනිකං සුවණ්ණචෙතිං කම්බල - කඤ්චුකෙන පරික්ඛිපිත්‍වා තත්‍ථ තත්‍ථ රථචක්කප්පමාණෙහි සුවණ්ණපදුමෙහි අලංකරි.” (අඞ්ගුත්තරට්ඨකථා)","“තස්මිං සමයෙ චතුසත්තති - සහස්සජටිලා පණීත පණීතානි ඔජවන්තානි ඵලාඵලානි ගහෙත්‍වා ආචරියස්ස සන්තිකං සම්පත්තා.’ (එම)"],"s":["තෙල් වෙළෙන්දා යකඩින් කළ ආයුධයක් ගෙන දොරටු පාලයාට පහර දුන්නේ ය.","මට්ටකුණ්ඩලී තෙම සර්‍වඥයන් වහන්සේ කෙරෙහි සිත පහදවා කලුරිය කොට තව්තිසා දෙව් ලොව රන්විමනක උපන්නේ ය.","පස්වග මහණහු ඒහිපස්සික වූ ධර්‍මය අසා රහත් ඵලය ලැබූහ.","බ්‍රාහ්මණ තෙම මාණවකයාට රනින් කළා වූ හෝ රිදියෙන් කළා වූ මැණික්වලින් කළා වූ හෝ චක්‍ර‍ දෙකක් දෙන්නෙමියි කීය.","ආභිධර්මික තෙම මහාජන සමූහයාට තමන් විසින් දැක්ක යුතු (හෙවත් අවබෝධ කටයුතු) ධර්‍මය දේශනා කළේ ය.","මුගලන් තෙරුන් වහන්සේ මනෝමය ශරීරයක් මවා ගෙන තව්තිසා දෙව්ලොවට වැඩි සේක.","බෝධිසත්ව තෙම වෙසක් මස පසළොස්වක්දා උදය කිරිබත් වළඳා (අනුභව කොට) සවස් කාලයෙහි බෝ මැඩට පැමිණියේ ය.","සංඝරක්ඛිත ස්ථවිරයන් වහන්සේගේ බෑනා වූ සාමණේර නමක් පැවිද්ද හැර ගිහියෙක් විය.","නාවිකයෝ යකඩින් කළා වූ ද ලීයෙන් කළා වූ ද රිදියෙන් කළා වූ ද බඩු නැවෙහි පටවාගෙන චීන රටට ගියහ.","පුත්‍ර‍යන් ඇති මගියා සහල් වෙළෙන්දාගෙන් සහල් ඉල්වීය."],"gp":[["අරොග","රොගනැති, නීරෝගී. 3."],[" ාට අයත් + බලාදිය)"],["p","මගධ + ණ = මාගධ (= මගධ රටට අයත්)"],["p","**C. එය දන්නේ ය :-**"],["p","ව්‍යාකරණ + ණ = වෙය්‍යාකරණ (= ව්‍යාකරණ දන්නා.)"],["p","(ව්‍යා - යන්නට වෙය්‍ය - ආදේශය වේ.)"],["p","**D. එහි හට ගත්තේ හෝ උපන්නේ :-**"],["p","මන + ණ = මානස (= සිතෙහි හටගත්)"],["p","සර + ණ = සාරස (= විලෙහි හටගත්; පියුම් ආදියයි.)"],["p","උර + ණ = ඔරස (= ළයෙහි වැඩුණේ; ඖරස) පුත්‍ර‍යායි."],["p","(මේ තුන්තැන ප්‍ර‍ත්‍යයටත් ශබ්දයටත් මැද සකාරාගම වේ.)"],["p","නගර + ණ = නාගර (= නුවර උපන් හෝ වසන)"],["p","මගධ + ණ = මාගධ (= මගධ දේශයෙහි උපන්)"],["p","කුසිනාරා + ණ = කොසිනාර, (= කුසිනාරාවැසි)"],["p","**E. එය ඔහුගේ මාංශය :-**"],["p","සූකර + ණ = සොකර (= ඌරුමස්). න."],["p","මහිස + ණ = මාහිස (= මීමාගේ මස්). න."],["p","සකුණ + ණ = සාකුණ (= පක්‍ෂිමස්). න."],["p","**F. එය ඔහුට ඇත්තේය :-**"],["p","සද්‍ධා + ණ = සද්‍ධ (= ශ්‍ර‍ද්‍ධා ඇති.)"],["p","පඤ්ඤා + ණ = පඤ්ඤා (= ප්‍ර‍ඥා ඇති.)"],["p","**57. එහි වූයේ, එය ඔහුට ඇත්තේ ය යනාදී අර්‍ථයන්හි ඉම-ඉය යන ප්‍ර‍ත්‍යයෝ වෙත්.**"],["p","**A. එහි වූයේ :-**"],["p","පච්ඡා + ඉම = පච්ඡිම (= පසුව උපන් හෝ වූ.)"],["p","අන්ත + ඉම = අන්තිම (= කෙළවරෙහි හෝ අන්තයෙහි වූ.)"],["p","මජ්ඣිම + ඉම (මජ්ඣිම (= මධ්‍යයෙහි වූ.)"],["p","උපරි + ඉම = උපරිම (උඩින් වූ: මත්තෙහි වූ:)"],["p","හෙට්ඨා + ඉම = හෙට්ඨිම (= යටින් වූ.)"],["p","මනුස්සජාති + ඉය = මනුස්සජාතිය (= මිනිස් ජාතියෙහි වූ.)"],["p","ලොක + ඉය = ලොකිය (= ලෝකයෙහි වූ.)"],["p","බොධිපක්ඛ + ඉය = බොධිපක්ඛිය (= බෝධියගේ පක්‍ෂයෙහි වූ.)"],["p","පඤ්චවග්ග + ඉය = පඤ්චවග්ගිය (= පස්වගෙහි වූ.)"],["p","උදර + ඉය = උදරිය (= උදරයෙහි වූ: නොපැසුණු ආහාරයයි.)"],["p","**B. එය ඔහුට ඇත්තේ :-**"],["p","පුත්ත + ඉම = පුත්තිම = පුත්‍ර‍යන් ඇති."],["p","පුත්ත + ඉය = පුත්තිය = පුත්‍ර‍යන් ඇති."],["p","ජටා + ඉය = ජටිය (= ජටා ඇති.)"],["p","**58. සමූහාර්‍ථයෙහි තා - ප්‍ර‍ත්‍යය වේ. එය ස්ත්‍රී ලිංගයෙහියි.**"],["p","ගාම + තා = ගාමතා (= ග්‍රාමයන්ගේ සමූහය, ගම් සමූහය.)"],["p","ජන + තා = ජනතා (= ජන සමූහය.)"],["p","ස්වාර්‍ථයෙහි ද තා - ප්‍ර‍ත්‍යය වේ."],["p","දෙව + තා = දෙවතා (= දේවතාවා) යනු උදාහරණයි. දෙවි තෙමේම ‘දෙවතා’ නම් වේ. නමුත් තා ප්‍ර‍ත්‍යයාන්ත වූ මේ ශබ්දය ස්ත්‍රී ලිඞ්ගයෙහි වේයයි දතයුතු."],["p","59. සමූහාර්‍ථයෙහි ණ - ප්‍ර‍ත්‍යය ද වේ."],["p","**ද්වි + ණ = ද්වය (= දෙදෙනාගේ සමූහය)**"],["p","ති + ණ = තය (= තිදෙනාගේ සමූහය.)"],["p","මේ දෙතැන්හි ද්වි-ති- ශබ්දයන්ගේ ඉකාරයන්ට අය - ආදේශ වේ."],["p","**60. එය එයට හේතුව වේ යන අර්‍ථයෙහි ඊය - ප්‍ර‍ත්‍යය වේ.**"],["p","බන්‍ධන + ඊය = බන්‍ධනීය (= බැඳීමට කාරණය: බැන්ද යුතු)"],["p","මුච්ඡන + ඊය = මුච්ඡනීය (= මූර්ජාවීමට කාරණය)"],["p","ඛමන + ඊය = ඛමනීය (= ඉවසීමට හේතු වූ, ඉවසිය යුතු.)"],["p","රජන + ඊය = රජනීය (= ඇලීමට හේතු වූ, ඇලිය යුතු)"],["p","(මේවා අනීය ප්‍ර‍ත්‍යයෙන් ද සිද්‍ධ කළ හැක.)"],["p","**61. එය බහුල කොට ඇත්තේ යන අර්‍ථයෙහි ආලු - ප්‍ර‍ත්‍යය වේ.**"],["p","අභිජ්ඣ + ආලු = අභිජ්ඣාලු (= දැඩි ලෝභය බහුල කොට ඇත්තේ.)"],["p","ධජ + ආලු = ධජාලු (= ධ්වජ බහුල වූ)"],["p","දයා + ආලු = දයාලු (= කරුණා බහුල කොට ඇත්තේ.)"],["p","**62. ඇතැම් විට ආලු ප්‍ර‍ත්‍යයෙන් පසුව කකාරගමයක් වේ. අන්‍යශබ්දයන් කෙරෙන් ද නොයෙක් අර්‍ථයන්හි කකාරාගමය වේ.**"],["p","අභිජ්ඣාලුකො, දයාලුකො යනු උදාහරණයි. පෙර දැක්වූ අර්‍ථම ඇත්තාහ."],["p","A මේ ස්වාර්‍ථයෙහි ක - ප්‍ර‍ත්‍යයයි. මෙයින් කිසි අමුතු අර්ථයක් ප්‍ර‍කාශ නොවේ."],["p","කුමාරයාම කුමාරක නම් වේ."],["p","මාණවයා හෙවත් තරුණයාම මාණවක නම් වේ."],["p","මුදු හෙවත් මෘදුවූයේම මුදුක නම් වේ."],["p","**B. කුඩා අර්ථයෙහි**"],["p","පුත්තක + ක = පුත්තක (= කුඩා පුත්‍ර‍යා.)"],["p","පීඨ + ක = පීඨක (= කුඩා පුටුව)"],["p","මඤ්ච + ක = මඤ්චක (= කුඩා ඇඳ)"],["p","**C. නින්දාර්ථයෙහි :**"],["p","පණ්ඩිත + ක = පණ්ඩිතක (= නින්දා ලැබිය යුතු උගතා)"],["p","ලුද්ද + ක = ලුද්දක (= නින්දා ලැබිය යුතු වැද්දා)"],["p","මේ ක - ප්‍ර‍ත්‍යය ‘එහි උපන්නේ හෝ වසන්නේ’ යන අර්ථයෙහි ණ - ප්‍ර‍ත්‍යයෙන් සිද්‍ධවූ පදයන් කෙරෙන් ද සම්බන්ධාර්ථයෙහි වූ බහුබ්බීසි සමාස පදයන් කෙරෙන් ද විශේෂාර්ථයක් නැතිව යොදනු ලැබේ."],["p","කුසිනාරා + ණ = කොසිනාර = **කොසිනාරක** (= කුසිනාරාවෙහි"],["p","උපන් හෝ වසන.)"],["p","රාජගහ + ණ = රාජගහ = **රාජගහක** (= රාජගහවෙහි උපන්"],["p","හෝ වසන)"],["p","බහු + නදී + ණ = **බහුනදික** (= බොහෝ ගංගා ඇති)"],["p","**63. එයින් කරණ ලද දෙය හෝ එයින් උපන් දෙය යන අර්ථයෙහි මය - ප්‍ර‍ත්‍යය වේ.**"],["p","සුවණ්ණ + මය = සුවණ්ණමය හෝ සොවණ්ණමය (= රනින් කරන ලද හෝ සෑදූ)"],["p","රජත + මය = රජතමය (= රිදියෙන් කළ)"],["p","දාරු + මය = දාරුමය (= ලීයෙන් කළ)"],["p","ඉද්ධි + මය = ඉද්‍ධිමය (= සෘද්ධියෙන් උපන්)"],["p","මන + මය = මනොමය (= සිතින් උපන්)"],["p","අන්තිම පදයෙහි මන - ශබ්දය මනෝගණයට අයත් බැවින් මධ්‍යයෙහි ඔකාරාගම කරනු ලැබේ. ‘සොවණ්ණමය’ යන තැන උකාරයට ඔකාරාදේශ වේ."],["p","ගො + මය = ගොමය (= ගවයාගෙන් උපන් මල: ගොම)"]]},{"p":["“උච්ඡින්‍ද සිනෙහමත්තනො කුමුදං සාරදිකංව පාණිනා (ධම්මපද 235 ගා.)","“නෙව ඛො අසක්ඛි වාසෙට්ඨො මාණවො භාරද්වාජං මාණවං සඤ්ඤාපෙතුං, න පන අසක්ඛි භාරද්වාජො මාණවොපි වාසෙට්ඨං මානවං සඤ්ඤාපෙතුං. (දීඝ.)","“කුසාවතියා ආනන්‍ද රාජධානියා....... එකං ද්වාරං සොවණ්ණමයං, එකං රූපියමමයයං, එකං වෙළුරියමයං, එකං ඵලික මයං.” (දීඝ. මහාසුදස්සන)","මය්හං භාගිණෙය්‍යො ඉමස්ස රජ්ජස්ස සාමිකොව, ධීතරං එතස්සෙ’ව දත්‍වා අභිසෙකමස්ස කරිස්සාමීති.” (අසිලක්ඛණ ජාතක)","“අතීතෙ ඛාරාණසියං බ්‍ර‍හ්මදත්ත රජ්ජං කාරෙන්තෙ බොධි සත්තො භාතිකසතස්ස කණිට්ඨො අහොසි.” (පඤ්චගරු ජාතක)","“ඉදං ඛො මහාරාජ, සන්‍දිට්ඨිකං සාමඤ්ඤඵලං පුරිමෙහි සන්‍දිට්ඨිකෙහි සාමඤ්ඤඵලෙහි අභික්කන්තතරං ච පණිතතරං ච.’ (දීඝ සාමඤ්ඤඵල)","“රඤ්ඤා මහාසුදස්සනස්ස උපරිපාසාදවරගතස්ස දිබ්බං චක්කරතනං පාතුරහොසි සහස්සාරං සනෙමිකං සනාභිකං සබ්බා කාරපරිපූරං.” (දීඝ)","බාරාණසියං යසො නාම කුලපුත්තො සෙට්ඨිපුත්තො සුඛුමාලො හොති: තස්ස තයො පාසාදා හොන්ති:- එකො හෙමන්තිකො එකො ගිම්හිකො, එකො වස්සිකො” (විනය මහාවග්ග)","“මහාකස්සපථෙරො ච අනුරුද්ධො මහාගණී උපාලිත්‍ථෙරො සතිමා ආනන්‍දො ච බහුස්සුතො අඤ්ඤෙ බහූ අභිඤ්ඤාතා සාවකා සත්‍ථුවණ්ණිතා සබ්බෙ පඤ්චසතා ථෙරා නවඞ්ගං ජිනසාසනං උග්ගහෙත්‍වාන ධාරෙසුං බුද්ධසෙට්ඨස්ස සන්තිකෙ.” (දීපවංස)","“තස්සා ච සාමිනී තත්‍ථ කුවෙණි නාම යක්ඛිණී නිසීදි රුක්ඛමූලම්භි කන්තන්තී තාපසී විය.” (මහාවංස)"],"s":["කුසාවතී නුවර සත්රුවනින් කළ ප්‍රාකාරයෝ සත් දෙනෙක් ද දොරටු සතක් ද වූහ.","බරණැස් රජ තමාගේ බෑනාට ස්වකීය දූ කුමරිය දී රාජ්‍යයෙහි අභිෂේක කරවිය.","මහාමන්‍ධාතු රජතුමා චක්‍ර‍රත්නයේ ආනුභාවයෙන් පොළොව මුළුල්ලේ ඇවිද දෙව්ලොවට ද ගියේ ය.","මහා සුදස්සන රජුට සත්රුවන් පොකුණු අසූහාර දහසක් ද හස්ති රත්නය ප්‍ර‍මුඛ අසූහාර දහසක් ඇත්තු ද සියලු ආකාරයෙන් සැරසූ අසූහාර දහසක් රථයෝ ද වූහ.","බහුශ්‍රැතයන්ට අග්‍ර‍ වූ ගෞතම ගෝත්‍ර‍ ඇති ආනන්‍ද මහා ස්ථවිරතුමා සර්‍වඥයන් වහන්සේගේ ධර්‍මභාණ්ඩාගා
