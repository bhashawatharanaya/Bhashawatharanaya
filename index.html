<!doctype html>
<html lang="si">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>පාලි භාෂාවතරණය 02</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+Sinhala:wght@500;700&family=Noto+Sans+Sinhala:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#F3F4EF; --leaf:#E9E3CF; --ink:#1E2740;
  --display:"Noto Serif Sinhala",Georgia,serif; --body:"Noto Sans Sinhala","Iskoola Pota",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141824; --leaf:#2A2A22; --ink:#E7E8EE; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141824; --leaf:#2A2A22; --ink:#E7E8EE; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.75;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:780px;margin:0 auto}
header.leaf{margin-top:16px;background:var(--leaf);border-radius:6px;padding:20px 22px;position:relative;overflow:hidden}
header.leaf::before,header.leaf::after{content:"";position:absolute;top:50%;width:10px;height:10px;border-radius:50%;background:var(--bg);transform:translateY(-50%)}
header.leaf::before{left:22%}header.leaf::after{right:22%}
h1{font-family:var(--display);font-size:1.7rem;margin:0;line-height:1.3;text-wrap:balance}
</style>
</head>
<body>

<div class="wrap">
  <header class="leaf">
    <h1>පාලිභාෂාවතරණය · දෙවැනි පොත</h1>
  </header>
</div>

</body>
</html>
