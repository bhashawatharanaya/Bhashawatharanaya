,"**65. ඊ - වී - ස්සී - ප්‍ර‍ත්‍යයන්ගෙන් සැදුණු පදයන් ස්ත්‍රී ලිංගයෙහි යෙදෙන විට අන්තයෙහි ඉනී = ප්‍ර‍ත්‍යයන් යෙදේ.**"],["p","මාලී + ඉනී = මාලිනී (= මාලා ඇත්තී.)"],["p","මන්තී + ඉනී = මන්තිනී (= මැතිනිය)"],["p","මෙධාවී + ඉනී = මෙධාවිනී (= නුවණැත්තී.)"],["p","තපස්සී + ඉනී = තපස්සිනී (= තපස් ඇත්තී.)"],["p","**66. මෙයින් යුක්තය යනාර්ථය ප්‍ර‍කාශ කිරීම පිණිස ඇතැම් අකාරාන්ත ශබ්දයන් කෙරෙන් වන්තු - ප්‍ර‍ත්‍යය ද ඉ - කාරාන්ත උ - කාරාන්ත ශබ්දයන් කෙරෙන් මන්තු - ප්‍ර‍ත්‍යය ද යෙදේ.**"],["p","ගුණ + වන්තු = ගුණවන්තු (= ගුණ ඇති)"],["p","ධන + වන්තු = ධනවන්තු (= ධනවත්)"],["p","බුද්‍ධි + මන්තු = බුද්ධිමන්තු (= නුවණැති)"],["p","භානු + මන්තු = භානුමන්තු (= රශ්මි ඇති, සූර්යයා)"],["p","ආයු + මන්තු යන තැන උකාරයට අස් - ආදේශ වී = ආයස්මන්තු යි සිද්‍ධ වේ."],["p","**67. මේ ශබ්දයන් ස්ත්‍රී ලිංගයෙහි යෙදෙන විට ඊ - ප්‍ර‍ත්‍යයක් වී පූර්‍වස්වරය ලොප් වේ. ඇතැම් විට වන්තු - මන්තුන්ගේ න් - කාරය ද ලොප් වේ.**"],["p","ගුණවන්තු + ඊ = ගුණවන්තී, ගුණවතී (= ගුණ ඇත්තී.)"],["p","සතිමන්තු + ඊ = සතිමන්තී, සතිමතී (= සිහි ඇත්තී.)"],["p","**68. ණව = ණික - ණෙය්‍ය - ණ - යන ප්‍ර‍ත්‍යයන්ගෙන් සිද්‍ධ වූ තද්ධිත පදයන් ස්ත්‍රීලිංගයෙහි වැටෙන විට ඊ - ප්‍ර‍ත්‍යයක් කළ යුතු යි.**"],["p","ණව: මාණව + ඊ = මාණවී (= මෙනවිය: තරුණිය.)"],["p","ණික: නාවික + ඊ = නාවිකී (= නැවෙහි නියුක්ත ස්ත්‍රිය.)"],["p","ණෙය: භාගිනෙය්‍ය + ඊ = භාගිනෙය්‍යී (= ලේලි: සොහොයුරියගේ දූ.)"],["p","ණ : ගොතම + ඊ = ගොතමී (= ගෞතම ගොත්‍රයෙහි වූ ස්ත්‍රිය.)"],["p","**69. අධිකාර්ථයක් ප්‍ර‍කාශ කරනු කැමති විට තර - තම - යන ප්‍ර‍ත්‍යයන් යෙදිය යුතු. දෙදෙනකුගෙන් අධික ගුණැත්තා ප්‍ර‍කාශ කිරීමට තර - ප්‍ර‍ත්‍යය ද බොහෝ දෙනකුගෙන් අධික තැනැත්තා ප්‍ර‍කාශ කිරීමට තම - ප්‍ර‍ත්‍යය ද යෙදිය යුතු.**"],["p","පාප (= පාපියා: පවිටු.)"],["p","පාපතර (= වඩා පවිටු)"],["p","පාපතම (= අතිශයෙන් පවිටු)"],["p","හීන (= ලාමක වූ)"],["p","හීනතර (= වඩා ලාමක වූ)"],["p","හීනතම (= අතිශයෙන් ලාමක වූ.)"],["p","පණීතතර - පණීතතම ආදි නොයෙක් විශේෂණ පදයන් මෙසේ යොදාගත යුතු."]]},{"p":["මාගධො බිම්බිසාරො මහාරාජා ද්විසු අඞ්ග - මගධ රට්ඨෙසු ආධිපච්චං රජ්ජං කාරෙසි.","එකං සමයං ආයස්මා මහාකස්ස පත්‍ථෙරො ගෙලඤ්ඤෙන පීළිතො රාජගහතො අවිදූරෙ පිප්ඵලි ගුහායං විහාසි.","ආනන්‍දථෙරො භගවතො සාවකෙසු බාහුසච්චෙන ච පණ්ඩිච්චෙන ච මහනීයතරො අහොසි.","මෙධාවිනී මාණවී දුල්ලභං මනුස්සත්තං ලභිත්‍වා බහුං පුඤ්ඤං කාතු’මුස්සහති.","ගුණවතී නාමිකී සීලවන්තිං භික්ඛුනිං නිමන්තෙත්‍වා දානම’දාසි.","භගවති ධරමානෙ යෙව භික්ඛුසංඝො වෙපුල්ලං පාපුණි.","මෙධාවිනො ගරූනං ගාරවං කත්‍වා නානාසත්‍ථෙසු පාටවං ලභන්ති.","සච්චවාදී තපස්සිනො කදාචිපි, වාචාලා න හොන්ති.","තෙමිය කුමාරො අත්තනො පණ්ඩිච්චං පකාසෙතුං න ඉච්ඡි.","ධම්මාසොකමහාරාජා මොග්ගලිපුත්තතිස්සත්‍ථෙරං නිමන්තෙත්‍වා සහස්සකං නාමතතියං සංගීතිං කාරාපෙසි.","බුද්ධා නාම සාඨෙය්‍යෙන ආරාධෙතුං න සක්කා.","කතඤ්ඤුනො කදාචිපි සොහජ්ජං න නාසෙන්ති.","පාරිලෙය්‍යහත්‍ථිරාජා අන්තොවස්සෙ මාසත්තයං භගවතො වෙය්‍යාවච්චමකාසි.","සද්ධා කුලපුත්තා පණීතතරානි වත්‍ථභෙසජ්ජාදීනි භික්ඛුසංඝස්ස දෙන්ති.","රොගී වෙජ්ජෙන දින්නං භෙසජ්ජමුපසෙවිත්‍වා ආරොග්‍යං ලභිත්‍වා අත්තනො සොමනස්සං වෙජ්ජස්ස පකාසෙසි."],"s":["නුවණැත්තන් අතරෙන් අතිශයෙන් පිදිය යුතු සැරියුත් මහ තෙරුන් වහන්සේ රජගහ නුවරින් නුදුරු උපතිස්ස ගමෙහි විසූ සාරි බ්‍රාහ්මණියගේ පුත්‍ර‍යා වී ය.","දුර්ලභ වූ මනුෂ්‍යාත්මය ලැබූ නුවණැත්තන් විසින් බොහෝ පින් කටයුත්තාහ.","ශ්‍ර‍ද්ධාවත් නාවික ස්ත්‍රිය සිල්වත් තාපසයන් දැක වැන්දා ය.","චක්ඛුපාල ස්ථවිරයන් වහන්සේ පූර්‍වයේදී වෙදෙකුව ඉපිද එක් ස්ත්‍රියකගේ ඇස්වල ගෑමට බෙහෙතක් දුන්නේ ය.","ඇතැම් ගුණවත් කුලපුත්‍රයෝ තමන්ගේ දරුවන් ද භාර්‍ය්‍යාවන් ද මවුපියන් ද ධනය ද හැර කසාවත් හැඳ පැවිදි වෙති.","සිද්ධාර්ථ කුමාර තෙම තම නෑයන්ට තමාගේ දක්‍ෂභාවය පෙන්වා රාජ්‍යය ලැබුවේ ය.","සිල්වත් ගුණවත් කුලවත් යසෝධරා කුමරිය ඒ කුමාරයාගේ භාර්‍ය්‍යා බවට පැමිණියා ය.","සර්‍වඥයන් වහන්සේ ඇතුල් වස තුන්මසක් මුළුල්ලේ තව්තිසා දෙව්ලොවදී දෙවියන්ට ධර්‍ම දේශනා කළ සේක.","ගිලන් බවට පත් බිම්බිසාර රජතෙම ජීවක වෙදා විසින් දෙන ලද බෙහෙත් සේවනය කොට ආරෝග්‍ය ලැබ තමාගේ සොම්නස ප්‍ර‍කාශ කෙළේ ය.","නුවණැත්තෝ නොයෙක් ශාස්ත්‍ර‍යන් ඉගෙන නිපුණත්‍වය ලබත්.","මහාකාශ්‍යප ස්ථවිරයන් වහන්සේ රජගහනුවර සත්තපණ්ණි ගුහාවේදී පන්සීයේ සමූහය නම් වූ පළමුවැනි සඞ්ගායනාව කරවූ සේක.","අලසයා තමාගේ අලසබව නිසා කායික වූ ද මානසික වූ ද දුක් ලබයි.","දුටුගැමුණු මහරජ සියලු ලඞ්කාදීපයෙහි අධිපතිබව ලැබ යශස් - තේජස් ඇත්තෙක් ව සූවිසි වසක් රාජ්‍යය කරවීය.","මාලා ඇති මාණවිකාවෝ වාචාල වූ ේ රීතියෙන් ම “දුවිධ - දුවඞ්ග - දිරත්ත - දිගුණ - දිගු” ආදි තැන්හි ද්වි - ශබ්දයට දු - දි ආදේශ වෙති."],["p","**73. එක - ද්වි - ආදි ශබ්දයන් කෙරෙන් වූ පර දස - ශබ්දයේ අන්තයෙහි (සංඛ්‍යාපූරණාර්ථයෙහි) ඊ - ප්‍ර‍ත්‍යයක් ඇතැම් තැනක වේ. මේ ඊ - ප්‍ර‍ත්‍යයාන්ත ශබ්දය ඉත්‍ථිලිඞ්ගයෙහියි.**"],["p","එක + දස + ඊ = එකාදසී (එකොළොස්වක් තිථිය)"],["p","එකාදස යන්න සමාස පදයකි. ‘එකො ච දස ච = එකාදස’ යි ද්වන්‍ද සමාසයෙන් හෝ ‘එකකින් අධික වූ දසය’ යන අර්ථයෙහි තතියා තප්පුරිස සමාසයෙන් හෝ සිද්‍ධ කළ හැකි වේ."],["p","සමාසයේදී ද්වි - එක - අට්ඨ යන ශබ්දයන්ගේ අන්තයට ආකාරාදේශ වේ. (මෙයින් එක ශබ්දයේ අකාරයට ආකාරාදේශ වී යයි දත යුතු.) පුල්ලිඞ්ගයෙහි ‘එකාදසම’ කියා වේ."],["p","ද්වි + දස + ඊ = ද්වාදසී (= දොළොස්වක් තිථිය). ඉ."],["p","පංච + දස + ඊ = පංචදසී (= පසළොස්වක් තිථිය). ඉ."],["p","74. අනේකාර්ථයෙහි ද්වි-ශබ්දාදිය කෙරේ ක - ප්‍ර‍ත්‍යය වේ. (දෙකක් පමණක් නොව දෙකේ කොටස් රාශියක් විද්‍යමානවීම අනේකාර්ථයයි.) අන්‍ය සංඛ්‍යාවන් ගැන ද මෙසේ දතයුතු."],["p","ද්වි + ක = ද්වික (= දෙකේ සමූහය). පු. න."],["p","තික (= තුනේ සමූහය). පු. න."],["p","චතුක්ක (= හතරේ සමූහ). පු. න."],["p","පංචක (= පහේ සමූහය). පු. න."],["p","සතක (= සීයේ සමූහය). පු. න."],["p","සහස්සක (= දහසේ සමූහය). පු. න."],["h","2. භාව තද්‍ධිතය"],["p","75. එය ඔහුගේ ස්වභාවය යන අර්ථයෙහි තා - ත්ත - ත්තන - ණ්‍ය - ණෙය්‍ය යන ප්‍ර‍ත්‍යයෝ වෙති."],["r","තා :\tලහු + තා = ලහුතා (= සැහැල්ලු බව)"],["p","කතඤ්ඤු + තා = කතඤ්ඤුතා (= කෘතඥ බව.)"],["p","සූර + තා = සූරතා (= ශූර බව)"],["p","මුදු + තා = මුදුතා (= මෘදු බව)"],["r","ත්ත :\tමනුස්ස + ත්ත = මනුස්සත්ත (= මනුෂ්‍ය බව මිනිසත් බව)"],["p","යාචක + ත්ත = යාචකත්ත (= යාචක බව)"],["p","ගත + ත්ත = ගතත්ත (= ගිය බව)"],["r","ත්තන:\tපුථුජ්ජන + ත්නන = පුථුජ්ජනත්නන (= නූගත්"],["p","මිනිසාගේ ස්වභාව.)"],["p","ජායා + ත්තන = ජායාත්තන (= භාර්‍ය්‍යා බව.)"],["p","ජාර + ත්තන = ජාරත්තන (= සොරසැමි බව)"],["r","ණ්‍ය:\tආරොග + ණ්‍ය = ආරොග්‍ය (= නිරෝගි බව)"],["p","දුබ්බල + ණ්‍ය = දුබ්බල්‍ය (= දුර්‍වල බව)"],["p","(ණ් - කාරය වෘද්‍ධිය පිණිසයයි දත යුතු.)"],["p","**76. ණ්‍ය - ප්‍ර‍ත්‍යය යෙදුණු විට එයින් පූර්‍වයෙහි සිටි ව්‍යඤ්ජනයෝ ප්‍ර‍ත්‍යයෙහි යකාරය සමග නොයෙක් වෙනස්කම්වලට පැමිණෙති.**"],["p","ත් + ණ්‍ය = ත්‍ය යන්න ච්ච බවට පැමිණේ."],["p","ල් + ණ්‍ය = ල්‍ය යන්න ල්ල බවට පැමිණේ."],["p","ද් + ණ්‍ය = ද්‍ය යන්න ජ්ජ බවට පැමිණේ."],["p","ණ් + ණ්‍ය = ණ්‍ය යන්න ඤ්ඤ බවට පැමිණේ."],["p","ජ් + ණ්‍ය = ජ්‍ය යන්න ජ්ජ බවට පැමිණේ."],["p","ස් + ණ්‍ය = ස්‍ය යන්න ස්ස බවට පැමිණේ."],["p","**උදාහරණ :-**"],["p","පණ්ඩිත + ණ්‍ය = පණ්ඩිත්‍ය = පණ්ඩිච්ච (= පණ්ඩිත බව.) න."],["p","අධිපති + ණ්‍ය = ආධිපත්‍ය = ආධිපච්ච (= අධිපති බව). න."],["p","බහුසුත + ණ්‍ය = බාහුසත්‍ය = බාහුසච්ච (= බොහෝ ඇසූ දේ"],["p","ඇති බව, බහුශ්‍රැත බව.). න."],["p","මෙහි සුකාරයේ උකාරයට අකාරාදේශ වේ."],["p","කුසල + ණ්‍ය = කොසල්‍ය = කොසල්ල (= දක්‍ෂ බව) න."],["p","විපුල+ණ්‍ය=වෙපුල්‍ය = වෙපුල්ල (= මහත් බව, විපුලත්‍වය). න."],["p","සුහද + ණ්‍ය = සොහද්‍ය = සොහජ්ජ (මිත්‍ර‍ බව). න."],["p","සුමන+ණ්‍ය=සොමනස්ස (=යහපත් සිතේ ස්වභාව, සතුට) න."],["p","දුමන + ණ්‍ය = දොමනස්ස (= අයහපත් සිතේ ස්වභාව, දොම්නස). න."],["p","මේ අන්තිම දෙතැන්හි ශබ්දයන්ටත් ප්‍ර‍ත්‍යයන්ටත් මධ්‍යයෙහි මනෝ ගණයෙහි කී සකාරය ආගම වේ යයි දත යුතු."],["p","සමණ + ණ්‍ය = සාමණ්‍ය = සාමඤ්ඤ (= ශ්‍ර‍මණ බව). න."],["p","ගිලාන +ණ්‍ය = ගෙලන්‍ය = ගෙලඤ්ඤ (= ගිලන් බව, රෝගය). න."],["p","මෙහි ලා - යන්නේ ආකාරයට හ්‍ර‍ස්ව වේ."],["p","රාජ + ණ්‍ය = රාජ්‍ය = රජ්ජ (= රාජ්‍යය හෝ රජ බව). න. මෙහි"],["p","ද හ්‍ර‍ස්ව වේ."],["p","නිපුණ + ණ්‍ය = නෙපුණ්‍ය = නෙපුඤ්ඤ (= නිපුණ බව) න."],["p","එය ඔහුගේ කර්‍මය යනාර්ථයෙහි ද ණ්‍ය - ප්‍ර‍ත්‍යය වේ."],["p","භිසජ + ණ්‍ය = භෙසද්‍ය = භෙසජ්ජ (= බෙහෙත, වෙදාගේ ක්‍රියාව යන"],["p","අර්ථයි). න."],["p","**ණෙය්‍ය ප්‍ර‍ත්‍යය**"],["p","සුචි + ණෙය්‍ය = සොචෙය්‍ය (= පිරිසිදු බව). න."],["p","අධිපති + ණෙය්‍ය = ආධිපතෙය්‍ය (= අධිපති බව). න."],["p","සඨ + ණෙය්‍ය = සාඨෙය්‍ය (= කපටි බව). න."],["p","**77. පටු ගරු ආදි ශබ්දයන් කෙරෙන් ඔහුගේ බව යන අර්ථයෙහි ණ - ප්‍ර‍ත්‍යය වේ.**"],["p","}"],["p","උකාරයට"],["p","අවාදේශ වේ."],["p","පටු + ණ = පාටව (= දක්‍ෂ බව). න. පු."],["p","ගරු+ණ = ගාරව (= ගරු බව, ගෞරවය). පු."],["p","“පටුතා, ගරුතා” යි තා - ප්‍ර‍ත්‍යයෙන් ද පටුත්තං, ගරුත්තං” යි ත්ත - ප්‍ර‍ත්‍යයෙන් ද පද සිද්‍ධවෙති."]]},{"p":["“තස්ස ඛිපන්තස්ස නාසිකා අසිධාරාය පටිහතාද්විධා ඡිජ්ජි.” (අසිලක්ඛණ ජාතක)","“සහස්සක්ඛත්තුං ආත්තානං නිම්මිණිත්‍වාන පන්‍ථකො නිසීද’ම්බවනෙ රම්මෙ යාව කාලප්පවෙදනා.” (චුල්ලපන්‍ථක ධම්මපදට්ඨ කථා)","අහං ඛො පුබ්බෙ ආබාධිකො අහොසිං දුක්ඛිතො බාළ්හ ගිලානො ........ සොම්හි එතරහි තම්හා ආබාධා මුත්තො.” (දීඝ).","“මෙත්තා සහගතෙන චෙතසා එකං දිසං ඵරිත්‍වා විහරති, තථා දුතියං, තථා තතියං, තථා චතුත්‍ථං” (දීඝ)","“අධනානං ධනෙ අනනුප්පදීයමානෙ දාළිද්දියං වෙපුල්ලමගමාසි: දාළිද්දියෙ වෙපුල්ලං ගතෙ අදින්නාදානං වෙපුල්ලමගමාසි. දාළිද්දියෙ වෙපුල්ලං ගතෙ අදින්නාදානං වෙපුල්ලමගමාසි.” (දීඝ)","යථා තස්මිං ගෙහෙ ඨපෙත්‍වා මාණවකස්ස පල්ලඞ්කං අඤ්ඤං කිඤ්චි ආසනං න දිස්සති, තථා අධිට්ඨාසි. (විනයට්ඨකථා.)","“දෙවතා තස්ස නෙපුඤ්ඤං පකාසෙතුං මහාජනෙ ඡාදෙසුං පොත්‍ථකං සොපි ද්වත්තික්ඛත්තුම්පි තං අකා.” (මහාවංස)","“යො ච සමෙති පාපානි අණුං ථූලානි සබ්බසො සමිතත්තා හි පාපානං සමණොති පවුච්චති.” (ධම්මපද 265 ගා.)","“තතො පට්ඨාය යත්‍ථ යත්‍ථ පණ්ඩිත - සමණබ්‍රාහ්මණා අත්‍ථිති වදන්ති, තත්‍ථ තත්‍ථ ගන්ත්වා සාකච්ඡං කරොන්ති.","භො ගොතම අධිවාසෙසි මෙ අජ්ජතනාය භත්තං සද්‍ධිං භික්ඛුසංඝෙනාති. අධිවාසෙසි භගවා තුණ්හීභාවෙන.” (දීඝ)","(අ) “මලං වණ්ණස්ස කොසජ්ජං පමාදො රක්ඛතො මලං” (ආ) “එකස්ස චරිතං සෙය්‍යො නත්‍ථි බාලෙ සහයතා.”","“කුසො යථා දුග්ගතහිතො හත්‍ථමෙවානුකන්තති සාමඤ්ඤං දුප්පරාමට්ඨං නිරයායු’පකඩ්ඪති” (ධම්මපද)"],"s":["ණය නැති බව ජනපද වැසියන්ට මහත් සැනසීම පිණිස පවතී.","නිරෝගිබව උතුම් සැපයකැයි තථාගතයන් විසින් දේශනා කරන ලදි.","“ඉර උදා වන කල්හි තාගේ හිස සත්කඩක්ව පැළේවා” යි දේවල තාපස තෙම කීයේ ය.","අඥානයා තමාගේ අඥාන බව නොදනී; ඔහු හා මිත්‍ර‍ බව අන්‍යයන්ට අහිත පිණිස පවතී.","මුගලන් මහ තෙරුන් වහන්සේ සෘද්ධිමය ශරීරයක් මවාගෙන නාගයකු දමනය කළහ.","එක් කලක ගිලන් බැවින් මැඩුණු තථාගත තෙමේ චුන්‍දස්ථවිරතුමන් ලවා බොජ්ඣඞ්ග සූත්‍ර‍ය කියෙව්වේ ය.","දිළිඳු බව පැතිරගිය කල්හි අදින්නාදානය බහුල වෙයි. සොරකම බහුල වූ කල්හි අපරාධයෝ වැඩි වෙති.","චුල්ලපන්‍ථක ස්ථවිරතුමා ජීවක වෛද්‍යයාගේ අඹවනයේදී රහත් ව තමා හා සමාන රූප දහසක් මැවී ය.","දවසට තුන්වරක් තථාගතයන්ගේ උපස්ථානයට පැමිණි භික්‍ෂූන්ට නවාකාරයෙන් බෙදූ ධර්‍මය දෙසූහ.","පුරාතන සැවැත්නුවර වැසියෝ බොහෝ සේ ම තමන්ගේ මිත්‍ර‍යන් සමග සිත්කලු වූ ජේතවනාරාමයට ගොස් ධර්‍ම ශ්‍ර‍වණය කළහ.","බුද්‍ධඝෝෂාචාර්‍ය්‍යයන් පළමු කොට ‘විශුද්‍ධි මාර්ගය’ දෙවියන් ුං (= එක්වරක්). නි."],["r","ද්වික්ඛත්තුං (= දෙවරක්)\tතික්ඛත්තුං (= තුන්වරක්)"],["r","දසක්ඛත්තුං = (= දසවරක්)\tසතක්ඛත්තුං (= සියක් වරක්)"],["r","සහස්සක්ඛත්තුං (= දහස් වරක්)\tබහුක්ඛත්තුං (= බොහෝ වරක්)"],["p","**79. විභාගාර්ථයෙහි හෙවත් ආකාරයකින් යන අර්ථයෙහි එකාදිසංඛ්‍යා ශබ්දයන් කෙරෙහි ධා - ප්‍ර‍ත්‍යය වේ. එම අර්ථයෙහි අන්‍ය ශබ්දයන් කෙරෙන් සො - ප්‍ර‍ත්‍යයක් ද වේ.**"],["p","එක + ධා = එකධා (= එක් ආකාරයකින්). නි."],["p","ද්විධා (= දෙයාකාරයකින්) තිධා (= තුන් ආකාරයකින්.)"],["p","ඡධා, ඡද්ධා (= සයාකාරයකින්)"],["p","සහස්සධා (= දහස් ආකාරයකින්)"],["p","කතිධා (= කී ආකාරයකින් ?)"],["p","බහුධා (= බොහෝ ආකාරයෙන්)"],["p","පද + සො = පදසො (= පද වශයෙන්)"],["p","අත්‍ථසො (= අර්ථ වශයෙන්)"],["p","සබ්බසො (= සියලු ආකාරයෙන්)"],["p","හෙතුසො (= හේතු වශයෙන්)"],["p","ඨානසො (= කාරණා වශයෙන්)"],["p","බහුසො (= බොහෝ සෙයින්)"],["p","උපායසො (= උපාය වශයෙන්)"],["p","**80. A. සර්‍ව නාමයන් කෙරෙන් ‘ආකාරයෙන්’ යන අර්ථයෙහි ථා - ප්‍ර‍ත්‍යය වේ.**"],["p","ත + ථා = තථා (= එසේ ඒ ආකාරයෙන්)"],["p","යථා (= යම් සේ). සබ්බථා (= සියලු ආකාරයෙන්)"],["p","අඤ්ඤථා (= අන් ආකාරයකින්.) උභයථා (= දෙයාකාරයකින්)"],["p","B. කිං - ඉම - ශබ්දයන් කෙරෙන් ආකාරාර්ථයෙහි ථං - ප්‍ර‍ත්‍යය වේ."],["p","කිං + ථං = කථං (= කෙසේ) කි - ශබ්දයට කකාරාදේශ වේ."],["p","ඉම + ථං = ඉත්‍ථං (= මෙසේ) ඉමශබ්දයට ඉකාරාදේශ වේ."],["p","**81. ඇතැම් නිපාතයන් කෙරෙන් වීම් අර්‍ථයෙහි තන ප්‍ර‍ත්‍යය වේ.**"],["p","අජ්ජ + තන = අජ්ජතන (= අද; අද වූ)"],["p","පුරා + තන = පුරාතන (= පෙර වූ)"],["p","ස්වෙ + තන = ස්වාතන (= හෙට හෙට වන්නා වූ)"],["p","හීයො + තන = හීයතන (= ඊයේ වූ)"],["p","‘ස්වාතන’ යන තැන එකාරයට ආකාරාදේශ වේ. **හීයත්තන** යන තැන ඔකාරයට ආකාරාදේශ හා තකාරයට ද්විත්ව වේ. මේ ශබ්දයෝ තුන් ලිඟුවෙහි වරනැගිය හැකි වෙති."],["p","82. ස්ථානාර්‍ථය ප්‍ර‍කාශ කිරීම පිණිස සර්‍වනාමයන් කෙරෙන් ත්‍ර‍ - ත්‍ථ - හිං - හං යන ප්‍ර‍ත්‍යයෝ වෙති."],["p","ත + ත්‍ර‍ = තත්‍ර‍ (= එහි). ත + හිං = තහිං (= එහි)"],["p","ත + ත්‍ථ = තත්‍ථ (= එහි). ත + හං = තහං (= එහි)"],["p","ය ශබ්දය කෙරෙන් ද මේ ප්‍ර‍ත්‍යය සතර ම යෙදේ."],["p","කිං + ත්‍ර‍ = කුත්‍ර‍ (=කොහි). කිං + ත්‍ථ = කුත්‍ථ (= කොහි)"],["p","කිං + හිං = කුහිං (= කොහි). කිං + හං (කහං) (= කොහි)"],["p","තුන් තැනක කිං ශබ්දයට කු - ආදේශය ද එක් තැනක ක - ආදේශද වේ. අන්‍ය සර්‍වනාමයන් කෙරෙන් ත්‍ර‍ - ත්‍ථ දෙදෙන පමණක් යෙදෙති."],["p","සබ්බ + ත්‍ර‍ = සබ්බත්‍ර‍ (= සැම තැන)"],["p","සබ්බ + ත්‍ථ = සබ්බත්‍ථ"],["p","අඤ්ඤත්‍ර‍, අඤ්ඤත්‍ථ (= අන් තැනක)"],["p","ඉම + ත්‍ර‍ = අත්‍ර‍ (= මෙහි) ඉම + ත්‍ථ = අත්‍ථ (= මෙහි)"],["p","ඉම + ත්‍ථ = එත්‍ථ (= මෙහි)"],["p","ඉම + ශබ්දයට දෙතැනක අ - ආදේශ ද එක්තැනක එ - ආදේශ ද වේ."],["p","83. කාලාර්‍ථය ප්‍ර‍කාශ කිරීම පිණිස සර්‍වනාමයන් කෙරෙන් දා - දානි - දාචනං ප්‍ර‍ත්‍යයෝ වෙති."],["p","ය + දා = යදා (= යම් කලෙක); ත + දා = තදා (= එකල)"],["p","එක + දා = එකදා (= එක් කලෙක)"],["p","සබ්බ + දා = සබ්බදා (= හැම කල්හි)"],["p","කිං + දා = කදා (= කවදා)"],["p","ඉම + දානි = ඉදානි (= දැන්). ම - කාරය ලොප් වේ."],["p","කිං + දාචනං = කුදාචනං (= කිසි කලෙක)"],["p","**84. ස්ථානාර්‍ථයෙහි ඉම - ශබ්දය කෙරෙන් හ - ධ යන ප්‍ර‍ත්‍යයෝ වෙති. එවිට ඉම - ශබ්දයේ ඔකාරය ලොප් වේ.**"],["p","ඉම + හ = ඉහ (මෙහි). ඉම + ධ = ඉධ (= මෙහි)"]]},{"p":["“තදා සෙට්ඨිනො භරියා ගරුගබ්භා හොති, තස්මා සො සීඝං ගෙහං පුරිසං පෙසෙසි: ගච්ඡ, භණෙ ජානාහි තං විජාත වා නො වා ති.” (ධ. අ. ඝොසක)","“වෙගෙන ගෙහං ගන්ත්‍වා කාළිං නාම දාසිං පක්කොසිත්‍වා සහස්සං දත්‍වා ආහ; ගච්ඡ ඉමස්මිං නගරෙ උපධාරෙත්‍වා අජ්ජ ජාත - දාරකං ගණ්හිත්‍වා එහීති” (එම)","“ත්‍වං ඉමං නෙත්‍වා චක්කමග්ගෙ නිපජ්ජාපෙහි: ගොණා වා නං මද්දිස්සන්ති, චක්කා වා නං භින්‍දිස්සන්ති, පවත්තිඤ්චස්ස ඤත්වා ච ආගච්ඡෙය්‍යාසි.” (එම)","“අම්හො පුරිස, යස්ස ත්‍වං පාසාදස්ස ආරොහණාය නිස්සෙණිං කරොසි, ජානාසි තං පාසාදං පුරත්‍ථිමාය වා දිසාය, දක්ඛිණාය වා දිසාය, පච්ඡිමාය වා දිසාය, උත්තරාය වා දිසායාති.” (දීඝ නිකාය)","සෙය්‍යථාපි මහාරාජ පුරිසො ඉණං ආදාය කම්මන්තෙ පයොජෙය්‍ය, තස්ස තෙ කම්මන්තා සමිජ්ඣෙය්‍යුං: සො තතො නිදානං ලභෙථ පාමොජ්ජං අධිගච්ඡෙය්‍ය සොමනස්සං.” (එම)","“සෙය්‍යථාපි නාම සුද්‍ධං වත්‍ථං අපගතකාළකං සම්ම’දෙව රජනං පටිග්ගණ්හෙය්‍ය, එවමෙව යසස්ස කුලපුත්තස්ස තස්මිං යෙව ආසනෙ විරජං වීතමලං ධම්මචක්ඛුං උදපාදි.” (විනය මහාවග්ග)","“සො චෙ භික්ඛූනං සන්තිකෙ දූතං පහිණෙය්‍ය: අහං හි ගිලානො ආගච්ඡන්තු භික්ඛූ ඉච්ඡාමි භික්ඛූනං ආගත’න්ති, ගන්තබ්බං භික්ඛවෙ සත්තාහකරණීයෙන” (එම)","“ඉමානි භන්තෙ අසීති - ගාමික - සහස්සානි ඉධූ’පසං කන්තානි භගවන්තං දස්සනාය සාධුමයං භන්තෙ ලභෙය්‍යාම භගවන්තං දස්සනායාති.” (එම)","“සාධු දෙවො වාහනාගාරෙසු ද්වාරෙසු ච ආණාපෙතු:- යෙන වාහනෙන ජීවකො ඉච්ඡති, තෙන වාහනෙන ගච්ඡතු: යෙන ද්වාරෙන ඉච්ඡති තෙන ද්වාරෙන ගච්ඡතූති.” (එම)","“පටිගණ්හාතු මෙ දෙවො පොසාවනිකන්ති. අලං භණෙ, ජීවක තුය්හෙ’ව හොතු: අම්හාකඤ්ඤෙ’ව අන්තෙපුරෙ නිවෙසනං මාපෙහී”ති. (එම)"],"s":["මවක් ස්වකීය දරුවා යම් සේ රකී ද එමෙන් සියලු සත්‍වයන් කෙරෙහි මෛත්‍රිය පැතිරවිය යුතුයි.","නිරෝගී මිනිසකුට බෙහෙතින් ප්‍රයෝජන නැත්තාසේ බුදුරදුන්ට ගුරුවරයකුගෙන් ප්‍රයෝජනයක් නැත.","ඉදින් මව ළදරුවා හැර බණ අසන්ට විහාරයට යන්නී නම් ළදරුවා රැකීමට කිසිවෙක් ගෙහි නො වන්නේ ය.","පර්‍වතයක් උඩ සිට මිනිසකු බිම සිටි මිනිසුන් දක්නා සේ රහත්ඵලය ලැබූ භික්‍ෂුනම ලෝකය දෙස බල්නේ ය.","තරුණියන් සදෙන උදෑසන ගඟෙහි නා රජමෙහෙසිය වෙත මල් ගෙන ගිය හොත් එකිඑකියට රන්කාසිය බැගින් ලැබෙන්නේ ය.","ඉදින් වස්කාලය තුළදී දායකයෙක් ගිලන්ව භික්‍ෂුවක් දකිනු කැමැත්තේ දූතයකු යවන්නේ නම් ඒ භික්‍ෂුව ඔහු වෙත ආ යුතු ය.","“අපට බුදුන් දකින්ට ලැබේ නම් යෙහෙකැ” යි අසූදහසක් ගම්වැසියෝ ආනන්ද ස්ථවිරතුමාට කීහ.","ණය ගෙන වෙළඳාම් කරන පුරුෂයාගේ වෙළඳාම සමෘද්‍ධවන්නේ නම් හෙතෙම ඒ නිසා ප්‍රීතිය ලබන්නේ ය.","පිරිවර සහිතව යන රජු දැක රටවැසියෝ “අපගේ රජ බොහෝ කලක් ජීවත් වේවා” යි ඝෝෂණය කළහ.","මේ දරුවා ගෙන ගොස් ගවයන් ගාලෙන් නික්මෙන කල්හි ගාල ඉදිරියෙහි හොවව; ගවයෝ ඔහු පාගා මරන්නාහ”යි සිටුතෙමේ දාසියට කී ය."],"gp":[["අධිගච්ඡෙය්‍ය","ලබන්නේ ය."],["අපගතකාළක","පහව ගිය කළු ලප ඇති. 3."],["අම්හො","සමානයන්ට ආමන්ත්‍ර‍ නයට යොදන නිපාතයක්."],["ආගත","ඒම. න."],["ආරොහන","නැඟීම. න. (චතුත්‍ථි යෙන් ‘පිණිස’ අථීය ලැබේ.)"],["ඉණ","ණය. න."],["උදපාදි","උපන්නේ ය, පහළ විය."],["උපධාරෙත්‍වා","සොයාබලා. පූ. ක්‍රි."],["උපසඞ්කන්ත","එළඹුණු. 3."],["එති","එයි."],["කම්මන්ත","කර්‍මාන්තය. පු."],["පාමොජ්ජ","ප්‍රීතිය. න."],["පොසාවනික","පෝෂණය කිරීම ගැන දිය යුතු මුදල. න."],["මදදිස්සති","මඩින්නේය; පාගන්නේ ය."],["රජන","(රෙදි පොවන) සායම. න."],["ලභෙථ","ලබන්නේ ය."],["වාහන","නැගීයන රථාදිය. න."],["වාහනාගාර","වාහන තබන ගෙය. පු. න."],["විජාතා","වැදූ (ස්ත්‍රිය) වැදුවා. ඉ."],["ගරුගබ්භා","දරුගැබ් ඇත්තී. ඉ."],["ගාමික","ගම්වැසියා. පු."],["ඤත්වා","දැනගෙන. පූ. ක්‍රි."],["තතො නිද සත් කොටසකට බෙදෙත්."],["p","A සකර්‍මකධාතු නම් කර්‍මයක් ගන්නා වූ ධාතුයි. ‘පචති + පිසයි’ කීවිට පිසනු ලබන දෙයක් ඇතිවිය යුතු වේ. බත් හෝ අන් කිසිවක් පිසිය යුතු ය. ‘කරොති + කරයි’ කී විට ‘කර්‍මාන්තයක් කරයි’ නැතහොත් ‘ගෙයක් කෙරේ’ යි කර්‍මයක් ගැනීමෙන් අදහස පැහැදිලි වේ."],["p","B අකර්‍මකධාතු නම් කර්‍මයක් නොගන්නා වූ ධාතුයි. ‘සයති + නිදයි’ කී විට කර්‍මයක් ඕනෑ නොවේ. තිට්ඨති + සිටී, නිසීදති + හිඳී යනාදිය ද මෙසේයි. කවරෙක් නිදන්නේ ද? සිටී ද? හිඳී දැයි මේ ක්‍රියාවන්ගේ කර්‍තෘ පමණක් සෙවිය යුතු වේ. ඒ නිදීම් - සිටීම් - හිඳීම් ක්‍රියා කර්‍තෘගෙන් ඉවත අන් දෙයක් හෝ සත්‍වයකු කරා නොයත්, කර්‍තෘ කෙරෙහි රඳා සිටිත්, එහෙයින් අකර්‍මක නම් වෙති."],["p","පිසීම ක්‍රියාව කර්‍තෘ කෙරෙහි පමණක් නොපිහිටා අන්‍ය ද්‍ර‍ව්‍යයක් කරා ගමන් කරයි. එහෙයින් එවැනි ක්‍රියා සකර්‍මක නම් වෙති."],["p","**86. ධාතු ගණයන්ගේ වෙනස ඇති වන්නේ ධාතුවටත් (ක්‍රියා පදයක් සැදීම පිණිස) එය කෙරෙන් යොදන විභක්ති ප්‍ර‍ත්‍යයටත් අතරෙහි යෙදෙන තවත් ප්‍ර‍ත්‍යයකගේ වෙනස මුල් කොට ගෙන ය. ඒ අතරෙහි යෙදෙන ප්‍ර‍ත්‍යයන්ට විකරණ යයි නමක් වේ.**"],["p","1. භුවාදිගණයෙහි අ - විකරණය යෙදේ."],["p","2. රුධාදිගණයෙහි අ-ප්‍ර‍ත්‍යය හා ධාතුවගේ මුල් ස්වරයෙන් පසුව බින්දුවක් වේ."],["p","3. දිවාදිගණයෙහි ය - ප්‍ර‍ත්‍යය වේ."],["p","4. ස්වාදිගණයෙහි ණා - උණා - ණො තිදෙන වෙති."],["p","5. කියාදිය කෙරෙන් ණා - ප්‍ර‍ත්‍යය වේ."],["p","6. තනාදිය කෙරෙන් ඔ - යිර දෙදෙන වෙති."],["p","7. චුරාදිය කෙරෙන් එ - අය - දෙදෙන වෙති."],["p","මේවාට උදාහරණ 91 වැනි අඞ්කයේ පටන් දැක්වෙති."],["p","එක් ස්වරයකට වඩා ඇති ධාතූන්ගේ අන්තස්වරය නිතර ම මකා දමනු ලැබේ."],["p","87. ක්‍රියාපදයන් වරනැගීමේදී (1) අතීත, (2) අනාගත (3) වර්‍තමාන යන කාල තුනකට බෙදෙන බව පළමු පොතෙහි කියන ලදි. ඒ කාලත්‍ර‍ය හා ඊට සමීප වූ ද මිශ්‍ර‍ වූ ද කාලයන් ප්‍ර‍කාශ කිරීමට යෙදූ විභක්ති ප්‍ර‍ත්‍යයන්ගේ කොටස් අටක් වෙති. ඒවා නම් :-"],["r","1. වත්තමානා\t5. පරොක්ඛා"],["r","2. පඤ්චමී\t6. අජ්ජතනී"],["r","3. සත්තමී\t7. භවිස්සන්තී"],["r","4. හීයත්තනී\t8. කාලාතිපත්තී යනු මොහුයි."],["p","මේ අට අතරෙන් අමිශ්‍ර‍ වර්‍තමාන කාලය ප්‍ර‍කාශ කිරීම සඳහා වත්තමානා විභක්තිය ද, අමිශ්‍ර‍ අතීත කාලය ප්‍ර‍කාශ කිරීම සඳහා හීයත්තනී, අජ්ජතනී දෙක ද අමිශ්‍ර‍ අනාගතය ප්‍ර‍කාශ කිරීම සඳහා භවිස්සන්තී විභක්තිය ද යොදනු ලැබේ."],["p","පඤ්චමී විභක්තිය :- අණ කිරීමෙහි ද ප්‍රාර්‍ථනය කිරීමෙහි ද කාලනියමයක් නැතිව වේ. (මෙය ඉංග්‍රීසියේ Imparative mood subjunctive mood දෙකින් මිශ්‍ර‍ව පවතී.) අණකිරීමෙහි හෙවත් විධානයෙහි පවතින විට Imparative යයි ද ප්‍රාර්‍ථනයෙහි වැටෙන විට subjunctive යයි ද දත යුතු."],["p","සත්තමී විභක්තිය :- අනුමත කිරීෟමෙහි ද කල්පනය කිරීමෙහි ද කාලනියමයක් නැතිව වේ."],["p","තමාගේ ඇස් හමුවෙහි ‘සිදුනොවූ අතීතයෙහි සිද්‍ධ වූ ක්‍රියාවක් ප්‍ර‍කාශ කිරීම සඳහා පරොක්ඛා විභක්තිය යොදනු ලැබේ. ‘පපච = පිසුවේලු: ජගාම = ගියේලු’ යනාදියයි."],["p","යම්කිසි ක්‍රියාවකගේ සිද්ධියට බාධාවක් ඇති වූ කල්හි අතීතයෙහි හෝ අනාගතයෙහි කාලාතිපත්තී විභක්තිය වේ. ‘අරක්කැමියා කල් නොයවා බත පිසුවේ නම් මම ගියෙමි = සචෙ සූදො කාලක්ඛෙපමකත්‍වා ඔදනං අපචිස්සා අහං අගමිස්සං’ යන තැන ‘අපචිස්සා, අගමිස්සං’ යන දෙක කාලාතිපත්තියට උදාහරණයි. (මෙහි සිංහල භාෂාරීතියට අනුව ‘මම ගියෙමි’ යන්නට ‘මට යන්ට හැකිව තිබුණේය’ යි යෙදීම වඩා ගැළපේ.)"],["p","88. සියලු ක්‍රියාපද කර්‍තෘකාරක - කර්‍මකාරක යන දෙ කොටසකට බෙදෙත්."],["p","නාරී භත්තං පචති (= ස්ත්‍රිය බත පිසයි.)"],["p","යන තැන ‘නාරී’ යන කර්‍තෘපදය ප්‍ර‍ධාන වේ; එය බලාගෙන ක්‍රියාව එකවචනයෙන් සිටී. එය කර්‍තෘකාරකයෙහියි."],["p","නාරියා ඔදනා පච්චන්ති (ස්ත්‍රිය විසින් බත් තුමූ පිසනු ලැබෙත්.) යන තැන ඔදනා යන කර්‍මපදය ප්‍ර‍ධාන වන බැවින් ක්‍රියාව එයට අයත් සංඛ්‍යාව ගනී. එය කර්‍මකාරකයෙහියි."],["p","89. වත්තමානාදි ආඛ්‍යාත විභක්ති කොටස් අට මෙසේයි :-"],["p","**1. වත්තමානා**"],["p","ති - අන්ති - සි - ථ - මි - ම, තෙ - අන්තෙ - සෙ - ව්හෙ - එ - ම්හ."],["p","**2. පඤ්චමී**"],["p","තු - අන්තු - හි - ථ - මි - ම, තං - අන්තං - ස්සු - ව්හෙ - එ - ආමසෙ."],["p","**3. සත්තමී**"],["p","එය්‍ය - එය්‍යුං - එය්‍යාසි - එය්‍යාථ - එය්‍යාමි - එය්‍යාම,"],["p","එත - එරං - එථො - එය්‍යව්හො - එය්‍යං - එය්‍යාම්හෙ"],["p","**4. හීයත්තනී**"],["p","ආ - ඌ - ඔ - ත්‍ථ - අ - ම්හා, ත්‍ථ - ත්‍ථුං - සෙ - වහං - ඉං - ම්හසෙ"],["p","**5. පරොක්ඛා**"],["p","අ - උ - එ - ත්‍ථ - අ - ම්හ, - ත්‍ථ - රෙ - ත්‍ථො - ව්හො - ඉ - ම්හෙ."],["p","**6. අජ්ජතනී**"],["p","ඊ - උං - ඔ - ත්‍ථ - ඉං - ම්හා, ආ - ඌ - සෙ - ව්හං - අ - ම්හෙ"],["p","**7. භවිස්සන්තී**"],["p","ස්ස ුව සකර්‍මක වේ. එවිට කර්‍මකාරකයෙහිත් යෙදිය හැක. (උපසර්ගයන් පිළිබඳ විස්තරයක් මේතාක් නොදක්වන ලද බැවින් උපසර්ගයන් මුල් කොට ඇති භූ ධාතුව පිළිබඳ කර්‍ම කාරක පද පසුව දක්වන්නෙමු.)"],["p","**92. පඤ්චමී (ආශිංසනයෙහි)**"],["p","(I) කර්‍තෘකාරක"],["p","**A. පරස්ස පද**"],["r","එකවචන\tබහුවචන"],["r","පඨම : භවතු (=වේවා)\tභවන්තු (= වෙත්වා)"],["r","මජ්ඣිම : භව, භවාහි (=වෙහිවා)\tභවථ (=වව්වා)"],["r","උත්තම : භවාමි (= වෙම්වා)\tභවාම (=වෙමුවා)"],["p","(එක් තැනෙක්හි විභක්තියට ලොප් වේ.)"],["p","**B. අත්තනො පද**"],["r","පඨම + භවතං (= වේවා)\tභවන්තං (= වෙත්වා)"],["r","මජ්ඣිම : භවස්සු (=වෙහිවා)\tභවව්හො (= චව්වා)"],["r","උත්තම : භවෙ (= වෙම්වා)\tභවාමසෙ (= වෙමුවා)"],["p","**93. සත්තමී (පරිකල්පයෙහි)**"],["p","කර්‍තෘකාරක"],["p","A පරස්ස පද"],["r","පඨම : භවෙය්‍ය (=වන්නේ නම්)\tභවෙය්‍යුං (=වන්නාහු නම්)"],["r","මජ්ඣිම : භවය්‍යාසි (=වන්නෙහි නම්)\tභවෙය්‍යාථ"],["p","(= වන්නහු නම්)"],["r","උත්තම : භවෙය්‍යාමි (=වන්නෙම් නම්)\tභවෙය්‍යාම"],["p","(= වන්නෙමු නම්)"],["p","**B අත්තනොපද**"],["r","පඨම: භවෙථ (= වන්නේ නම්)\tභවෙරං (= වන්නාහු නම්)"],["r","මජ්ඣිම: භවෙථො (= වන්නෙහි නම්)\tභවෙය්‍යව්හො"],["p","(= වන්නහු නම්)"],["r","උත්තම: භවෙය්‍යං (= වන්නෙම් නම්)\tභවෙය්‍යාම්හෙ"],["p","(= වන්නෙමු නම්)"]]},{"p":["කොසම්බකසෙට්ඨි රාජකුලං ගච්ඡන්තො රාජනිවෙසනතො ආගච්ඡන්තං පුරොහිතං දිස්වා: ‘කිං ආචරිය, අජ්ජ තෙ නක්ඛත්ත යොගො ඔලොකිතො’ ති පුච්ඡි. (ධ. අ. ඝෝසකවත්‍ථු)","“ආම, මහාසෙට්ඨි, ඉමස්මිං නගරෙ අජ්ජ ජාතදාරකො ජෙට්ඨකසෙට්ඨි භවිස්සතී”ති පුරොහිතො ආහ.","“සෙට්ඨි, සචෙ මෙ ධීතා ජායිස්සති, තාය නං සද්‍ධිං නිවාසෙත්‍වා සෙට්ඨිට්ඨානස්ස සාමිකං කරිස්සාමි: සචෙ මෙ පුත්තො ජායිස්සති, මාරෙස්සාමි න’න්ති චින්තෙත්‍වා ගෙහෙකාරෙසි.” (එම)","“ඉමස්මිං අසති මම පුත්තො’ව සෙට්ඨිට්ඨානං ලභිස්සති, ඉදානෙ’වෙ’තං මාරෙතුං වට්ටතීති වින්තෙත්‍වා කාළිං ආමන්තෙත්‍වා ගච්ඡ, ජෙ, වජතො ගුන්නං නික්ඛමණවෙලාය ඉමං තිරියං නිපජ්ජාපෙහි..... මද්දිතාමද්දිතභාවං පන’ස්ස ඤත්‍වා එහී’ති ආහ” (එම)","“සචායං භික්ඛවෙ රාජා පිතරං ධම්මිකං ධම්මරාජානං ජීවිතා න වොරොපෙස්සථ, ඉමස්මිං යෙව ආසනෙ විරජං වීතමලං ධම්මචක්ඛුං උප්පජ්ජිස්සථ” (සාමඤ්ඤඵලසුත්ත)","“සචෙ හි අයං පඨමවයෙ භොගෙ අඛෙපෙත්‍වා කම්මන්තෙ පයොජයිස්සා, ඉමස්මිං යෙව නගරෙ අග්ගසෙට්ඨි අභවිස්සා: සචෙ පන නික්ඛමිත්‍වා සබ්බජිස්ස, අරහත්තං පාපුණිස්ස.” (මහාධන සෙට්ඨිපුත්ත. ධ. අ.)","“සචෙ පච්ඡිමවයෙ භොගෙ අඛෙපෙත්‍වා කම්මන්තෙ පයොජයිස්ස. තතියකසෙට්ඨි අභවිස්ස: භරියාපි’ස්ස සොතාපත්තිඵලෙ පතිට්ඨහිස්ස.” (එම) 7. අයමඞ්ගුලිමාලස්ස මාතා අඞ්ගුලිමාලං ආනෙස්සාමීති ගච්ඡති, සචෙ සමාගමිස්සති අඞ්ගුලිමාලො අඞ්ගුලිසහස්සං පූරෙස්සාමීති මාතරං මාරෙස්සති, සචා’හං න ගමිස්සාමි මහාජානිකො අභවිස්ස.” - සත්තවස්සානි භගවන්තං අනුබන්‍ධිං පදා පදං ඔතාරං නාධිගච්ඡිස්සං සම්බුද්‍ධස්ස සතීමතො.” (සංයුත්තනිකාය)","“සො සංඛපාලභුජගො විසවෙගවා’පි සීලස්ස හෙදනභයෙන අකුප්පමානො ඉච්ඡං සදෙහ - භරවාහිජනෙ දයාය ගන්තුං සයං අපදතාය සුසොච නූනං.” (හත්‍ථවනගල්ල විහාරවංස)"],"s":["රජගහනුවර ප්‍ර‍ධාන සිටාණන්ගේ පුත්‍ර‍යා මත්පැන් බී අසූකෙළක් ධනය වියදම්කොට මහලු කාලයේදී යාචකයෙක් වී අනුන් දුන් ආහාරයෙන් ජීවිකාව කොට මියගියේ ය.","ඉදින් ඔහු මධ්‍යම වයසේදී පැවිදි වී නම් අනාගාමියෙක් වෙන්ට තිබුණි. ඒ වයසේදී කර්‍මාන්තයන් යෙදෙව්වේ නම් ඒ නුවර දෙවෙනි සිටුතනතුර ලබන්ට තිබුණි.","අඞ්ගුලිමාල නම් සොරා බොහෝ මිනිසුන් මරා ඇඟිලි කපා තබා සර්‍වඥයන් වහන්සේගේ ද ඇඟිලි කපනු කැමතිව උන්වහන්සේ ලුහුබැඳ ගියේ ය.","පසුව හෙතෙම බුදුන්ගේ බණ අසා පැවිදිව රහත්ඵලය ලැබුවේය. ඔහුට තථාගතයන් වහන්සේ හමුනොවී නම් මරණින් මත්තෙහි අපායෙහි උපදින්ට තිබුණේ ය.","අජාතසත්තු රජ තම පියා නොමැරුවේ නම් සර්‍වඥයන් වහන්සේගෙන් බණ ඇසූ දවසෙහි සෝවාන් ඵලය ලබන්ට තිබුණි.","ජෝර්ජ් මහ රජුගේ වැඩිමහලු පුත්‍ර‍යා ලක්දිවට පැමිණි කල්හි ලක්වැසියෝ ‘කුමාරයා බොහෝ කලක් ජීවත් වේවා’යි ආශිර්වාද කළහ.","සිටුතෙම තමාගේ මිත්‍ර‍ වූ කුම්භකාරයා වෙතට ගොස් “මේ දහස ගෙන මගේ එක් වැඩක් කරව” යි කීය.","පසුදා හෙතෙම ඝෝෂකයා කැඳවා, “දරුව, ඊයේ මා විසින් කුඹලාට එක් වැඩක් අණ කරන ලදි. තෝ ඔහු සමීපයට ගොස් “මාගේ පියා අණකළ වැඩය කරව” යි කියව” යි ඔහු කුඹල් ගෙට යැවී ය.","සිටාණන්ගේ අනික් පුත්‍ර‍යා එහි යන ඝෝෂකයා දැක ‘සොහොයුර, කොහේ යෙහි දැ” යි අසා “මේ ළමයි බෝල සෙල්ලම් කොට මා පැරදවූහ. උඹ ඔවුන් පරදවාපන්නැ” යි කී ය.","ඝෝෂකයා දවල් ක්‍රීඩා කොට හවස ගෙට ගිය කල්හි ‘කිමෙක් ද? නොගියෙහි දැ” යි සිටාණන් විසින් විචාරන ලද්දේ බාල සොහොයුරා එහි ගිය බව කීවේ ය."],"gp":[["අකුප්පමාන","නොකිපෙමින්"],["අඛෙපෙත්‍වා","ක්‍ෂය නොකොට අවසන් නොකොට පූ. ක්‍රි."],["අග්ගසෙට්ඨි","ප්‍ර‍ධාන සිටාණෝ. ප ෙ\t(= වන්නෙමු)"],["p","**98. කාලාතිපත්තී**"],["p","I කර්‍තෘකාරක"],["p","A පරස්ස පද"],["r","**එකවචන**\t**බහුවචන**"],["r","පඨම :\tඅභවිස්ස, අභවිස්සා,\tඅභවිස්සංසු, භවිස්සංසු, (= වූහ)"],["p","භවිස්ස (= විය)"],["r","මජ්ඣිම:\tඅභවිස්සෙ, භවිස්සෙ,\tඅභවිස්සථ, භවිස්සථ, (= වූවහු)"],["p","(= වූයෙහි)"],["r","උත්තම:\tඅභවිස්සං, භවිස්සං,\tඅභවිස්සම්හ, භවිස්සම්හ,"],["r","(= වීමි)\tඅභවිස්සම්හා (= වීමු)"],["p","(හෙතෙම කණෙක් නොවූයේ නම් රජවිය යනාදි වශයෙන් ක්‍රියාවගේ සිද්‍ධනොවීමක් ඇති කල්හි කාලාතිපත්තිය යෙදෙන බව දත යුතු)"],["p","**B අත්තනො පද**"],["r","**එකවචන**\t**බහුවචන**"],["r","පඨම:\tඅභවිස්සථ (= වීය)\tඅභවිස්සිංසු\t(= වූහ)"],["r","මජ්ඣිම:\tඅභවිස්සසෙ (= වූයෙහි)\tඅභවිස්සව්හෙ (= වූවහු)"],["r","උත්තම:\tඅභවිස්සං (= වීමි)\tඅභවිස්සාම්හසෙ (= වීමු)"],["p","මෙහි පරස්ස පදයෙහි ඇතැම් තැනක ස්සා - විභක්තියට හ්‍ර‍ස්ව වේ. ස්සෙ - විභත්තියට ස්ස = යනාදේශ වේ; ස්සම්හා = විභත්තියට ද හ්‍ර‍ස්ව වේ. ඇතැම් තැනක ධාතුවට මුලින් අකාරාගමය නොවේ. භවිස්සන්තී කාලාතිපත්තී දෙක්හි සැම තැන ම ඉ - කාරාගමය පෙනේ."],["p","කාලාතිපත්තිය බොහෝ සේ අතීතයෙහි යෙදෙතත් ඇතැම් විට අනාගතාර්‍ථයෙහි ද යෙදේ. “සචෙ ආනන්‍ද, නාලභිස්ස මාතුගාමො තථාගතප්පවෙදිතෙ ධම්මවිනයෙ අගාරස්මා අනගාරියං පබ්බජ්ජං චිරට්ඨිතිකං ආනන්‍ද, බ්‍ර‍හ්මචරියං අභවිස්ස” (= ආනන්‍දය, ඉදින් ස්ත්‍රිය, තථාගතයන් වහන්සේ දෙසූ ධර්‍මවිනයෙහි ගිහිගෙන් නික්ම යෑම වූ ප්‍ර‍ව්‍ර‍ජ්‍යාව නොලැබුවා නම්, ආනන්‍දය, මේ බ්‍ර‍හ්මචර්‍ය්‍යාව බොහෝ කලක් පවතින්නේ ය.) යන්න උදාහරණයි."],["p","මෙහි අලභිස්ස, අභවිස්ස යන ක්‍රියා දෙක කාලාති පතිත්තියෙහි’යි. පළමු ක්‍රියාව අතීතාර්‍ථයෙහි වැටේ. දෙවැනි ක්‍රියාව අනාගතාර්‍ථයෙහි යි. ස්ත්‍රීපක්‍ෂය ශාසනයෙහි ප්‍ර‍ව්‍ර‍ජ්‍යාව නොලැබුවේ නම් ශාසන බ්‍ර‍හ්මචර්‍ය්‍යාව (දැන් පවතිනවාට) වැඩිකලක් පවතින්නේ යයි සර්‍වඥයන් වහන්සේ වදාළහ. මෙය කියන විට ප්‍ර‍ව්‍ර‍ජ්‍යාව ලබා තිබුණ බැවින් අලභිස්ස යන්න අතීතයෙහියි; බ්‍ර‍හ්මචර්‍ය්‍යාවගේ විනාශය ඒතාක් සිදු නොවූ බැවින් අනාගතයෙහි සිදුවන කාරණයක් අභවිස්ස යන්නෙන් ප්‍ර‍කාශ කරන ලදි."]]},{"p":["“සුරාමෙරයපානඤ්ච යො නරො අනුයුඤ්ජති, ඉධෙ’වමෙ’සො ලොකස්මිං මූලං ඛණති අත්තනො (ධම්මපද)","‘භන්තෙ, ඉමං උදකං දාරකස්ස සීසෙ ආසිඤ්චාමී”ති පුච්ඡිත්‍වා තෙන ‘සිඤ්චථා’ති වුත්තෙ තථා කරිංසු. දෙවතා තාව දෙවතං මුඤ්චිත්‍වා ලෙණද්වාරෙ අට්ඨාසි.” (ධම්මපදට්ඨ කථා)","“මුහුත්තම්පි චෙ විඤ්ඤූ පණ්ඩිතං පයිරුපාසති ඛිප්පං ධම්මං විජානාති ජිව්හා සූපරසං යථා” (ධම්මපද)","“අථ පාපානි කම්මානි, කරං බාලො න බුජ්ඣති.” (එම)","“න කහාපණවස්සෙන තිත්ති කාමෙසු විජ්ජති.” (එම)","“ධුනාති පාපකෙ ධම්මෙ දුමපත්තං ව මාලුතො.” (ථෙරගාථා එකක.නි.)","“පූතිමච්ඡං කුසග්ගෙන යො නරො උපනය්හති, කුසා’පි පූතිං වායන්ති, එවං බාලුපසෙවනා” (සත්තිගුම්බ ජාතක)","“යො ච පුබ්බෙ පමජ්ජිත්‍වා පච්ඡා සො නප්පමජ්ජති, සො ඉමං ලොකං පභාසෙති අබ්භා මුත්තොව චන්‍දිමා” (ධම්මපද)","“කො සුජ්ඣති, මුච්චති, බජ්ඣති ච ? කෙන’තත්නා ගච්ඡති බ්‍ර‍හ්මලොකං ?” (සුත්ත නිපාත)","“එකො’ව ඉන්‍දො අසුරෙ ජිනාති, එකො’ව සෙනො හන්ති දිජෙ පසය්හ” (තච්ඡසූකර ජා.)","අරඤ්ඤෙ කොට්ඨකෙ බන්‍ධිත්‍වා මිගෙ රුන්‍ධිත්‍වා මාරෙත්‍වා මංසං වික්කිණිත්‍වා ජීවන්තා ලුද්දකා අනාගතෙ සුඛං න වින්‍දන්ති.","“සචෙ භවං සොණදණ්ජො සමණං ගොතමං දස්සනාය උපසංකමිස්සති, භොතො සොණදණ්ඩස්ස යසො හායිස්සති.”"],"s":["යමෙක් සිල් රැකීමෙහි යෙදේ නම් හෙමෙ මරණින් මත්තෙහි දෙව්ලොව ඉපිද දිව්‍ය සම්පත් ලැබ නන්‍දනවනාදියෙහි ක්‍රීඩා කරන්නේ ය.","සසර දුකින් මිදෙනු කැමැත්තෝ කෙලෙසුන් හා යුද්‍ධ කොට ජයගෙන ආර්‍ය්‍ය සත්‍යයන් අවබෝධ කරත්.","යම් කෙනෙක් බුදුන් සමීපයට පැමිණෙත් නම් ඔවුහු එතුමන්ගෙන් බණ අසා කෙලෙසුන් කම්පාකොට මාර්‍ගඵලයන් ලබන්ට සමර්‍ථ වෙති.","සත්වයන් කෙරෙහි නිතර මෛත්‍රිය පතුර වන්නේ නම් හෙතෙම සැම කල්හි සැමතන්හි සැපයට පැමිණේ.","අඥානයා බොහෝ කලක් පණ්ඩිතයන් ආශ්‍ර‍ය කරන්නේ ද ධර්‍මය ඉගෙන ගන්ට අසමර්‍ථ වේ. සැන්ද ව්‍යඤ්ජන රසය දැනගන්ට අසමර්‍ථ වන්නාක් මෙනි.","අනාගතයෙහි සැප විඳිනු කැමැත්තෝ කොටු බැඳ සතුන් හිර කොට උන් මරා මස්, විකුණා ජීවත් වීමට කැමැති නො වෙත්.","වාතය ගස්වල අතු හා කොළ කම්පාකරන්නා සේ යෝගී තෙමේ තමාගේ සිතෙහි උපන් ක්ලේශයන් කම්පාකරයි.","නගර සෝභිනිය තමා වැදූ පුතා කුල්ලක දමා ගෙනගොස් කසළ ගොඩක දමවයි දාසියට අණකළා ය.","සීවලී තෙරණුවෝ පෙර භවයකදී නුවරක් වටලා සත් අවුරුදු සත් වසක් මුළුල්ලේ එහි මිනිසුන් හිර කළ බැවින් මවුකුසින් බිහිවන්ට නොහැකිව බොහෝ දුක් වින්දාහ.","සංඛපාල නාරජ වැද්දන් විසින් අල්වා බැඳ ගෙනයනු ලබන්නේ උන් කෙරෙහි අනුකම්පාව නිසා තමාට පයින් යන්ට නොහැකිවීම ගැන ශෝකකෙළේලු.","මත්පැන් බීමෙහි යෙදෙන්නා මෙලොවදී ම ධනහානියට ද දුකට ද පැමිණේ.","යමෙක් කුසල් කි ාව අල්ප ය."],["p","**99. රුධාදි ගණයට අයත් විකරණය ‘o - අ’ (නිග්ගහීත පූර්‍ව අකාරය) යි දක්වන ලදි. වත්තමානාදි විභක්ති ප්‍ර‍ත්‍යයන් හැම ගණයට ම සාධාරණ බැවින් මෙහි ඒ ඒ ගණයන්ට අයත් ධාතූන් හා විකරණයන් යෙදීමෙන් සිද්‍ධ වන පද කීපය බැගින් දක්වනු ලැබේ.**"],["p","රුධි (අවහිර කිරීමෙහි) o - අ = රුන්‍ධ + ති = රුන්‍ධති"],["p","(අවහිර = කරයි. බින්දුව ධාතුවේ මුල් ස්වරය සමීපයට යේ.)"],["p","බධ (බැඳීමෙහි) + o - අ = බන්‍ධ + ති = බන්‍ධති (බඳී)"],["p","විද (විඳීමෙහි) + o - අ = වින්‍ද + ති = වින්‍දති (විඳී)"],["p","යුජ (යෙදීමෙහි) + o - අ = යුඤ්ජ + ති = යුඤ්ජති (යෙදේ)"],["p","භුජ (අනුභව කිරීමෙහි) + o - අ = භුඤ්ජති + ති = භුඤ්ජති (අනුභව කරයි)"],["p","**100. දිවාදි ගණයෙහි ය - විකරණය යෙදේ. ඒ ය - ප්‍ර‍ත්‍යය ධාත්‍වන්තය සමග නොයෙක් විට විකාරයට පැමිණේ. දීර්ඝ ස්වරාන්ත ධාතුවකින් පසුව යෙදුණු විට පමණක් වෙනස් නොවී සිටී.**"],["p","ධ් + ය = ජ්ඣ = බවට ද"],["p","ස් + ය = ස්ස = බවට ද"],["p","ව් + ය = බ්බ = බවට ද පැමිණෙති."],["p","දිවු (ක්‍රීඩා කිරීමෙහි) + ය = දිබ්බ + ති = දිබ්බති (ක්‍රීඩා කෙරේ.)"],["p","යුධ (යුද්ධ කිරීමෙහි) + ය = යුජ්ඣ + ති = යුජ්ඣති (යුද්ධ කෙරේ)"],["p","බුධ (අවබෝධයෙහි) + ය = බුජ්ඣ + ති = බුජ්ඣති (අවබෝධ කෙරේ.)"],["p","දුස (කිපීමෙහි) + ය = දුස්ස + ති = දුස්සති (කෝප වේ)"],["p","ගා (ගී කීමෙහි) + ය + ති = ගායති (ගායනා කෙරේ.)"],["p","ඣා (කල්පනයෙහි) + ය + ති = ඣායති (කල්පනා කරයි)"],["p","**101. ස්වාදි ගණයෙහි ණා - උණා - ණො විකරණයෝ වෙති.**"],["p","සු (ඇසීමෙහි) + ණා + ති = සුණාති (අසයි)"],["p","ප + අප (පැමිණීමෙහි) + උණා + ති = පාපුණාති (පැමිණේ)"],["p","ප = උපසර්ගය මුලින් සිටී."],["p","ආ + චු (ඇමිණීමෙහි) + ණා + ති = ආවුණාති (අමුණයි)"],["p","සක්ක (හැකි) + උණා + ති = සක්කුණාති (හැකි වේ)"],["p","සු + ණො + ති = සුණොති (අසයි)"],["p","**102. කියාදි ගණයෙහි ණා = විකරණය වේ.**"],["p","කි (ගනුදෙනු කිරීමෙහි) + ණා + ති = කිණාති (මිලට ගනී)"],["p","ජි (ජය ගැන්මෙහි) + ණා + ති = ජිනාති (දිනයි)"],["p","ධු (කම්පා කිරීමෙහි) + ණා + ති = ධුනාති (කම්පා කෙරේ)"],["p","ඤා (දැනීමෙහි) + ණා + ති = ජානාති (දනී : දැනගනී)"],["p","ඤා - හට ජා ආදේශ වේ."],["p","අස (කෑමෙහි) + ණා + ති = අස්නාති (අනුභව කරයි)"],["p","මි (මැණීමෙහි) + ණා + ති = මිණාති (මණියි)"],["p","ගහ (ගැන්මෙහි) + ණා + ති = ගණ්හාති (ගණියි.)"],["p","මෙහි හ - කාර ණ - කාරයෝ මාරුවෙති."],["p","**103. තනාදිය කෙරෙන් ඔ - යිර දෙදෙන වෙති. යිර - ප්‍ර‍ත්‍යය කලාතුරකින් ඇතැම් ධාතුවකින් පමණක් යෙදේ.**"],["p","තනු (පැතිරවීමෙහි) + ඔ + ති = තනොති (පතුරුවයි)"],["p","කර (කිරීමෙහි) + ඔ + ති = කරොති (කරයි)"],["p","මන (සිතීමෙහි) + ඔ + ති = මනොති (සිතයි)"],["p","ප + අප (පැමිණීමෙහි) + ඔ + ති = පප්පොති (පැමිණේ)"],["p","කර + යිර + ති = කයිරති (කරයි). ධාතුවේ රකාරය ලොප් වේ."],["p","**104. චුරාදිය කෙරෙන් එ - අය දෙදෙන වෙති. ඒ දෙදෙන නිසා ධාතුවේ මුල් ස්වරයට වෘද්ධි ද වේ. මුල් ස්වරයෙන් පසුව බැඳි අකුරක් වේනම් වෘද්ධි නොවේ.**"],["p","චුර (සොරකමෙහි) + එ + ති = චොරෙති"],["p","චුර + අය + ති = චොරයති (සොරකම් කරයි)"],["p","ගුප (රැකීමෙහි) + එ + ති = ගොපෙති (රකියි)"],["p","ඡඩ්ඩ (ඉවත දැමීමෙහි) + එ + ති = ඡඩ්ඩෙති (ඉවත දමයි)"],["p","කථ (කීමෙහි) + එ + ති = කථෙති (කියයි)"],["p","දිස (දැක්වීමෙහි) + එ + ති = දෙසෙති (දේශනා කරයි)"]]},{"p":["“සචෙ භවං සොණදෙණ්ඩා සමණං ගොතමං දස්සනාය උපසංකමිස්සති, භොතො සොණදණ්ඩස්ස යසො පරිහායිස්සති; සමණස්ස ගොතමස්ස යසො අභිවඩ්ඪිස්සති.” (දීඝනිකාය)","“සො ගන්ත්‍වා තං භත්තං පඤ්චහි පච්චෙක බුද්‍ධ-සතෙහි සද්ධිං සංවිභජි....... තෙපි ඔලොකෙන්තා එව අට්ඨංසු. (ධම්මපදට්ඨ කථා)","“සො තතො චුතො දෙවලොකෙ නිබ්බත්තිත්‍වා දෙව මනුස්සෙසු සංසරන්තො ඉමස්මිං බුද්‍ධුප්පාදෙ භද්දියනගරෙ සෙට්ඨිකුලෙ නිබ්බත්ති.” (එම)","“සො........ නික්ඛිත්තධඤ්ඤෙ පරික්ඛීණෙ පරිජනං පක්කොසාපෙත්‍වා ආහ: ගච්ඡථ, තාතා, පබ්බතං පවිසිත්‍වා ජීවන්තා සුභික්ඛකාලෙ මම සන්තිකං ආගන්තුකාමා ආගච්ඡථ, අනාගන්තුකාමා තත්‍ථෙව ජීවථාති.” (එම)","“පුන කච්ඡුං පූරෙත්‍වා ආචාව ආගච්ඡන්තිං උත්තරාය දාසියො දිස්වා: ‘අපෙහි දුබ්බිනීතෙ, න ත්‍වං අම්හාකං අය්‍යාය උපරි පක්කසප්පිං ආසිඤ්චිතුං අනුච්ඡවිකා’ති සන්තජ්ජෙන්තියො..... පොථෙත්‍වා භුමියං පාතෙසුං.” (එම)","‘සෙය්‍යථාපි භන්තෙ නික්කුජ්ජිතං වා උක්කුජ්ජෙය්‍ය, පටිච්ඡන්නං වා විවරෙය්‍ය, මූළ්හස්ස වා මග්ගං ආචික්ඛෙය්‍ය...... එවමෙවං භගවතා අනෙකපරියායෙන ධම්මො පකාසිතො.” (නොයෙක් සූත්‍ර‍යන්හි.)","“අථ ඛො අම්බට්ඨො මාණවො යෙන සො විහාරො සංවුතද්වාරො තෙන අප්පසද්දො උපසංකමිත්‍වා අතරමානො ආලින්‍දං පවිසිත්‍වා උක්කාසිත්‍වා අග්ගලං ආකොටෙසි. විවරි භගවා ද්වාරං.” (දීඝ අම්බට්ඨසුත්ත)","“අථ ඛො අම්බපාලී ගණිකා භගවතො අධිවාසනං විදිත්‍වා උට්ඨායාසනා භගවන්තං අභිවාදෙත්‍වා පදක්ඛිණං කත්‍වා පක්කාමි.” (දීඝ මහාපරිනිබ්බාණ)","“අත්තනො වාමපාදෙ ද්වීහි අඞ්ගුලීහි තස්ස පාදෙ ගහෙත්‍වා විහාරඞ්ගණෙ පොථෙන්තො තතො තතො ආකඩ්ඪි. සො පරිවත්තන්තො ථාමසා විස්සජ්ජෙතුං උස්සහන්තොපි විස්සජ්ජෙතුං නා’සක්ඛි” (රසවාහිනී)","“යක්ඛො ගජ්ජන්තො භුජෙ අප්පොඨෙන්තො අභිධාවි. යොධොපි තත්‍ථ ඨිතො වෙගෙන ආකාසම්බභූග්ගන්ත්‍වා වාමපාදඞ්ගුලීහි තස්ස හනුකට්ඨිං පහරි.” (එම)"],"s":["තරුණ දුටුගැමුණු කුමාරතෙමේ විශාල සේනාවක් රැස් කොටගෙන එළාර නම් දෙමළ රජුට විරුද්‍ධව ඉදිරියට ගියේ ය. වෙසක් මස ශුක්ල පක්‍ෂයේ සිවුවැනිදා ඔබ ගිහිගෙන් නික්ම පැවිදි විය යුතු ය.","මේ ප්‍රදේශයෙහි ගංගාවෝ සමන්තකූට පර්‍වතය හාත්පස පිහිටි කඳු වැටියෙන් ගලා බසිත්.","යක්‍ෂාධිපති වෛශ්‍ර‍වණ තෙමේ ධනයෙන් ලොව සියල්ලන් ඉක්මවයි.","රජතෙමේ රාජ කුමාර වූ තෙරුන් වහන්සේගේ ධාතූන් චෛත්‍යයෙහි නිදන් කොට අවුරුදු පතා ඒ ධාතූන්ට ගෞරව කිරීම පිණිස එහි ගියේ ය.","රාත්‍රිය බොහෝ සේ ඉක්මගියකල්හි බුදුරදුන්ගේ ධර්‍මය ඇසීමට පැමිණි දේවතාවෝ උන්වහන්සේට වැඳ ඉවත්ව ගියහ.","රජ බිසව මේ කාරණය අනුව බොහෝ වේලාවක් කල්පනාකොට ආගන්තුකයා තමා ඉදිරියට ගෙනෙන්ට සේවිකාවන්ට අණ කළේ ය.","මහලු ස්ත්‍රිය විසින් තඹ භාජනයක රැස්කොට තබනලද සියලු රන්කාසි සොරුන් විසින් ඉවත ගෙනයනලදි.","මහාධන සිටුතෙමේ තමාගේ හා භාර්‍ය්‍යාවගේ ධනය අවසන් වූ කල්හි ඇඳ - පුටු - භාජන ආදි ගෙයි බඩු විකුණා මත්පැන් පීම් ආදියෙහි යෙදුණේය.","ඉක්බිති අම්බලට්ඨ මාණවක තෙමේ සිය පිරිස සමග බුදුන් වෙත එළඹ උන්වහන්සේට නොවැඳ උන්වහන්සේගෙන් නොයෙක් ප්‍ර‍ශ්නයන් විචාළේ ය."],"gp":[["අග්ගල","අගුල. න."],["අධිවාසනා","ඉවසීම: (ආරාධනාවක්) බාරගැනීම. ඉ."],["අතරමාන","ඉක්මන් නොවෙමින්. 3."],["අනුච්ඡවික","සුදුසු වූ. 3."],["අපෙති","ඉවත් වෙයි."],["අප්පොඨෙන්ත","අප්පුඩි"],["අභිධාවති","විරුද්‍ධව දුවයි"],["අභිවඩ්ඪති","වැඩේ"],["අබ්භුග්ගන්ත්‍වා","උඩපැන. පූ.ක්‍රි."],["අසක්ඛි","හැකි විය:"],["ආකොටෙති","තට්ටු කරයි."],["ආගන්තුකාම","එනුකැමති. 3."],["ආචික්ඛෙය්‍ය","කියන්නේය: දැනුම් දෙන්නේය"],["ආලින්‍ද","පිටබරාඳය. පු."],["උක්කාසිත්‍වා","කාරා. පූ. ක්‍රි."],["උක්කුජ්ජෙය්‍ය","උඩිකුරු කරන්නේය"],["විදිත්‍වා","දැන. පූ. ක්‍රි."],["විස්සජ්ජෙතුං","අත්හරවන්ට, නි."],["සන්තජ්ජෙන්ති","ත ුදුක්කර (= ඉතා අපහසු). 3."]]},{"p":["“සමිතත්තා හි පාපානං සමණොති පවුච්චති.” (ධම්මපද)","“සො බජ්ඣතං පාසසතෙහි ඡබ්භි; රම්මා වනා නිය්‍යතු රාජධානිං තුත්තෙහි සො හඤ්ඤතු පාජනෙහි භිසානි තෙ බ්‍රාහ්මණ යො අහාසි” (භිස ජාතක)","“සො......... භන්තෙ, ‘අජ්ජ ආදිං කත්‍වා අග්ගිනාපි මම සන්තකං මා ඩය්හතු, උදකෙනාපි මා වුය්හතූ’ති පත්‍ථනං අකාසි.” (ධම්මපදට්ඨ කථා.)","“අද්දසා ඛො අඤ්ඤතරො උපාසකො තං භික්ඛුං කීටාගිරිස්මිං පිණ්ඩාය චරන්තං දිස්වාන........ තං භික්ඛුං අභිවාදෙත්‍වා එතදවොච අපි භන්තෙ පිණ්ඩො ලබ්භතීති.” (චුල්ලවග්ගපාළි)","කච්ඡපො හංසෙහි නීයමානො දට්ඨට්ඨානතො දණ්ඩකං විස්සජ්ජෙත්‍වා ආකාසඞ්ගණෙ පතිත්‍වා ද්වෙධා භිජ්ජි.","“අථෙ’කො මක්කටො තත්‍ථ තත්‍ථ ගොචරං පරියෙසමානො ඵලවන්තං තං රුක්ඛං ආරුය්හ ඵලානි ඛාදන්තො තස්මිං පාසෙ පාදෙන බජ්ඣි” (රසවාහිනී.)","“එවජ කිර’ස්ස අහොසි සද්‍ධා තාව ධම්මං සොතුකාමා ගමිස්සන්ති යෙව: අස්සද්ධාපි පන ධනලොභෙන ගන්ත්‍වා ධම්මං සුත්‍වා දුක්ඛා මුච්චිස්සන්තී”ති. (ධම්මපදට්ඨකථා)","“එකමන්තං නිසින්නං ඛො අනාථපිණ්ඩිකං ගහපති භගවා එතදවොච: අපි නු තෙ ගහපතිකුලෙ දානං දීයතීති.” (අඞ්ගුත්තර)","“දීඝස්ස අද්‍ධුනො අච්චයෙන තස්ස මහානිරයස්ස පුරත්‍ථිමං ද්වාරං අවාපූරීයති; සො තත්‍ථ සීඝෙන ජවෙන ධාවති: තස්ස සීඝෙන ජවෙන ධාවතො ඡවිපි ඩය්හති, චම්මම්පි ඩය්හති, මංසම්පි ඩය්හති” (මජ්ඣිම නිකාය)","මධුවා මඤ්ඤතී බාලො යාව පාපං න පච්චති: යදා ච පච්චති පාපං අථ බාලො දුක්ඛං නිගච්ඡති. (ධම්මපද)"],"s":["කපටියෝ කිසිවකු විසින් ප්‍රිය කරනු නොලැබෙත්. ඔවුහු සියල්ලන් විසින් දුරු කරනු ලැබෙත්.","මහානරකයේ දොර ඇරුණු විට නිරයවාසීහු එතැනට ඉක්මනින් දුවත්; එසේ දුවන විට ඔවුන්ගේ සම් ද මස් ද දැවෙති.","“ගෘහපතිය, දැනුත් ඔබගේ ගෙයි දන් දෙනු ලැබේ දැ” යි බුදුරට සිටාණන්ගෙන් විචාළේ ය.","සිටුහු විසින් “ශ්‍ර‍ද්ධා නැත්තෝත් ධන ලෝභයෙන් අවුත් බණ අසා දුකින් මිදෙන්නාහ” යි සිතා බුදුරදුන් වසන ගෙයි සත්රුවන් විසුරුවන ලදි.","අපගේ අසල්වැසියා ඔහුගේ දුෂ්ට ක්‍රියාවන් නිසා සියලු මිතුරන් විසින් වර්ජනය කරන ලදැයි අසන්ට ලැබේ.","කුමාරතෙමේ ඔහුගේ සියලු ගමන්වලදී ආචාර්‍ය්‍යවරුන් විසින් ද ඇමතියන් විසින් ද ආරක්‍ෂකයන් විසින් ද පිරිවරනු ලැබේ.","මගියා තනි වූ බැවිනුත් ඔහු අතේ ආයුධ නොතිබුණු බැවිනුත් සොරුන් විසින් පහර දෙන ලද්දේ ද පැහැර ගන්නා ලද්දේ ද විය.","යුද්ධ භූමියෙහිදී බොහෝ අශ්වයෝ ද භටයෝ ද මරණ ලදහ. සේන ෙතුං වායමන්තොව සෙට්ඨි මාරාපෙතුං නාසක්ඛි: කිං අක්ඛරසමයං සික්ඛාපෙස්සති?” (එම)","“ගාමමජ්ඣෙ වුත්තප්පකාරං ගෙහං කාරෙත්‍වා ගාමසතකො පණ්ණාකාරං ආහරාපෙත්‍වා ජනපදසෙට්ඨිනො ධීතරං ආහරිත්‍වා මඞ්ගලං කත්‍වා සෙට්ඨිස්ස සාසනං පහිණි.” (එම)","“තස්ස හෙට්ඨාභාගං සොධාපෙත්‍වා පාකාරපරික්ඛෙපං කාරාපෙත්‍වා වාලිකං ඔකිරාපෙත්‍වා ධජ - පතාකං උස්සාපෙත්‍වා වනප්පතිං අලංකරිත්‍වා...... පත්‍ථනං කත්‍වා පක්කාමි.” (චක්ඛුපාල වත්‍ථු)","“තෙන ඛො පන සමයෙන ආයස්මතො සාරිපුත්තස්ස උපට්ඨාකකුලං ආයස්මතො සාරිපුත්තස්ස සන්තිකෙ දාරකං පාහෙසි. “ඉමං දාරකං ථෙරො පබ්බාජෙතූ”ති (විනය මහාවග්ග)","“සචෙ වො ධනෙන අත්‍ථො ඛිප්පං මං බන්‍ධනා මොචෙත්‍වා සීසං නහාපෙත්‍වා අහත - වත්‍ථානි අච්ඡාදෙත්‍වා ගන්‍ධෙහි විලිම්පා පෙත්‍වා පුප්ඵානින පිලන්‍ධාපෙත්‍වා ඨපෙථාති.” (වෙදබ්භ ජාතක)","“සක්කො දෙවරාජා ‘කිං නො සාධාරණෙන රජ්ජෙනා’ති අසුරෙ දිබ්බපානං පායෙත්‍වා මත්තෙ සමානෙ පාදෙසු ගහෙත්‍වා සිනෙරුපපාතෙ ඛිපාපෙසි.” (කුලාවක ජාතකය)","‘රාජා පඤ්චසතෙ නග්ගසමණකෙ ගාහාපෙත්‍වා......ආවාටෙසු නිඛණාපෙත්‍වා පලාලෙහි පටිච්ඡාදෙත්‍වා අග්ගිං දාපෙසි.” (ධම්මපදට්ඨකථා)"],"s":["එරට රජතෙමේ තෙරුන් පිරිනිවි තැන ශුද්‍ධ කරවා උළු වඩුවන් ගෙන්වා මහා චෛත්‍යයක් බැන්දවිය.","හෙතෙමේ රන්මිල දශලක්‍ෂයක වියදමෙන් බොහෝ කම්කරුවන් ලවා මහා ප්‍රාසාදයක් ගොඩනංවා එහි භික්‍ෂූන් වාසය කරවිය.","කොසඹෑ සිටුතෙම ඝෝෂක කුමරු මරවන්ට කීපවරක් උත්සාහ කළ නමුත් මරවන්ට නොහැකි විය. ඝෝෂකගේ භාර්‍ය්‍යාව නුවණින් පිළිපැද ඔහු සිටුතනතුරට පැමිණවිය.","“ඉඳින් රාජ්‍යය ලබනු කැමති නම් දෙමළුන් හා යුද කොට ඔවුන් පලවා හරිනු මැනවැ”යි රජතෙමේ කැරලිකාර බමුණාට කියෙව්වේ ය.","දේවදත්ත ස්ථවිරතෙමේ අජාසත් කුමරු තමා කෙරෙහි පහදවා බුදුන් මැරීමට මිනිසුන් යෙදෙව්වේ ය: කුමරු ලවා ඔහුගේ පියා හිංසාකරවා මැරෙව්වේ ය.","ගෘහපතියා කම්කරුවන් විසි දෙනකුන් ලවා ගොනුන් දශදෙනකුන් ගෙන්වා කුඹුරු සතරක් සීසාවා වපුරවා වැටවල් බැන්දෙව්වේ ය.","දාසයන් ලවා වැඩ කරවීමට ගිය මිනිසා වනයෙහි වැවක් සාරවා එය අවට කුඹුරු ශුද්ධ කරවා ඔවුන් ලවා ගස් කප්පවා ඒවා මාර්ගය සමීපයට ඇද්දෙව්වේ ය.","බිම්බිසාර රජ පස්යොදුන් පමණ මග සමකරවා වැලි අතුරුවා මල් විසුරුවා ධ්වජයන් නංවා අලංකාර කරවිය.","උදේන රජ මාගන්දියගේ නෑයන් රැස් කරවා ඔවුන්ගේ හිස් සින්දවා මරවා උඩින් පිදුරු දමා දවන්ට සැලැස්වීය.","ධර්‍මාශෝක මහරජ බෞද්‍ධ භික්‍ෂු පිරිසක් ම ත්‍යයන් යෙදෙන විට ඊට මුලින් ඊ - කාරයක් සහිත ය - ප්‍ර‍ත්‍යය යෙදිය යුතුයි. උදාහරණ :-"],["p","හෙත්‍වර්ථ-කර්‍තෘකාරක - හාරාපෙති (=ගෙනයන්ට සලස්වයි.)"],["p","හෙත්‍වර්ථ-කර්‍මකාරක - හාරාපීයති (=ගෙනයන්ට සලස්වනු ලැබේ.)"],["p","**112. මේ හෙත්‍වර්ථ ප්‍ර‍ත්‍යයෝ ක්‍රියාපදයන්හි පමණක් යෙදෙන්නාහු නොවෙත්: පූර්‍වක්‍රියා, කිතක පද, තු - ප්‍ර‍ත්‍යායාන්ත ශබ්ද යන මොවුන් කෙරෙහි ද යෙදෙත්.**"],["p","කර + ආපෙ + ත්‍වා = කාරාපෙත්‍වා (= කරවා)"],["p","භුජ + ආපෙ + ත්‍වා = භොජාපෙත්‍වා (= අනුභව කරවා)"],["p","**කිතක පද**"],["p","පච + එ + න්ත = පාචෙන්ත (= පිසවන)"],["p","කර + එ + න්ත = කාරෙන්ත (= කරවන)"],["p","දා + ආපෙ + තු = දාපෙතු (= දෙවන්නා)"],["p","ගහ + ආපෙ + තු = ගාහාපෙතු (= ගන්වන්නා.)"],["p","**තුං - ප්‍ර‍ත්‍යයාන්තයෝ**"],["p","මර + ආපෙ + තුං = මාරාපෙතුං (= මරවන්ට)"],["p","ගහ + ආපෙ + තුං = ගාහාපෙතුං (= ගන්වන්ට)"],["p","**113. සකර්‍මක ධාතුවකින් හෙත්‍වර්ථ පදයක් සැදුණු විට ඒ පදය කර්‍ම එකකට වඩා ගනී. එසේ කර්‍ම දෙකක් ගත්විට ඉන් එකක් ප්‍ර‍ධාන කර්‍ම යයි ද අනික අප්‍ර‍ධාන කර්‍ම යයි ද කියනු ලැබේ.**"],["p","“පුරිසො කම්මකාරං රුක්ඛං ඡින්‍දාපෙති.”"],["p","යන තැන ‘කම්මකාරං, රුක්ඛං’ යි කර්‍ම දෙකකි. මෙහි ගස කපාගැනීම ඕනෑකම බැවින් ‘රුක්ඛං’ ප්‍ර‍ධාන කර්‍මයයි; අනික අප්‍ර‍ධාන කර්‍මයයි."],["p","**114. මේ අප්‍ර‍ධාන කර්‍මය නොයෙක් විට කරණ විභක්තියෙන් සිටී.** “ගහපතානී දාසියා ඔදනං පාචාපෙති”"],["p","යන තන්හි ‘දාසියා’ යන්න කරණ විභක්තියෙන් සිටී. මෙම ‘දාසි’ යි කර්‍මවිභක්තියෙන් යෙදුවත් ඒ අර්ථයම ලැබේ."],["p","115. ශුද්ධ ක්‍රියා පදයකින් යුත් වාක්‍යයක කර්‍තෘව සිටි පදය හෙත්‍වර්ථ පදයකින් යුක්ත වූ වාක්‍යයකදී අප්‍ර‍ධාන කර්‍මය විය හැක. “සූදො ඔදනං පචති.” යන තන්හි ‘සූදො’ කර්‍තෘ පදයයි. ඒ වාක්‍යය ‘සූදජෙට්ඨො සූදං ඔදනං පාචෙති’ යි හෙත්‍වර්ථයෙහි යෙදූ විට (පළමු වාක්‍යයෙහි) කර්‍තෘව සිටි පදය අප්‍ර‍ධාන කර්‍මය බවට පැමිණේ. මෙය ‘සූදජෙට්ඨො සූදෙන ඔදනං පාචෙති” යි ද යෙදිය හැක."]]},{"p":["ඛජ්ජ - භොජ්ජ - ලෙය්‍ය - පෙය්‍ය වසෙන චතුබ්බිධා හොන්ති මනුස්සානං ආහාරා.","“සචෙ මෙ ගතට්ඨානෙ ධීතු දොසො උප්පජ්ජති, තුම්හෙහි සොධෙතබ්බො” (ධ. අ. විසාඛාවත්‍ථු.)","“පතිකුලෙ වසන්තියා නාම අන්තො අග්ගි බහි න නීහරි තබ්බො, බහි අග්ගි අන්තො න පවෙසෙතබ්බො, දදන්තස්සෙ’ව දාතබ්බං, අදදන්තස්ස න දාතබ්බං, සුඛං භුඤ්ජිතබ්බං, සුඛං නිපජ්ජිතබ්බං” (එම)","සුදස්සං වජ්ජං අඤ්ඤෙසං අත්තනො පන දුද්දසං” (ධම්මපද)","“කාලස්සෙ’ව උට්ඨාය උපාහනා ඔමුඤ්චිත්‍වා..... දන්තකට්ඨං දාතබ්බං, මුඛොදකං දාතබ්බං, ආසනං පඤ්ඤාපෙතබ්බං” (විනය මහාවග්ග)","“සචෙ යාගු හොති, භාජනං ධොවිත්‍වා යාගු උපනෙතබ්බා, යාගුං පීතස්ස උදකං දත්‍වා භාජනං පටිග්ගහෙත්‍වා....... ධොවිත්‍වා පවිසාමෙතබ්බං.” (එම)","“උපජ්ඣායස්ස පච්ඡාසමණෙන හොතබ්බං, නාතිදූරෙ ගන්තබ්බං, පත්තපරියාපන්නං පටිග්ගහෙතබ්බං.” (එම)","“සචෙ උපජ්ඣායො ජන්තාඝරං පවිසිතුකාමො හොති, චුණ්ණං සන්නෙතබ්බං, මත්තිකා තෙමෙතබ්බා, චීවරං පටිග්ගහෙත්‍වා එකමන්තං නික්ඛිපිතබ්බං. (එම)","“නාහං තං ගමනෙන ලොකස්ස අන්තං ඤාතය්‍යං දට්ඨය්‍යං පත්තය්‍යන්ති වදාමි” (චතුක්කඞ්ගුත්තර)","“පුඤ්ඤමාකඞ්ඛමානෙන දෙය්‍යං හොති විජානතා” (දෙවතාසංයුත්ත)","තං සුත්‍වා ඉතරො “භාරියං වත මෙ සාහසිකං අනනුච්ඡවිකං කම්මං කත”න්ති බාහා පග්ගය්හ කන්‍දන්තො...... අහොසි. (ධම්මපදට්ඨ කථා)","මහාසමුද්දෙ අසංඛෙය්‍යා මච්ඡකච්ඡපා, අප්පමෙය්‍යො උදකරාසි, අගය්හානි බහූනි රතනානි ච සන්ති."],"s":["අප විසින් දන් දිය යුතුයි, අකුසල් නොකටයුතුයි. මෛත්‍රිය වැඩිය යුතුයි.","දූ පුතුන් විසින් මවුපියෝ වැන්ද යුත්තාහු ද පෝෂණ කළ යුත්තෝ ද වෙති.","සර්‍වඥතෙමේ දෙව් මිනිස් ආදීන් විසින් සත්කාර කටයුත්තේ ගරු කටයුත්තේ බුහුමන් කළ යුත්තේ වෙයි.","දශ දිනකින් කළ යුතු වැඩය ඔහු විසින් සය දිනකින් කරන ලදි.","ගර්හාකටයුතු වචන නොකිය යුතුයයි ගුරුවරුන් විසින් ශිෂ්‍යයන්ට අවවාද දිය යුතු ය.","ශිෂ්‍යයා විසින් ගුරුවරයාට සිහිල් පැන් උණු පැන් දිය යුතුය. ආසනය පැනවිය යුතු ය, පවන් සැලිය යුතු ය.","ඔහු වසන ගෙය ඇමදිය යුතු ය, කසළ ඉවත් කළ යුතු ය, ඇඳපුටු ශුද්ධ කළ යුත්තාහ.","දරුවන් විසින් මවුපියවරු ද සැමියන් විසින් අඹුදරුවෝ ද පෝෂණය කළ යුත්තාහ.","ගෘහපතියා විසින් දාසයන් ලවා ඔවුන්ගේ ශක්තියට අනුරූප ලෙස කර්‍මාන්ත කරවිය යුත්තාහ.","ගොවියා විසින් පළමු කොට කුඹුර සී සෑ යුතු ය. ඉන්පසු වැපිරිය යුතු ය, ජලය පැමිණවිය යුතු ය. වැට බැන්ද යුතු ය, ගොයම් රැක්ක යුතුයි.","ශ්‍ර‍ද්‍ධාවෙන් පැවිදිවූවන් විසින් ධර්‍මය ඉගෙනිය යුතු ය. වැඩි මහල්ලන්ට ගෞරව කළ යුතු ය. ධර්‍මය දේශනා කළ යුතු ය. ධර්‍මයට අනුව පිළිපැද්ද යුතු ය.","විශාඛාවගේ පියා ඈ ස්වාමිකුලයට යවද්දී දෝෂයක් උපනහොත් එය ශුද්‍ධ කටයුතු යයි කියා කෙළෙඹියන් දස දෙනෙකුන් යැවී ය."],"gp":[["අගය්හ" තල. 3."],["හොත්","සචෙ. නි."]],"lt":"කිතක පද","l":[["h","කිතක පද"],["p","**116. ධාතුවකින් (යම්කිසි අර්‍ථයක) ප්‍ර‍ත්‍යයක් කොට සෑදූ නාමය කිතක නම් වේ.**"],["p","තද්‍ධිත - කිතක දෙදෙනාගේ වෙනස නම් : තද්‍ධිතය නාමයකින් ප්‍ර‍ත්‍යයක් වී සැදුණු අන්‍ය නාමයකි. කිතකය ධාතුවකින් ප්‍ර‍ත්‍යයක් වී සැදුණු නාමයකි. කිතක නාමයකින් තද්‍ධිත ප්‍ර‍ත්‍යයක් කොට එය තද්‍ධිත නාමයක් කළ හැක. දායක-යන කිතක පදයෙන් භාවාර්ථයෙහි ත්ත-ප්‍ර‍ත්‍යය කොට ‘දායකත්ත’ (= දායක බව) යි සැදූ විට එය තද්‍ධිත නාමයක් වේ. තද්‍ධිත නාමයක් කිතක නාමයක් කරන්ට නොහැකි බව සැලකිය යුතු."],["p","**117. කිතක ප්‍ර‍ත්‍යයෝ (1) කිච්ච, (2) කින් යන දෙකොටසකට බෙදන ලදහ. (කිච්චප්‍ර‍ත්‍යයෝ ස්වල්ප දෙනෙකි. කිත් ප්‍ර‍ත්‍යයෝ බොහෝ දෙනෙකි.)**"],["p","(1) කිච්චප්‍ර‍ත්‍යයෝ නම් තබ්බ, අනීය, ණ්‍ය, ණිය, තය්‍ය, ඉච්ච යන මොහුයි. මොවුහු භාව - කර්‍මදෙක්හි පමණක් වෙති. අකර්‍මධාතූණ් කෙරෙන් භාවාර්ථයෙහි පමණක් ද සකර්‍මකධාතූන් කෙරෙන් ඒ අර්ථ දෙකෙහි ම ද වෙති. මොවුන්ට කාලවිශේෂයක් නැත."],["h","කිච්චප්‍ර‍ත්‍යයෝ"],["p","118. සියලු ධාතූන් කෙරෙන් භාවාර්ථ - කර්‍මාර්ථ දෙක්හි තබ්බ, අනීය - ප්‍ර‍ත්‍යයෝ වෙති. මොවුහු යුතු = යෝග්‍ය යන අර්ථය ප්‍ර‍කාශ කරත්."],["p","A. කර (කිරීමෙහි) + තබ්බ = කාතබ්බ හෝ කත්තබ්බ"],["p","(= කළයුතු හෝ කළයුත්ත)"],["p","කර + අනීය = කරණීය (= කළයුතු හෝ කළයුත්ත.)"],["p","සු (ශ්‍ර‍වණයෙහි) + තබ්බ = සොතබ්බ (= ඇසිය යුතු)"],["p","සු + අනීය = සවණීය (= ඇසිය යුතු)"],["p","පළමු උදාහරණයෙහි තබ්බ - පරකල්හි කර - ධාතුවට කා - ආදේශ වේ. දෙවෙනි තැන්හි ධාත්‍වන්ත අ - කාරය ලොප් වූ පසු ර් - කාරයට ත් - ආදේශ වේ."],["p","සොතබ්බ - යන තැන සු - ධාතුවේ උ - කාරයට වෘද්‍ධි වේ. සිවුවැන්නෙහි වෘද්‍ධිය වූ පසු ඔ - කාරයට අව - ආදේශ වේ."],["p","කරණීය - සවණීය - යන දෙතැන්හි ප්‍ර‍ත්‍යය අනීය වුවත් ධාතුව හා එක්වූ පසු “රකාර - හකාරාදින් කෙරෙන් පරවූ න - කාරයට ණ - කාර වේ.” යන නියමයෙන් ණ - කාරාදේශ වේ."],["p","B. ගමු (යාමෙහි) + තබ්බ = ගන්තබ්බ හෝ ගමිතබ්බ = යායුතු"],["p","ගහ (ගැනීමෙහි) + තබ්බ + ගහෙතබ්බ හෝ ගණ්හිතබ්බ (= ගතයුතු)"],["p","මෙහි පළමු උදාහරණයෙහි ධාත්‍වන්තය ලොප් කළ පසු ම් - කාරයට න් - කාරයක් වේ. දෙවෙනි තැන ධාතුවටත් ප්‍ර‍ත්‍යයටත් අතරෙහි ඉ - කාරාගමයක් වේ. මේ ඉකාරාගමය පචිතබ්බ, හරිතබ්බ ආදි අන්‍ය බොහෝ තැන්වල ද යෙදේ."],["p","**ගහෙතබ්බ** යන තැන ධාතු - ප්‍ර‍ත්‍යයන් අතරෙහි වූ ඉකාරාගමයට එකාරාදේශ වේ. **ගණ්හිතබ්බ** යන්න ආඛ්‍යාතයෙහි කී සේ විකරණය වූ ණා ප්‍ර‍ත්‍යය යෙදූ පසු (ගහ් + ණා + තබ්බ යින සිටි තැන) හ - කාර ණ - කාර පෙරැළිය වී ‘ගණ්හාතබ්බ’ යි සිටි විට ඉකාරාගමය වී ආකාරය ලොප්වීමෙන් සිද්ධයි."],["p","කත්තබ්බො කම්මන්තො (= කළ යුතු කර්‍මාන්තය)"],["p","කත්තබ්බා පූජා (= කළ යුතු පූජාව)"],["p","රක්ඛිතබ්බං සීලං (= රැක්ක යුතු ශීලය)"],["p","ආදි වශයෙන් මේ පදයන් තුන් ලිඟුවෙහිත් අතීතාදි කාල තුනෙහිත් යෙදෙන බව සැලකිය යුතු."],["p","**119. ඇතැම් ධාතූන් කෙරෙන් භාවාර්‍ථ - කර්‍මාර්‍ථයන්හි ණ්‍ය - ණිය යන ප්‍ර‍ත්‍යයෝ වෙති. මෙහි ණ් - කාරය වෘද්‍ධිය පිණිසයි.**"],["p","ධාතුවකින් ණ්‍ය - ප්‍ර‍ත්‍යය යෙදුණු විට ධාත්‍වන්තස්වරය හා ණ් - කාරය ලොප් වී ය - කාරය ධාත්‍වන්ත ව්‍යඤ්ජනය සමග බැඳුණු විට ඒ ය - කාර සහිත ව්‍යඤ්ජනය විකාරයට (වෙනස් ආකාරයකට) පැමිණේ."],["p","වෙනස් වන සැටි මෙසේයි."],["r","ද්‍ය\tසංයෝගය\tජ්ජ - බවට පැමිණේ"],["r","ම්‍ය\tසංයෝගය\tම්ම - බවට පැමිණේ"],["r","ජ්‍ය\tසංයෝගය\tජ්ජ - බවට පැමිණේ"],["r","ග්‍ය\tසංයෝගය\tග්ග - බවට පැමිණේ"],["r","ච්‍ය (හෝ ක්‍ය ”\tච්ච - බවට පැමිණේ"],["p","වද (කීමෙහි) + ණ්‍ය = වද්‍ය - වජ්ජ (= කියයුතු දෙය: දෝෂය) ගමු(අවබෝධයෙහි) + ණ්‍ය = ගම්‍ය - ගම්ම (= අවබෝධ කටයුතු)"],["p","යුජ (යෙදීමෙහි) + ණ්‍ය = යොග්‍යං = යොග්ග (= යෙදිය යුතු)"],["p","භුජ (අනුභවයෙහි) + ණ්‍ය = භොජ - භොජ්ජ හෝ භොග්ග"],["p","(= අනුභව කටයුතු)"],["p","චච (කීමෙහි) + ණ්‍ය = වාච්‍ය - වාක්‍ය (= කියයුතු දෙය, වාක්‍යය)"],["p","ඛාද (කෑමෙහි) + ණ්‍ය = ඛාද්‍ය - ඛජ්ජ (= කැවිලි, කෑයුතු දෙය)"],["p","B. හකාරාන්ත ධාතූන් කෙරෙන් ණ්‍ය - ප්‍ර‍ත්‍යය වූ විට ප්‍ර‍ත්‍යයේ ය - කාරයත් ධාතුවේ හ - කාරයත් මාරුවෙති."],["p","ගහ + ණ්‍ය = ගහ්‍ය - ගය්හ (= ගතයුතු)"],["p","ගරහ (ගර්හාවෙහි) + ණ්‍ය = ගාරහය = ගාරය්හ (= ගර්හා කටයුතු)"],["p","ආ - ඉ - ඊ අන්ත වූ ධාතූන් කෙරෙන් පර වූ ණ්‍ය - ප්‍ර‍ත්‍යයට එය්‍ය - ආදේශ වේ."],["p","දා + එය්‍ය = දෙය්‍ය (= දිය යුතු)"],["p","පා + එය්‍ය = පෙය්‍ය (= බිය යුතු)"],["p","ජි + එය්‍ය = ජෙය්‍ය (= දිනිය යුතු)"],["p","නී + එය්‍ය = නෙය්‍ය (=ගෙනයා යුතු හෝ අවබෝධ කළ යුතු)"],["p","ඤා + එය්‍ය = ඤෙය්‍ය (= දත යුතු)"],["p","කර + ණිය = කාරිය (= කළ යුතු, කෘත්‍යය)"],["p","හර + ණිය = හාරිය (= ගෙන යා යුතු)"],["p","මර + ණිය = මාරිය (= මැරිය යුතු.)"],["p","**120. ඉච්ච, තය්‍ය යන ප්‍ර‍ත්‍යයෝ ධාතූන් කීපදෙනෙකුන් කෙරෙන් පමණක් වෙති.**"],["p","කර + ඉච්ච - කිච්ච (= කටයුත්ත)"],["p","මෙහි ධාත්‍වන්ත ර - කාරය ලොප් වේ."],["p","ඤා + තය්‍ය = ඤාතය්‍ය (= දත යුතු)"],["p","පද (යාමෙහි) + තය්‍ය =පත්තය්‍ය (= පැමිණිය යුතු)"],["p","ධාත්‍වන්තයට ත් - කාරාදේශ වේ."],["p","දිස + තය්‍ය = දට්ඨය්‍ය (= දැක්ක යුතු) ප්‍ර‍ත්‍යයේ තකාරය සමග දිස - හට දට්ඨාදේශ වේ.)"],["p","**121. මෙහි දැක්වූ කිච්ච ප්‍ර‍ත්‍යයන් කර්‍ම - භාවකාරකයන්හි පමණක් වන බැවින් ඒවායින් සිද්ධ වූ පදයන් සමග උක්ත කර්‍තෘ නොයෙදේ. ඒවා හා යෙදෙන කර්‍තෘපදය තතියාවෙන් සිටිය යුතුයි.**"],["p","“අම්හෙහි පුඤ්ඤං කාතබ්බං” (= අප විසින් පින කළ යුතු ය.) යි මිස “අම්හෙ පුඤ්ඤං කාතබ්බං” (අපි පින කළ යුතු ය) යි නොයෙදිය හැක. මතු අභ්‍යාසයෙහි පෙනෙන නිදර්ශනවලින් මෙය ප්‍ර‍කටව පෙනෙනවා ඇත."],["p","**122. කිතක පදයන්ගේ විශේෂ පැවැත්මක් නම් ‘අම්හෙහි ඛෙත්තං කසිතබ්බං, සො ගාමං ගතො’ ආදී වශයෙන් අවසාන ක්‍රියාවක් නොගෙන සිටීමයි. වාක්‍යයක් සම්පූර්ණ වීමට ක්‍රියාවක් තිබිය යුතුම ය. කිතකය නාමයක් බැවින් මේ දැක්වූ වාක්‍ය දෙකෙහි ම ක්‍රියාවක් නැති හෙයන් වාක්‍යයෝ පරිපූර්ණ නො වෙති. එබැවින් මේවා සම්පූර්ණ කිරීම පිණිස ‘හොති’ යන ක්‍රියාපදය යෙදිය යුතුයි. එවිට**"],["p","අම්හෙහි ඛෙත්තං කසිතබ්බං හොති (= අප විසින් කෙත සී සෑ යුතු වේ.)"],["p","සො ගාමං ගතො හොති (හෙතෙම ගමට ගියේ වේ.) යි සම්පූර්ණ වාක්‍ය ලැබෙත්. නමුත් අවසාන ක්‍රියාව නොයොදා කිතක පදයෙන් පමණක් යුක්තකළ වාක්‍ය පාලියේ නොයෙක් තැන දක්නා ලැබෙන බැවින් එසේ තැබීම භාෂා රීතියට විරුද්ධ නොවේ. එසේ සිටි විට ‘අප විසින් කෙත සී සෑ යුතු ය, හෙතෙම ගමට ගියේය, යි සිංහලෙන් ද අවසාන ක්‍රියාව නැතිව අර්‍ථ දිය හැක.)"],["p","කත්තබ්බා පූජා (= කළ යුතු වූ පූජාව)"],["p","පූජා කත්තබ්බා (= පූජාව කළ යුතු ය)"],["p","යන දෙයාකාර පැවැත්මක් ද කිතක පදයන්ට ඇති බව සැලකිය යුතු."]]},{"p":["“සුමෙධතාපසො ඉද්ධිමාති ජානන්තා උදකභින්නොකාසං සල්ලක්ඛෙත්‍වා ‘ත්‍වං ඉමං ඨානං අලංකරොහී’ති වත්‍වා අදංසු” (ජාතක නිදාන)","‘එවං නිසින්නෙ බොධිසත්තෙ සකල - දස සහස්ස - චක්කවාළෙ දෙවතා සන්නිපතිත්‍වා..... බොධිසත්තං නානාප්පකාරාහි ථුතීහි අභිත්‍ථුතිංසු.” (එම)","යථා පන අඤ්ඤෙ සත්තා මාතුකුච්ඡිතො නික්ඛඹන්තා පටික්කූලෙන අසුචිනා මක්ඛිතා නික්ඛමන්ති, න එවං බොධි සත්තො” (එම)","“අපරම්පන එකදිවසං උය්‍යානං ගච්ඡන්තො තථෙ’ව දෙවතාහි නිම්මිතං සුනිවත්‍ථං සුපාරුතං පබ්බජිතං දිස්වා ‘කො නාමෙ’සො සම්මා’ති සාරථිං පුච්ඡි.” (එම)","“අයං බුද්‍ධත්තාය අභිනීහාරං කත්‍වා නිපන්නො. සමිජ්ඣිස්සති ඉමස්ස පත්‍ථනා ඉතො කප්ප - සතසහස්සාධිකානං චතුන්නං අසංඛෙය්‍යානං මත්‍ථකෙ.” (එම)","“කිමේම එකෙන තිණ්ණෙන පුරිසෙන ථාමදස්සිනා?” (බුද්‍ධවංස)","“දස්සනං මෙ අතික්කන්තෙ සසංඝෙ ලොකනායකෙ හට්ඨො හට්ඨෙන චිත්තෙන ආසනා වුට්ඨහිං තදා” (එම)","“උබ්බිග්ගා තසිතා භීතා භන්තා ව්‍යථිත - මානසා මහාජනා සමාගම්ම දීපංකරමුපාගමුං.” (එම)","“තත්‍ථ දෙවමනුස්සා ගන්‍ධමාලාදීහි පූජයමානා මහාපුරිස, ඉධ තුම්හෙහි සදිසො නත්‍ථි. කුතෙ’ත්‍ථ උත්තරිතරො? ති ආහංසු.” (ජාතක නිදාන)","“ආදිත්තස්මිං අගාරස්මිං යං නීහරති භාජනං තං තස්ස හොති අත්‍ථාය නොව යං තත්‍ථ ඩය්හති.” (දෙවතාසංයුත්ත)"],"s":["කුඹලා විසින් සාදන ලද මැටිබඳුන් දුවන ගොනකු විසින් බිඳින ලදහ.","සංසිඳුණු සිතැති ක්‍ෂීණාශ්‍ර‍වයන්ට දුන් දානය මහත් ඵල ඇත්තේ වේ.","සංසාර සාගරයෙන් ගොඩ නැඟුණු තථාගතයන් වහන්සේ අන්‍යයන්ට ද එයින් ගොඩ නැගීම සඳහා ධර්ම දේශනා කළහ.","ගිනිගත් ගේකින් පිටතට ගත් දෙය පසුව මනුෂ්‍යයන්ට ප්‍රයෝජනය පිණිස පවතී.","යස කුල පුත්‍ර‍යාගේ මව ඔහුගේ මන්දිරයට ගියා ඔහු නොදක්නී පියා වෙත ගොස් “ඔබගේ පුතා නොදක්නා ලැබේ” යයි කී ය.","විශාඛාව කථාකරන කල්හි බමුණෝ ඇගේ දන්ත කල්‍යාණය බලමින් සිට කථාව නිමවූ කල්හි ඔවුන් ගෙනා රන්දම ඇයට පැළැන්දූහ.","භූමිකම්පාවෙන් පීඩිත වූ ප්‍රදේශය වැටුණු ගස්වලින් ද බිඳුණු ගෙවලින් ද මැරුණු මිනිසුන්ගෙන් ද යුක්ත විය.","“මෙතැන හිඳිමින් මෙතැන ම හුන් මාගේ පුත්‍ර‍යා දැක්ක හැක” යි සිතමින් සතුටු වූ සිටුතෙමේ බුදුන් සමීපයෙහි වාඩි විය.","විහාරදොරටුවෙන් නික්මුණු බුදුරද පුර වැසියන් විසින් වඳින ලද්දේ පුදන ලද්දේ බුහුමන් කරන ලද්දේ සැරසූ නුවරට ශාන්ත ගමනින් ඇතුළුවිය.","එදා එනුවර එසවූ ධ්වජවලින් ද රැස් වූ මනාසේ හැඳි මිනිසුන්ගෙන් ද යුක්ත විය. එල්ලූ = ඔලිම්බිත. 3. දන්තකල්‍යාණය = දන්ත එසවූ = උස්සාපිත. 3. කල්‍යාණ. න. කථාකරන = කථෙන්ත. 3. පිටතට ගත් - නීහට. 3 ගෙනා = ආනීත, ආහට. 3 භූමිකම්පාව = භූමිචාල. පු. ගොඩනැගුණු = උත්තිණ්ණ. 3. මණ්ඩපය = මණ්ඩප. පු. ගොඩනැගීම පිණිස = මන්දිරය = පාසාද. පු. උත්තාරණය මැටිබඳුන = මත්තිකාභාජන. න."],"gp":[["අත්‍ථාය","ප්‍රයෝජය පිණිස (අත්‍ථ-ශබ්ද)"],["අභිත්‍ථුති","ස්තුති කෙළේ ය."],["අභිනීහාර","ප්‍රාර්ථනාව. පු."],["අසුචි","අපිරිසිදුදෙය. පු. අපවිත්‍ර‍ වූ. 3"],["ආදිත්ත","දැල්වුණු, ගිනිගත්. 3."],["උත්තරීතර","වඩා ශ්‍රේෂ්ඨ. 3."],["උබ්බිග්ග","කලබලයට පත්. 3."],["ඔකාස","අවකාශය, ස්ථානය. පු."],["තසිත","තැතිගත්. 3."],["ථාමදස්සී","ශක්තියදකින්නා. පු."],["ථුති","ස්තුතිය. ඉ."],["නිපන්න","හොත්, ලැගසිටි. 3."],["පටික්කුල","පිළිකුල් කටයුතු. 3."],["මක්ඛිත","ගෑවුණු, තැවරුණු. 3."],["මත්‍ථකෙ","මත්තෙහි (මත්‍ථක ශබ්ද). පු."],["ලොකනායක","ලෝකාධිපති (බුදුරද). පු."],["ව්‍යථිත","කම්පිත. වූ, ව්‍යසනයට පත්. 3."],["සදිස","සමාන වූ. 3."],["සමාගම්ම","එකතුව. පූ. ක්‍රි."],["සසඞ්ඝ","සංඝයා සහිත. 3."],["සමිජ්ඣති","සමෘද්‍ධ වේ."],["සල්ලක්ඛෙත්‍වා","සලකා. පූ. ක්‍රි."],["සුනිවත්‍ථ","මනා සේ හැඳි. 3."],["සුපාරුත","මනාසේ පොරවාගත්. 3."]],"gs":[],"lt":"මිශ්‍ර ක්‍රියාපද සෑදීම","l":[["p","**123. මිශ්‍ර‍ ක්‍රියාපදයන් සෑදීම පිණිස සියලු ධාතූන් කෙරෙන් න්ත - මාන යන ප්‍ර‍ත්‍යයෝ යොදනු ලැබෙත්.**"],["p","ඒ ප්‍ර‍ත්‍යයන් පර වූ කල්හි ඇතැම් ධාතූහු ස්වරූපය වෙනස් කරති: හේ මෙසේ යි:-"],["r","ගමු (යාමෙහි) ධාතුව\tගච්ඡ - බවට පැමිණේ"],["r","ඉසු (කැමැත්තෙහි)\tඉච්ඡ - බවට පැමිණේ"],["r","දිස (දැක්මෙහි)\tපස්ස, දක්ඛ - බවට පැමිණේ"],["r","පා (බීමෙහි)\tපීබ, පිව - බවට පැමිණේ"],["r","ඨා (සිටීමෙහි)\tතිට්ඨ - බවට පැමිණේ"],["r","දා (දීමෙහි\tදද - බවට පැමිණේ"],["r","ඤා (දැනීමෙහි)\tජාන - බවට පැමිණේ"],["r","කර (කිරීමෙහි)\tකුරු, කුබ්බ - බවට පැමිණේ"],["p","ගච්ඡ + න්ත = ගච්ඡන්ත (යන, යමින්)"],["p","ඉච්ඡ + න්ත = ඉච්ඡන්ත (කැමැතිවෙන)"],["p","පස්ස + න්ත = පස්සන්ත (දකින: දකිමින්)"],["p","දිස්ස + මාන = දිස්සමාන (දක්නා ලැබෙන: පෙනෙමින්)"],["p","තිට්ඨ + මාන = තිට්ඨමාන (සිටින: සිටිමින්)"],["p","දද + මාන = දදමාන (දෙන, දෙමින්)"],["p","ජාන + න්ත = ජානන්ත (දන්නා වූ.)"],["p","කුරු + මාන = කුරුමාන (කරන, කරමින්)"],["p","(න්ත - ප්‍ර‍ත්‍යය පර කල්හි කර - ධාතුව තම රූපය වෙනස් නොකරයි, නමුත් තමාගේ ගණයට අයත් ඔ - විකරණය ගනියි.)"],["p","කර + ඔ + න්ත + කරොන්ත (කරන; කරමින්)"],["p","භූ - ධාතුව න්ත - මාන දෙක ම පර කල්හි අ - විකරණය ගෙන භව - යන රූපයෙන් සිටියි."],["p","}"],["p","(වෙන: වෙමින්)"],["p","භු + අ + මාන = භවමාන"],["p","භු + අ + න්ත = භවන්ත"],["p","උඩින් දැක් වූ සියලු උදාහරණයන්ට මාන - න්ත දෙකින් ම යුත් පද ඇති බව සැලකිය යුතු. මෙකී ප්‍ර‍ත්‍යය දෙක වර්‍තමාන කාලයෙහි වෙති. ඉංග්‍රීසියෙහි Present Participle මේවා නමින් හැඳින්වෙති."],["p","124. අතීතයෙහි සිදුවූවක් ප්‍ර‍කාශ කිරීම පිණිස ධාතූන් කෙරෙන් ත, තවන්තු, තාවී යන ප්‍ර‍ත්‍යයෝ වෙති."],["p","A. බොහෝ තැන්වලදී මේ ප්‍ර‍ත්‍යයන් ඉදිරියෙන් වූ ධාතූන්ගේ අන්ත ව්‍යඤ්ජනය ලොප් වේ. ප්‍ර‍ත්‍යයන්හි ත් - කාරය ද්විත්‍ව බවට පැමිණේ."],["p","}"],["p","අනුභව කළ"],["r","භුජ (අනුභවයෙහි) + ත = භුත්ත\tභුජ + තාවී = භුත්තාවී"],["p","භුජ + තවන්තු = භුත්තවන්තු"],["p","තවන්තු - තාවී - ප්‍ර‍ත්‍යයන් බහුලව නොයෙදෙන බැවින් ත - ප්‍ර‍ත්‍යය පමණක් යොදා මින් මත්තෙහි උදාහරණ දක්වනු ලැබේ."],["p","මුච (මිදීමෙහි) + ත = මුත්ත (මිදුණු: නිදහස් වූ)"],["p","තප (රත්වීමෙහි) + ත = තත්ත (රත්වූ: උණුසුම් වූ)"],["p","පද (යාමෙහි) + ත = පත්ත (පැමිණි)"],["p","මද (මත්වීමෙහි) + ත = මත්ත (මත්වූ: උඩඟු වූ)"],["p","යුජ (යෙදීමෙහි) + ත = යුත්ත (යෙදුණු, යෝග්‍ය, යොදන ලද)"],["p","සුප (නිදීමෙහි) + ත = සුත්ත (නිදාගත්)"],["p","B. ඇතැම් තැනක ප්‍ර‍ත්‍යයන්හි ත් - කාරය ද්විත්‍ව නොවේ. ධාත්‍වන්ත ව්‍යඤ්ජනය පමණක් ලොප් වේ."],["p","කර + ත = කත (කළ: කරන ලද)"],["p","මර (මැරීමෙහි) + ත = මත (මළා වූ)"],["p","හන (නැසීමෙහි) + ත = හත (නසන ලද)"],["p","ගමු (යාමෙහි) + ත = ගත (ගිය)"],["p","රමු (සිත් ඇලවීමෙහි) + ත = රත (ඇලුණු)"],["p","C. ඇතැම් විට ත - ප්‍ර‍ත්‍යය ධාත්‍වන්ත - ව්‍යඤ්ජනය සමග විකාරයට (වෙනස් අකුරක් බවට) පැමිණේ. (ධාත්‍වන්ත ස්වරය සුඛොච්චාරණය පිණිසයි.)"],["p","**1. ස් + ත = ට්ඨ බවට පැමිණේ :-**"],["p","දස (ඩැසීමෙහි) + ත = දට්ඨ (ඩසින ලද)"],["p","කස (සෑමෙහි) + ත = කට්ඨ (සීසාන ලද)"],["p","හස (සිනාවෙහි) + ත = හට්ඨ (ප්‍රීතිමත් වූ)"],["p","රුස (කෝප වීමෙහි) + ත = රුට්ඨ (කෝප වූ)"],["p","ඝුස (ශබ්ද නැගීමෙහි) + ත = ඝුට්ඨ (ඝෝෂණය කළ)"],["p","ආ + කුස (අක්‍රෝශයෙහි) + ත = අක්කුට්ඨ (ආක්‍රෝශ ලැබූ.)"],["p","**2. ම් + ත = න්ත බවට පැමිණේ :-**"],["p","ඛමු (ඉවසීමෙහි) = ඛන්ත (ඉවසූ)"],["p","සමු (සංසිඳවීමෙහි) + ත = සන්ත (සංසිඳුණු)"],["p","භමු (කැරකීමෙහි) + ත = භන්ත (භ්‍ර‍මණය වූ)"],["p","දමු (දමනයෙහි) + ත = දන්ත (දැමුණු, දමනය කළ)"],["p","ප + කමු (යාමෙහි) + ක = පක්කන්ත (ගිය)"],["p","**3. ධ් + ත = ද්ධ බවට පැමිණේ :-**"],["p","බුධ (අවබෝධ කිරීමෙහි) + ත = බුද්ධ (අවබෝධ කළ: දන්නා අය)"],["p","රුධ (අවහිර කිරීමෙහි) + ත = රුද්ධ (අවහිර කරනු ලැබූ.)"],["p","**4. භ් + ත = ද්ධ බවට පැමිණේ :-**"],["p","ලභ (ලැබීමෙහි) + ත = ලද්‍ධ (ලැබූ: ලැබුණු)"],["p","ලුභ (මසුරුවීමෙහි) + ත = ලුද්‍ධ (ලොහොබි වූ)"],["p","**5. ජ් + ත = ග්ග බවට පැමිණේ :-**"],["p","භුජ (බිඳීමෙහි) + ත = භග්ග (බිඳුණු: බිඳින ලද)"],["r","සං + විජ (කලකිරීමෙහි) + ත = සංවිග්ග (සංවේගයට පත්\tකලකිරීමට පත්.)"],["li","**අන්‍යාකාර වූ ඇතැම් පෙරැළි ද වෙති :-**"],["p","දුභ (දොවීමෙහි) + ත = දුද්ධ (දොවින ලද)"],["p","රුහ (නැගීමෙහි) + ත = රූළ්හ (නැගි, නැංගාවූ, වැඩුණු)"],["p","මජ්ජ (මැදීමෙහි) + ත = මට්ඨ (මට්ටම් වූ)"],["p","පච (පිසීමෙහි) + ත = පක්ක (පැසුණු: පිසූ)"],["p","වස (විසීමෙහි) + ත = වුත්‍ථ (විසූ: වාසය කළ)"],["p","D. ඇතැම් විට ත - ප්‍ර‍ත්‍යය වෙනස් නොවී සිට ධාතුව අන්‍යාකාරයකට පමුණුවයි."],["p","ජන (ඉපදවීමෙහි) + ත = ජාත (උපන්, හටගත්)"],["p","පා (බීමෙහි) + ත = පීත (පානය කළ)"],["p","ඨා (සිටීමෙහි) + ත = ඨිත (සිටි, නැවතුණු)"],["p","මා (මැණීමෙහි) + ත = මිත (මණිනලද)"],["p","E. එක් ස්වරයක් හෝ ධාතූන් කෙරෙන් ත - ප්‍ර‍ත්‍යය වූ විට එය හෝ ධාතුව හෝ වෙනසට නො පැමිණේ."],["p","භූ (වීමෙහි) + ත = භූත (වූ: සිදු වූ)"],["p","නී (පැමිණවීමෙහි) + ත = නීත (ගෙනගිය)"],["p","භී (භය වීමෙහි) + ත = භීත (බියපත්)"],["p","ඤා (දැනීමෙිහ) + ත = ඤාත (දත්, දන්නා ලද)"],["p","යා (ගමනෙහි) + ත = යාත (ගිය)"],["p","ජි (ජය ගැන්මෙහි) + ත = ජිත (දිනූ)"],["p","චි (රැස් කිරීමෙහි) + ත = චිත (රැස් කළ)"],["p","න්හා (නෑමෙහි) + ත = න්හාත (නෑ, ස්නානය කළ)"],["p","නහා + න්හා දෙකම පාළියෙහි තිබේ."],["p","F. ධාතුවටත් ත - ප්‍ර‍ත්‍යයටත් අතරෙහි ඉ - කාරයක් යෙදීමෙන් සිදුවන අතීත කිතක පද සුලභ වෙත්."],["p","පච + ඉ + ත = පචිත (පිසූ)"],["p","ගහ + ඉ + ත = ගහිත (ගත්, ගන්නා ලද)"],["p","ඛාද + ඉ + ඛාදිත (කෑ, අනුභව කළ)"],["p","මණ්ඩ + ඉ + ත = මණ්ඩිත (සැරසූ)"],["p","කථ + ඉ + ත = කථිත (කී, කියන ලද)"],["p","ලිඛ + ඉ + ත = ලිඛිත (ලියූ)"],["p","**125. අතීතාර්‍ථයෙහි ඇතැම් ධාතූන් කෙරෙන් න ප්‍ර‍ත්‍යය වේ. ඇතැම් තැනකදී ඒ ප්‍ර‍ත්‍යයේ න් - කාරයට ද්විත්ව වී ධාත්‍වන්ත ව්‍යඤ්ජනය ලොප් වේ. ඇතැම් තැනකදී ධාතුවටත් ප්‍ර‍ත්‍යයටත් අතරෙහි ඉ - කාරයක් හෝ ඊ - කාරයක් ආගම වේ. ධාන්‍වන්ත ව්‍යඤ්ජනය ර යන්න වී නම් ප්‍ර‍ත්‍යයේ න් - කාරය ණ් වේ.**"],["p","ඡිද (කැපීමෙහි) + න = ඡින්න (කැපූ: කැපුණු)"],["p","ඡද (වැසීමෙහි) + න = ඡන්න (වැසූ, වැසුණු)"],["p","භිද (බිඳීමෙහි) + න = භින්න (බිඳුණු, බිඳින ලද)"],["p","නි + සද (හිඳීමෙහි) + ඉ + න = නිසින්න (හුන්)"],["p","තර (එතර කිරීමෙහි) + ඉ + න = තිණ්ණ (එතර වූ)"],["p","පුර (පිරීමෙහි) + න = පුණ්ණ (පිරුණු)"],["p","ජර (දිරීමෙහි) + ඉ + න = ජිණ්ණ (දිරුණු, දිරාගිය)"],["p","දා (දීමෙහි) + ඉ + න = දින්න (දන් දෙන ලද)"],["p","ඛී (ගෙවීයාමෙහි) + ඊ + න = ඛීණ (ගෙවුණු‍් ක්‍ෂය වූ)"],["p","දී (බැගෑබවෙහි) + න = දීන (බැගෑපත්)"],["p","ලූ (සිඳීමෙහි) + න = ලූන (කැපූ)"],["p","පන + හා (දුරුකිරීමෙහි) + ඊ + න = පහීන (දුරු වූ, දුරු කළ)"],["p","ආස (හිඳීමෙහි) + ඊ + න = ආසීන (හුන්)"],["p","**126. ඇතැම් ධාතූන්ගෙන් දෙවිධියක අතීත කිතක පද සෑදෙති.**"],["p","ධාතුව"],["p","පච - පචිත, පක්ක (පිසූ, පැසුණු)"],["p","හර - හරිත, හට (ගෙනගිය)"],["p","වස - වුසිත, වුත්‍ථ (විසූ)"],["p","ඤා - ජානීත, ඤාත (දන්නා ලද)"],["p","ලග - ලගිත, ලග්ග (ඇලුණු)"],["p","කස - කසිත, කට්ඨ (හාන ලද)"],["p","තප - තාපිත, තත්ත (රත් වූ, රත් කළ)"],["p","පුස - පොසිත, පුට්ඨ (පෝෂණය කරන ලද)"],["p","ඡිද - ඡින්‍දිත, ඡින්න (කැපූ, කැපුණු)"],["p","දුස - දූසිත, දුට්ඨ (දූෂිත වූ, නරක් වූ)"],["p","රුස - රොසිත, රුට්ඨ (කෝප වූ)"],["p","ගුප - ගොපිත, ගුත්ත (රක්නා ලද)"]]},{"p":["දිනකරෙ අත්‍ථං ගච්ඡන්තෙ නිසාකරෙ ච උදෙන්තෙ රට්ඨස්ස පාලකො, බුද්ධස්ස සාවකො, මහාරාජා, යාචකානං මහාදානං අදාසි.","“ගොපුරට්ඨා තු දමිළා ඛිපිංසු විවිධායුධෙ පක්කං අයොගුළං චෙව, කඨිතං ච සිලෙසිකං” (මහාවංස)","“මිගෙ අන්තො පවිට්ඨෙ ච ද්වාරං පිදහිංසු: මිගො මනුස්සෙ දිස්වා කම්පමානො මරණභයභීතො අන්තො - නිවෙසනඞ්ගණෙ ආධාවති, පරිධාවති. (වාතමිග ජාතක 14)","“තෙ ජලට්ඨෙ ථලට්ඨෙ ච භුජගෙ’සීති කොටියො සරණෙසු ච සීලෙසු පතිට්ඨාපෙසි නායකො.” (මහාවංස)","“යාදිසං වපතෙ බීජං, තාදිසං හරතෙ ඵලං කල්‍යාණකාරී කල්‍යාණං, පාපකාරී ච පාපකං”","“අන්නදො බලදො හොති වත්‍ථදො හොති වණ්ණදො යානදො සුඛදො හොති, දීපදො හොති චක්ඛුදො සො ච සබ්බදදො හොති යො දදාති උපස්සයං.”","“ආරාමරොපා වනරොපා යෙ ජනා සෙතුකාරකා ධම්මට්ඨා සීලසම්පන්නා තෙ ජනා සග්ගගාමිනො.” (දෙවතා සංයුත්ත)","“සඞ්ගාමමජ්ඣෙ ආකාසෙ නිසින්නො තත්‍ථ නායකො තමං තමොනුදො තෙසං නාගානං භිංසනං අකා.” (මහාවංස)","A.“උය්‍යානපාලො තස්ස මධුමක්ඛිත - තිණෙසු පලුද්ධ භාවං ඤත්‍වා අනුක්කමෙන අත්තානං දස්සෙසි.” (වාතමිග ජාතක) B. වනචාරී පුරෙ ආසිං, සත්තං වනකම්මිකො.” (419 වෙනි අපදානය)","“අතීතෙ ඛාරාණසියං බ්‍ර‍හ්මදත්තෙ රජ්ජං කාරෙන්තෙ බොධිසත්තො කාසිගාමකෙ කුම්භකාරකුලෙ නිබ්බත්තිත්‍වා කුම්භ කාරකම්මං කත්‍වා පුත්තදාරං පොසෙසි.” (178 වෙනි ජාතකය)"],"s":["මණිඅක්ඛික නාරජුගේ අයැදීම නිසා කැලණියට පැමිණි තථාගතයන් වහන්සේ නාගයයන් දුන් මිණි පලඟෙහි වැඩ හුන්හ.","එහිදී නාගයෝ දිව්‍යමය ආහාර පානයෙන් පිරිස් සහිත සම්බුද්ධයන් වහන්සේ වැළඳවූහ.","ආහාර දෙන්නා ආයුෂ දෙන්නෙක් ද වර්ණය දෙන්නෙක් ද සැපය දෙන්නෙක් ද වේ.","ගොවියා යම් බීජ වර්‍ගයක් වපුරා නම් ඊට සමාන ඵල වර්ගයක්ම ලබයි. එමෙන් කුසල් කරන්නා යහපත් විපාක ද අකුසල් කරන්නා අයහපත් විපාකද ලබයි.","“දුටුගැමුණු රජතුමා එක්සිය විසිරියන් උසැති මහ දාගැබක් කරවන්නේය”යි දෙවානම්පියතිස්ස රජතුමා විසින් ශිලා ලිපියක් පිහිටුවන ලදි.","දෙවනපෑතිස් මහරජු විසින් මිහින්තලයෙහි ගල්ලෙන් සැටක් කරවන ලදහ. ඒවා අද දක්වාත් විද්‍යමාන වෙති.","ධර්‍මධරයා මත්පැන් බොන්නන්ට අවවාද කොට ඔවුන් අමද්‍යපයන් කෙළේ ය.","යාදකයන්ට ධනය දෙන්නා ද වස්ත්‍ර‍ දෙන්නා ද වාසස්ථාන දෙන්නා ද ලෝවැස්සන් විසින් පසස්නා ලද්දෝ වෙති.","රජතුමා රටවැසියන් පාලනය කරන්නා ද ඔවුන්ගේ නායකයා ද ස්වාමියා ද වේ.","ගොඩවැසි වූ ද දියවැසි වූ ද සියලු සත්වයෝ ආහාරය නොමැතිව ජීවත් වීමට අසමර්ථ වෙත්.","සිතියම් කරන්නා පිළිම ගෙය තුළ ලෝක නායක වූ දීපඞ්කරාදි තථාගතයන් වහන්සේගේ පිළිරූ අඳියි.","මාලාකාරයා රෙදි වියන්නා ලවා වස්ත්‍ර‍යක් වියවා රන්කරුවාට දුන්නේ ය.","පින් කැමති ධාන්‍ය මනින්නා බුද්ධ ශ්‍රාවකයන්ට දන් දෙන්නෙක් විය.","වනයෙහි හැසිරෙන දුනුවායා බොහෝ ඌරු මුව ආදීන් මරා ඔවුන්ගේ මස් විකුණා ජිවිකාව කෙළේ ය."],"gp":[["අත්‍ථ","විනාසය, බැසීම. පු."],["අන්තො නිවෙසනඞ්ගණ","ගෙය ඇතුළේ මිදුල. න."],["අයොගුළ","යකඩගුළිය. පු."],["ආධාවති","එහා මෙහා දුවයි."],["ආරාම","(මල් හෝ පලතුරු) වත්ත පු."],["ආසිං","වීමි."],["උපස්සය","ගෙය. පු."],["පක්ක","රත්කළ. 3."],["පතිට්ඨාපෙති","පිහිටුවයි."],["පරිධාවති","හාත්පස දුවයි"],["පලුද්ධභාව","ඉතා ඇලුණුබව. පු."],["පවිට්ඨ"  කෙරෙන් අ - අක - අන - ආවි - තු යන ප්‍ර‍ත්‍යයෝ වෙති.**"],["p","**(1) අ ප්‍ර‍ත්‍යය**"],["p","ධම්මං + ධර + අ = ධම්මධර (ධර්‍මය දරන)"],["p","හිතං + කර + අ = හිතකර (හිතවත් දේ කරන)"],["p","දිනං + කර + අ = දිනකර (හිරු, දවස කරන)"],["p","ධනුං + ගහ + අ = ධනුග්ගහ (දුනුවායා.)"],["p","සබ්බං + දා + අ = සබ්බද, සබ්බද්ද (සියල්ල දෙන)"],["p","මජ්ජං + පා + අ = මජ්ජප්ප (මත්පැන් බොන)"],["p","කර්‍මපදයක් නොව සත්තමියෙන් යුත් පදයක් මුලින් සිටි විට ද අ - ප්‍ර‍ත්‍යය වන බව පෙනේ :-"],["p","වනෙ + චර + අ = වනචර (වනයෙහි හැසිරෙන)"],["p","ථලෙ + ඨා + අ = ථලට්ඨ (ගොඩසිටි හෝ පිහිටි)"],["p","ජලෙ + ඨා + අ = ජලට්ඨ (දියෙහි වූ)"],["p","සිරස්මිං + රුහ + අ = සිරොරුහ (හිසකෙස්)"],["p","**(2) අක - ප්‍ර‍ත්‍යය පර විට ඇතැම් තැන වෘද්‍ධිය වේ :-**"],["p","දා + අක = දායක (දෙන්නා, දෙන)"],["p","නී + අක = නායක (නායකයා, ප්‍ර‍ධානියා)"],["p","කර + අක = කාරක (කරන්නා)"],["p","සු + අක = සාවක (අසන්නා, ශ්‍රාවකයා)"],["p","පු + අක = පාවක (ශුද්‍ධ කරන්නා, ගින්න)"],["p","ගහ + අක = ගාහක (ගන්නා.)"],["p","පාල + අක = පාලක (රකින්නා)"],["p","යාච + අක = යාචක (සිඟන්නා)"],["p","**(3) අන - ප්‍ර‍ත්‍යයෙන් භාවාර්‍ථ පද පමණක් සෑදෙති.**"],["p","ගහ + අන = ගහන (ගැනීම, ගැන්ම)"],["p","භුජ + අන = භොජන (අහාරය, අනුභව කිරීෟම)"],["p","සු + අන = සවණ (ඇසීම)"],["p","භු + අන = භවන (වීම)"],["p","පච + අන = පවන (පිසීම"],["p","**(4) ආවී - ප්‍ර‍ත්‍යයෙන් සිදුවන පද බොහෝ නොවෙති.**"],["p","භයං + දිස + ආවී = භයදස්සාවී (භය දකින්නා)"],["p","**(5) තු - ප්‍ර‍ත්‍යය**"],["p","A. මෙය පර වූ විට ධාත්‍වන්ත ව්‍යඤ්ජනය ඇතැම් විට ත් - බවට පැමිණේ."],["p","කර + තු = කත්තු (කරන්නා, කර්‍තෘ)"],["p","හර + තු = හත්තු (ගෙන යන්නා)"],["p","භර + තු = භත්තු (පෝෂකයා, ස්වාමියා)"],["p","ගමු + තු = ගන්තු (යන්නා)"],["p","වද + තු = වන්තු (කියන්නා)"],["p","මන + තු = මන්තු (හඟින්නා)"],["p","දා + තු = දාතු (දෙන්නා)"],["p","ඤා + තු = ඤාතු (දන්නා)"],["p","(ඇතැම් විට යයි කී බැවින් ගන්තු මන්තු දෙතැන්හි ධාත්‍වන්තයට ත් - නොවේ.)"],["p","**B. ඇතැම් විට ධාතුවේ මුල් ස්වරයට වෘද්‍ධි වේ :-**"],["p","ඡිද + තු = ඡෙත්තු (කපන්නා)"],["p","ජි + තු = ජෙතු (දිනන්නා)"],["p","සු + තු = සොතු (අසන්නා)"],["p","**ක්‍රියාමූලයන් කෙරෙන් ද තු ප්‍රත්‍යය යෙදේ.**"],["p","පාලෙ + තු = පාලෙතු (රකින්නා)"],["p","පාලය + ඉ + තු = පාලයිතු (රකින්නා)"],["p","කාරෙ + තු = කාරෙතු (කරවන්නා)"],["p","හාරෙ + තු = හාරෙතු (ගෙනයන්ට සලස්වන්නා)"],["p","මාරෙ + තු = මාරෙතු (මරන්නා)"],["p","**129. ඇතැම් ධාතූන් කෙරෙන් කර්‍තෘ අර්ථයෙහි ණි-ප්‍ර‍ත්‍යය වේ.**"],["p","ඡත්තං + ගහ + ණී = ඡත්තගාහී (කුඩය අල්වන්නා)"],["p","පාපං + කර + ණී = පාපකාරී (පව් කරන්නා)"],["p","ඛීරං + පා + ණී = ඛීරපායී (කිරි බොන්නා)"],["p","ධම්ම + වද + ණී = ධම්මවාදී (ධර්‍මය කියන්නා)"],["p","සීඝං + යා + නී = සීඝයායී (ඉක්මනින් යන්නා.)"],["p","අන්නං + දා + ණී + අන්නදායී (ආහාර දෙන්නා)"],["p","**130. අන්‍ය නාමයකින් පර වූ ඇතැම් ධාතූන් කෙරෙන් ර - ප්‍ර‍ත්‍යය වේ. එහි ර් - කාරය ධාත්‍වන්ත ව්‍යඤ්ජනය සමග විනාශයට පැමිණේ.**"],["p","භුජ + ගමු + ර = භුජග (සර්පයා) “භුජෙන ගච්ඡති” = කඳෙන් යයි යන අර්ථයෙහියි."],["p","කුඤ්ජ + රමු + ර = කුඤ්ජර (ඇතා) “කුඤ්ජෙ රමති” = පඳුරෙහි ඇලේ යන අර්ථයෙහියි."],["p","කම්ම + ජන + ර = කම්මජ (කර්‍මයෙන් හටගත්) “කම්මෙන ජාතො” යන අර්ථයෙහියි."],["p","පඞ්ක + ජන + ර = පඞ්කජ (පියුම) පඞ්කෙ ජාතො” මඩෙහි උපන්නේ යන අර්ථයෙහියි."],["p","ථල + ජන + ර = ථලජ (ගොඩ හටගත්) “ථලෙ ජාතො” යන අර්ථයෙහියි."],["p","අණ්ඩ + ජන + ර = අණ්ඩජ (පක්‍ෂියා හෝ සර්පයා) “අණ්ඩතො ජාතො” බිජුවටින් හටගත්තේ යන අර්ථයෙහියි."]]},{"p":["“සො කිර පඤ්චපණ්ණාසවස්සානි සූකරෙ වධිත්‍වා ඛාදන්තො ච වික්කිණන්තො ච ජීවිකං කප්පෙසි.” (චුන්‍දසූකරික)","“භික්ඛූ තස්ස ඝරද්වාරෙන ගච්ඡන්තා තං සද්දං සුත්‍වා විහාරං ගන්ත්‍වා සත්‍ථුසන්තිකෙ නිසින්නා එවමාහංසු :- “භන්තෙ චුන්‍දසූකරිකස්ස ගෙහද්වාරං පිදහිත්‍වා සූකරානං මාරීයමානානං අජ්ජ සත්තමො දිවසො.” (ධ. අටුවා)","“අන්‍ධබාලපිතරං නිස්සාය එවරූපං බුද්ධං උපසංකමිත්‍වා කායවෙය්‍යාවතිකං වා කාතුං දානං වා දාතුං ධම්මං වා සොතුං නාලත්‍ථං. අඤ්ඤං කත්තබ්බං නත්‍ථීති මනමෙව පසාදෙසි.” (මට්ටකුණ්ඩලී වත්‍ථු)","“තතො සො තතියෙ වස්සෙ නාගින්‍දො මණ්අක්ඛිකො උපසංකම්ම සම්බුද්‍ධං සහසඞ්ඝං නිමන්තයි” (මහාවංස)","“අත්තනො පටියාදෙන ඛජ්ජභොජ්ජෙන තප්පිය සම්බුද්‍ධභාසිතං ධම්මං සාමණෙරමපුච්ඡි තං.” (එම)","“භුසාපෙත්‍වාන නගරං ගන්ත්‍වා සංඝං නිමන්තිය ඝරං නෙත්‍වාන භොජෙත්‍වා දත්‍වා සාමණකං බහුං සත්‍ථරා දෙසිතො ධම්මො කිත්තකොති අපුච්ඡථ.” (එම)","“නිපච්ච සිරසා තස්ස අනන්තගුණ සාගරෙ නිමුග්ගො පීතිසම්පුණ්ණො ඉදං වචනමබ්‍රවී.” (වක්කලිත්‍ථෙරාපදාන) - “භවනා අභිනික්ඛම්ම අද්දසං ලොක නායකං ඉන්‍දීවරංව ජලිතං ආදිත්තංව හුතාසනං.” (මණිපූජකාපදාන)","“රඤ්ඤා පන වන්‍දිතෙ භගවන්තං අවන්‍දිත්‍වා ඨාතුං සමත්‍ථො නාම එකොපි සාකියො නාහොසි, සබ්බෙ වන්‍දිංසු යෙව.” (ජාතක නිදාන)","“රාජා සංවිග්ගහදයො හත්‍ථෙන සාටකං සණ්ඨපෙන්තො තුරිතතුරිතං නික්ඛමිත්‍වා වෙගෙන ගන්ත්‍වා භගවතො පුරතො ඨත්‍වා ආහ....කිං එත්තකානං භික්ඛූනං න සක්කා භත්තං ලද්‍ධුන්ති සඤ්ඤං කරිත්‍ථාති.” (එම)","“කනත්‍ථකො ඡන්නෙන සද්‍ධිං මන්තයමානස්ස බොධි සත්තස්ස වචනං සුණන්තො ඨත්‍වා....... සොකං අධිවාසෙතුං අසක්කොන්තො හදයෙන එලිතෙන කාලංකත්‍වා තාවතිංස භවනෙ.......නිබ්බත්ති.” (ජාතක නිදාන)","“පරූළ්හ - කච්ඡ - නඛ - ලොමො අහං කම්මෙසු ව්‍යාවටො චිරස්සං නහාපිතං ලද්‍ධා ලොමං තම්පහාරයිං.” (391 කාකජාතක)"],"s":["සර්‍වඥයන් වහන්සේ සැවැත් නුවර වසනසේක් මට්ටකුණ්ඩලියා අරබයා මේ ගාථාව දේශනා කළ සේක.","චුන්දසූකරිකයා පනස්පස් අවුරුද්දක් ඌරන් මරමින් ජීවිකාව කොට මැරී ගොස් - නරකයෙහි උපන්නේ ය.","බ්‍රාහ්මණයා වෙදුන්ට ධනය දෙන්ට නොකැමැති වූයේ වෙදුන් සමීපයට ගොස් “තොපි අසවල් රෝගයට කිනම් බෙහෙතක් කරව්දැ” යි අසයි.","පිරුණු ගඟෙන් එතෙර වූ සොරා තමාගේ මිත්‍ර‍යන් විසින් රක්නා ලද වන රොදට ඇතුළුව හුන්නේ ඔවුන් දුන් ආහාරය අනුභව කෙළේ ය.","දේවල තාපස තෙමේ හිමාලයෙන් අවුත් නුවර දොර සමීපයෙහි සිටි ළමයින් දැක “මේ නුවරට පැමිණි තාපසවරු කොතැන්හි වාසය කරත්දැ”යි ඇසීය.","වෙදුන් කී පොතු ආදිය ගෙනවුත් බෙහෙත් කරනු ලබන කල්හිම මට්ටකුණ්ඩලීගේ රෝගය බලවත් විය.","පෙර එක් වෙළෙන්දෙක් තමාගේ වෙළඳ සැල සමීපයට පැමිණි පසේ බුදුවරයකුගේ පාත්‍ර‍ය පුරවා මී පැණි දුන්නේ ය.","සුද්ධොදන රජු භාග්‍යවතුන් වහන්සේට වැන්ද කල්හි ඉතිරි ශාක්‍ය රජවරුත් ශාක්‍ය කුමාරවරුත් උන්වහන්සේට නොවැඳ සිටින්ට අසමර්ථ වූහ.","තථාගතයන් වහන්සේ කපිලවාස්තු නගරයෙහි පිඬු පිණිස හැසිරෙන කල්හි පියරජතුමා ඒ ප්‍ර‍වෘත්තිය දැන වහා අවුත් “ස්වාමීනි, අපගේ කුලයට නින්‍දා නොකරවුව මැනැවැ” යි කී ය.","යකින්නිය මිනිස් වෙසින් අවුත් “ඕතොමෝ පුතකු වැදුවා ද නැතහොත් දුවක දැයි බලන්නෙමි”යි කියමින් ගෙට ඇතුළු ව දරුවා ගෙන ඇය බලා සිටිය දී කා ගියා ය.","ඉක්බිති ස්ථවිරතුමා ‘තා වැනි පාපියකු විසින් මාගේ සැර යටිය නොගත යුතු ය’ යි කියා ඔහු පලවා හැරියේ ය.","හෙතෙම ‘මා විසින් බැරෑරුම් ව ","චොරය + ඉ + තුං = චොරයිතුං (සොරකම් කරන්ට)"],["p","පාලෙ + තුං = පාලෙතුං (රකින්ට)"],["p","පාලය + ඉ + තුං = පාලයිතුං (රකින්ට)"],["p","දෙසෙ + තුං = දෙසෙතුං (දේශනා කරන්ට)"],["p","දෙසය + ඉ + තුං = දෙසයිතුං (දෙසන්ට)"],["p","**කාරිත ක්‍රියාමූලයෝ**"],["p","කාරෙ + තුං = කාරෙතුං (කරවන්ට)"],["p","කාරය + ඉ + තුං = කාරයිතුං (කරවන්ට)"],["p","මාරාපෙ + තුං = මාරාපෙතුං (මරවන්ට)"],["p","මාරාපය + ඉ + තුං = මාරාපයිතුං (මරවන්ට)"],["p","ගාහෙ + තුං = ගාහෙතුං (ගන්වන්ට)"],["p","ගාහාපය + ඉ + තුං = ගාහාපයිතුං (ගන්වන්ට)"],["p","133. පූර්‍වක්‍රියා පදයන් සම්පාදනය සඳහා ධාතූන් කෙරෙන් ත්‍වා - ත්‍වාන - තූන - ය - ත්‍ය යන ප්‍ර‍ත්‍යයෝ වෙති."],["p","A. ඇතැම් විට මේ ප්‍ර‍ත්‍යයන් හා ධාතූන්ගේ අතරෙහි මකාරාගමයක් වේ."],["p","B. ඇතැම් විට මේ ප්‍ර‍ත්‍යයන් පර කල්හි ධාත්‍වන්ත ව්‍යඤ්ජනය ලොප් වේ."],["p","C. ඇතැම් ධාතූන්ගේ දීර්ඝ වූ අන්තස්වරය හ්‍ර‍ස්ව වේ. ඇතැම් තැනක ස්වරයට වෘද්‍ධි වේ."],["p","D. ස්වල්ප තැනක ධාත්‍වන්ත ව්‍යඤ්ජනය සමග ප්‍ර‍ත්‍යයන්ගේ ත් කාරය විකාරයට පැමිණේ. ඇතැම් විට ත් - කාරය ලොප් වේ."],["p","**ඉකාරාගමය සිදු වූ තැන් :-**"],["p","පච + ඉ + ත්‍වා = පචිත්‍වා (පිස)"],["p","කර + ඉ + ත්‍වාන = කරිත්‍වාන (කොට)"],["p","වන්‍ද + ඉ + තූන = වන්‍දිතූන (වැඳ)"],["p","වන්‍ද + ඉ + ය = වන්‍දිය (වැඳ)"],["p","**ක්‍රියා මූලයන් හා එක් වූ තැන්**"],["p","භුඤ්ජ + ඉ + ත්‍වා = භුඤ්ජිත්‍වා (අනුභව කොට)"],["p","සය + ඉ + ත්‍වාන = සයිත්‍වාන (නිදා)"],["p","සුණ + ඉ = තූන = සුණිතූන (අසා)"],["p","ජහ + ඉ + ත්‍වා = ජහිත්‍වා (දුරුකොට, අත්හැර)"],["p","**ධාත්‍වන්ත ව්‍යඤ්ජනය ලොප් වූ තැන් :-**"],["p","කර + ත්‍වා = කත්‍වා (කොට)"],["p","හන + ත්‍වා = හත්‍වා (නසා) හන්ත්‍වා කියාත් සිටී."],["p","භුජ + ත්‍වා = භුත්‍වා (අනුභව කොට)"],["p","පද + ත්‍වා = පත්‍වා (පැමිණ, ලබා)"],["p","චජ + ත්‍වා = චත්‍වා (හැරදමා)"],["p","ඡිද + ත්‍වා = ඡෙත්‍වා (කපා, සිඳ දමා)"],["p","භිද + ත්‍වා = භෙත්‍වා (බිඳ)"],["p","D.අන්තස්වරය හ්‍ර‍ස්ව වූ හෝ වෘද්‍ධියට පැමිණි තැන් :-"],["p","දා + ත්‍වා = දත්‍වා (දී) හූ + ත්‍වා = හුත්‍වා (වී)"],["p","ඤා + ත්‍වා = ඤත්‍වා (දැන) ඨා + ත්‍වා = ඨත්‍වා (සිට)"],["p","නී + ත්‍වා = නෙත්‍වා (ගෙන ගොස්: පමුණුවා)"],["r","E.\t(1) ත් - කාරය ලොප් වූ තැන :-"],["
