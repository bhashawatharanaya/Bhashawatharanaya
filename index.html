<style>
/* Layout: ola-leaf strip header, chip navigation of six sections, single reading column with tables in scroll boxes */
:root{

*{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.75;

.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:420px;font-size:.95rem}

.back{align-self:flex-start;font:inherit;background:none;border:none;color:var(--accent);cursor:pointer;padding:0}
.pali{font-family:var(--display);font-size:1.15rem}
.btn{font:inherit;background:var(--accent);color:var(--bg);border:none;border-radius:6px;padding:8px 16px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btns{display:flex;flex-wrap:wrap;gap:8px}

.card{background:var(--leaf);border-radius:10px;min-height:190px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:24px;text-align:center;cursor:pointer;border:none;font:inherit;color:inherit;width:100%}
.card .big{font-family:var(--display);font-size:2rem}
.card .hint{color:var(--muted);font-size:.85rem}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:.88rem;font-variant-numeric:tabular-nums}

.opt{font:inherit;text-align:left;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:10px 14px;cursor:pointer;width:100%}

.fb{margin:0;font-size:.95rem}
.reveal{color:var(--muted)}
.reveal.show{color:var(--ink)}
.derive{font-family:var(--display);font-size:1.1rem}
.derive b{color:var(--accent)}

</style>
</head>

let state={sec:"lessons",lesson:null,ci:0,flip:false,qi:0,score:0,ans:null};

function save(){try{localStorage.setItem("pb2",JSON.stringify({sec:state.sec}))}catch(e){}}
function esc(t){return String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

function renderNav(){
 $("#nav").innerHTML=SECTIONS.map(([k,l])=>`<button type="button" data-sec="${k}" aria-pressed="${state.sec===k}">${l}</button>`).join("");

}

 else if(l.table){tbl=`<div class="tbl"><table><thead><tr><th>විභත්ති</th><th>ඒකවචන</th><th>බහුවචන</th></tr></thead><tbody>${CASES.map((c,j)=>`<tr><td>${c}</td><td>${l.table[j][0]}</td><td>${l.table[j][1]}</td></tr>`).join("")}</tbody></table></div>`}
 else if(l.pairs){tbl=`<div class="tbl"><table><thead><tr><th>පාලි</th><th>අර්ථය</th></tr></thead><tbody>${l.pairs.map(p=>`<tr><td>${p[0]}</td><td>${p[1]}</td></tr>`).join("")}</tbody></table></div>`}
 V().innerHTML=`<button type="button" class="back">‹ සියලු පාඩම්</button>

 <div class="panel"><p style="margin:0">${l.intro}</p></div>
 <div class="panel"><h3>${l.verb?"වරනැගීම (පච ධාතුව)":l.pairs?"නිදසුන් පද":"වරනැගීම"}</h3>${tbl}</div>
 <div class="panel"><h3>නිදසුන් වාක්‍ය</h3>${l.ex.map(e=>`<div><div class="pali">${e[0]}</div><div class="reveal show">${e[1]}</div></div>`).join("")}</div>
 <div class="btns">${i>0?`<button type="button" class="btn ghost" data-go="${i-1}">‹ පෙර පාඩම</button>`:""}${i<LESSONS.length-1?`<button type="button" class="btn" data-go="${i+1}">ඊළඟ පාඩම ›</button>`:""}</div>`;
 V().querySelector(".back").onclick=()=>{state.lesson=null;render()};
 V().querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{state.lesson=+b.dataset.go;render();scrollTo(0,0)});
}
function cards(){

 V().innerHTML=`<div><h2>වචන කාඩ්පත්</h2><p class="note">කාඩ්පත තට්ටු කර අර්ථය බලන්න.</p></div>
 <button type="button" class="card" id="card" aria-label="කාඩ්පත පෙරළන්න">${state.flip?`<span class="hint">${w[0]}</span><span class="big" style="font-size:1.6rem">${w[1]}</span>`:`<span class="big">${w[0]}</span><span class="hint">අර්ථය බැලීමට තට්ටු කරන්න</span>`}</button>
 <div class="meta"><span>${state.ci+1} / ${VOCAB.length}</span><span>පාලි → සිංහල</span></div>
 <div class="btns"><button type="button" class="btn ghost" id="prev">‹ පෙර</button><button type="button" class="btn" id="next">ඊළඟ ›</button><button type="button" class="btn ghost" id="shuf">මිශ්‍ර කරන්න</button></div>`;
 $("#card").onclick=()=>{state.flip=!state.flip;cards()};
 $("#prev").onclick=()=>{state.ci=(state.ci-1+VOCAB.length)%VOCAB.length;state.flip=false;cards()};
 $("#next").onclick=()=>{state.ci=(state.ci+1)%VOCAB.length;state.flip=false;cards()};
 $("#shuf").onclick=()=>{for(let i=VOCAB.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[VOCAB[i],VOCAB[j]]=[VOCAB[j],VOCAB[i]]}state.ci=0;state.flip=false;cards()};
}
function quiz(){
 if(state.qi>=QUIZ.length){
  V().innerHTML=`<div><h2>ප්‍රශ්නාවලිය අවසන්</h2></div><div class="panel"><p class="pali" style="margin:0">ලකුණු: ${state.score} / ${QUIZ.length}</p><div class="btns"><button type="button" class="btn" id="again">නැවත උත්සාහ කරන්න</button></div></div>`;
  $("#again").onclick=()=>{state.qi=0;state.score=0;state.ans=null;quiz()};return}
 const [q,opts,c,ex]=QUIZ[state.qi];
 V().innerHTML=`<div><h2>ප්‍රශ්න</h2></div>
 <div class="meta"><span>ප්‍රශ්නය ${state.qi+1} / ${QUIZ.length}</span><span>ලකුණු ${state.score}</span></div>
 <div class="panel"><p class="pali" style="margin:0">${q}</p>
 ${opts.map((o,i)=>{let cl="opt";if(state.ans!==null){if(i===c)cl+=" right";else if(i===state.ans)cl+=" wrong"}return`<button type="button" class="${cl}" data-o="${i}" ${state.ans!==null?"disabled":""}>${o}</button>`}).join("")}
 ${state.ans!==null?`<p class="fb"><b style="color:var(${state.ans===c?"--ok":"--bad"})">${state.ans===c?"නිවැරදියි!":"වැරදියි."}</b> ${ex}</p><div class="btns"><button type="button" class="btn" id="nq">ඊළඟ ප්‍රශ්නය ›</button></div>`:""}</div>`;
 V().querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{state.ans=+b.dataset.o;if(state.ans===c)state.score++;quiz()});
 const n=$("#nq");if(n)n.onclick=()=>{state.qi++;state.ans=null;quiz()};
}

  $("#tl").querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{const r=$("#r"+b.dataset.r);r.hidden=!r.hidden;r.classList.add("show");b.textContent=r.hidden?"පිළිතුර":"සඟවන්න"})};
